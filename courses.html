<!-- Shark UP Academy - النسخة النهائية المستقرة -->

<!-- 1. استدعاء المكتبات الأساسية لضمان عملها داخل الـ WebView -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
    // 2. تعريف كائن الأكاديمية فوراً لمنع أي أخطاء ReferenceError
    window.academy = {
        currentTab: 'courses',
        toggleSeller: () => {
            const p = document.getElementById('sellerPanel');
            if(p) p.classList.toggle('hidden');
        },
        openModal: (id) => {
            document.getElementById(id)?.classList.remove('hidden');
            document.getElementById('sellerPanel')?.classList.add('hidden');
        },
        closeModal: (id) => {
            document.getElementById(id)?.classList.add('hidden');
        },
        // دوال وهمية سيتم تحديثها عند تشغيل Firebase
        switchTab: () => {},
        saveData: () => {}
    };
</script>

<div class="max-w-2xl mx-auto px-4 pt-6 space-y-6 pb-28">
    <!-- كارت الهيدر -->
    <div class="bg-gradient-to-br from-sky-600 to-blue-800 rounded-[2rem] p-6 text-white shadow-2xl relative overflow-hidden">
        <h2 class="text-xl font-black mb-1">📚 أكاديمية Shark UP</h2>
        <p class="text-[10px] opacity-80">إدارة الكورسات والمقالات</p>
        <div class="mt-4 flex gap-3 text-center">
            <div class="bg-white/10 px-4 py-2 rounded-xl flex-1 border border-white/5">
                <span class="block text-[9px] opacity-70">المحتوى المتوفر</span>
                <span id="itemsCount" class="text-sm font-bold">0</span>
            </div>
        </div>
    </div>

    <!-- التبويبات -->
    <div class="flex gap-2 bg-white p-1 rounded-2xl shadow-sm border border-gray-100">
        <button id="tabCourses" class="flex-1 py-3 rounded-xl font-bold text-xs bg-sky-500 text-white transition-all" onclick="window.academy.switchTab('courses')">الكورسات</button>
        <button id="tabArticles" class="flex-1 py-3 rounded-xl font-bold text-xs text-gray-500 transition-all" onclick="window.academy.switchTab('articles')">المقالات</button>
    </div>

    <!-- شبكة المحتوى -->
    <div id="contentGrid" class="grid gap-4 min-h-[200px]">
        <div class="flex flex-col items-center justify-center py-10 space-y-3">
            <div class="w-6 h-6 border-2 border-sky-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-gray-400 text-xs">جاري الاتصال بـ Firebase...</p>
        </div>
    </div>
</div>

<!-- أزرار الإضافة -->
<button onclick="window.academy.toggleSeller()" class="fixed bottom-6 left-6 w-14 h-14 bg-white shadow-2xl rounded-2xl border flex items-center justify-center z-50 active:scale-90 transition-transform">
    <i class="fa-solid fa-plus text-sky-500 text-xl"></i>
</button>

<div id="sellerPanel" class="hidden fixed bottom-24 left-6 right-6 z-50 grid grid-cols-2 gap-3 animate-bounce-in">
    <button onclick="window.academy.openModal('addModal')" class="bg-sky-600 text-white p-5 rounded-[1.5rem] text-[10px] font-bold shadow-xl flex flex-col items-center gap-2">
        <i class="fa-solid fa-plus-circle text-lg"></i> إضافة جديد
    </button>
</div>

<!-- مودال الإضافة -->
<div id="addModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-[2rem] p-6 space-y-4 shadow-2xl">
        <div class="flex justify-between items-center">
            <h3 class="font-black text-gray-800">إضافة محتوى جديد</h3>
            <button onclick="window.academy.closeModal('addModal')" class="text-gray-400 text-lg">✕</button>
        </div>
        <input id="newTitle" class="w-full bg-gray-50 border-none rounded-xl p-4 text-sm outline-none focus:ring-2 focus:ring-sky-500" placeholder="العنوان...">
        <textarea id="newDesc" class="w-full bg-gray-50 border-none rounded-xl p-4 text-sm outline-none focus:ring-2 focus:ring-sky-500" rows="4" placeholder="اكتب التفاصيل هنا..."></textarea>
        <button id="btnSave" onclick="window.academy.saveData()" class="w-full bg-sky-600 text-white py-4 rounded-xl font-bold shadow-lg active:scale-95 transition-all">نشر الآن</button>
    </div>
</div>

<script>
    // 3. المحرك البرمجي الرئيسي
    (function startApp() {
        // التأكد من تحميل المكتبات
        if (typeof firebase === 'undefined') {
            setTimeout(startApp, 500);
            return;
        }

        const config = {
            apiKey: "AIzaSyB_2ms4K8EPbag7uab9gbDy8eePY6xwpxc",
            authDomain: "millionaireapp-be931.firebaseapp.com",
            projectId: "millionaireapp-be931",
            storageBucket: "millionaireapp-be931.firebasestorage.app",
            messagingSenderId: "325577904362",
            appId: "1:325577904362:web:8d85d4547bf22b1d8f4793"
        };

        if (!firebase.apps.length) firebase.initializeApp(config);
        const db = firebase.firestore();

        // تحديث منطق الدوال الحقيقي
        window.academy.loadData = async function() {
            const grid = document.getElementById('contentGrid');
            const collection = this.currentTab === 'courses' ? "academy_courses" : "academy_articles";
            
            try {
                const snap = await db.collection(collection).orderBy("createdAt", "desc").limit(15).get();
                document.getElementById('itemsCount').innerText = snap.size;
                
                if (snap.empty) {
                    grid.innerHTML = '<div class="text-center py-20 text-gray-400 text-[10px]">لا يوجد بيانات في هذا القسم</div>';
                    return;
                }

                grid.innerHTML = snap.docs.map(doc => `
                    <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm transition-all hover:border-sky-200">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-[8px] font-bold px-2 py-1 rounded bg-sky-50 text-sky-600 uppercase tracking-tighter">
                                ${this.currentTab === 'courses' ? 'Course' : 'Article'}
                            </span>
                        </div>
                        <h4 class="font-bold text-gray-800 text-sm">${doc.data().title}</h4>
                        <p class="text-[10px] text-gray-500 mt-1 leading-relaxed line-clamp-3">${doc.data().desc}</p>
                    </div>
                `).join('');
            } catch(e) {
                grid.innerHTML = `<div class="text-center text-red-400 text-[10px]">خطأ: تأكد من إعدادات Firestore Rules</div>`;
            }
        };

        window.academy.switchTab = function(tab) {
            this.currentTab = tab;
            const isC = tab === 'courses';
            document.getElementById('tabCourses').className = isC ? 'flex-1 py-3 rounded-xl font-bold text-xs bg-sky-500 text-white' : 'flex-1 py-3 rounded-xl font-bold text-xs text-gray-500';
            document.getElementById('tabArticles').className = !isC ? 'flex-1 py-3 rounded-xl font-bold text-xs bg-sky-500 text-white' : 'flex-1 py-3 rounded-xl font-bold text-xs text-gray-500';
            this.loadData();
        };

        window.academy.saveData = async function() {
            const t = document.getElementById('newTitle').value;
            const d = document.getElementById('newDesc').value;
            const btn = document.getElementById('btnSave');

            if (!t || !d) return alert("من فضلك أدخل العنوان والوصف");

            btn.disabled = true;
            btn.innerText = "جاري النشر...";
            
            const collection = this.currentTab === 'courses' ? "academy_courses" : "academy_articles";
            
            try {
                await db.collection(collection).add({
                    title: t,
                    desc: d,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                alert("تم النشر بنجاح! 🎉");
                document.getElementById('newTitle').value = "";
                document.getElementById('newDesc').value = "";
                this.closeModal('addModal');
                this.loadData();
            } catch(e) {
                alert("خطأ أثناء الحفظ: " + e.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "نشر الآن";
            }
        };

        // البدء بجلب البيانات
        window.academy.loadData();
    })();
</script>

    .animate-fade-in { animation: fadeIn 0.4s ease forwards; }
