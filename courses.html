<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>الأكاديمية – Shark UP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: 'Tajawal', sans-serif; background: #f0f2f5; margin: 0; }
    .tab-btn.active { background: #0ea5e9; color: white; }
    .card-item { transition: all 0.2s ease; }
    .card-item:active { transform: scale(0.98); }
    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      z-index: 1000; align-items: center; justify-content: center; padding: 1rem;
    }
    .modal.active { display: flex; }
    .hashtag-btn { transition: all 0.2s; }
    .hashtag-btn.active { background: #0ea5e9; color: white; }
    .hashtag-select { cursor: pointer; user-select: none; }
  </style>
</head>
<body class="bg-gray-50 h-full overflow-y-auto">

  <div id="academy-root" class="max-w-2xl mx-auto px-4 pt-6 pb-20 space-y-6">
    <div class="bg-gradient-to-br from-sky-500 to-blue-600 rounded-3xl p-6 text-white shadow-xl">
      <h2 class="text-2xl font-black mb-2">📚 أكاديمية Shark UP</h2>
      <p class="opacity-90 text-sm">دورات ومقالات مجانية – انشر معرفتك أو تعلّم من الخبراء</p>
      <div class="mt-3 flex gap-3 text-xs">
        <span class="bg-white/20 px-3 py-1 rounded-full" id="coursesCount">0 كورس</span>
        <span class="bg-white/20 px-3 py-1 rounded-full" id="articlesCount">0 مقال</span>
      </div>
    </div>

    <div class="flex gap-2 bg-gray-100 p-1 rounded-full">
      <button id="tabCourses" class="tab-btn flex-1 py-2 rounded-full font-bold text-sm active" onclick="academy.switchTab('courses')">
        📚 الكورسات
      </button>
      <button id="tabArticles" class="tab-btn flex-1 py-2 rounded-full font-bold text-sm" onclick="academy.switchTab('articles')">
        📝 المقالات
      </button>
    </div>

    <div class="flex flex-wrap gap-2" id="filterHashtags"></div>

    <div id="sellerPanel" class="hidden flex gap-2">
      <button onclick="academy.openAddCourseModal()" class="flex-1 bg-sky-500 text-white py-3 rounded-2xl font-bold shadow-lg hover:bg-sky-600 transition text-sm">
        <i class="fa-solid fa-plus-circle"></i> أضف كورس
      </button>
      <button onclick="academy.openAddArticleModal()" class="flex-1 bg-emerald-500 text-white py-3 rounded-2xl font-bold shadow-lg hover:bg-emerald-600 transition text-sm">
        <i class="fa-solid fa-pen-to-square"></i> اكتب مقال
      </button>
    </div>

    <div id="contentGrid" class="grid gap-4"></div>

    <button id="toggleSellerBtn" onclick="academy.toggleSellerMode()"
      class="fixed bottom-24 right-4 z-30 w-14 h-14 bg-gray-200 rounded-2xl flex items-center justify-center text-gray-600 text-xl shadow-lg hover:bg-gray-300 transition" title="وضع البائع">
      <i class="fa-solid fa-store"></i>
    </button>
  </div>

  <!-- مودال إضافة كورس -->
  <div id="courseModal" class="modal">
    <div class="bg-white w-full max-w-md rounded-3xl p-6 mx-4 shadow-2xl space-y-4 max-h-[80vh] overflow-y-auto">
      <h3 class="text-xl font-black text-gray-800">🎥 أضف كورس مجاني</h3>
      <input id="courseTitle" class="w-full bg-gray-100 rounded-xl p-3 text-sm border" placeholder="عنوان الكورس">
      <input id="courseInstructor" class="w-full bg-gray-100 rounded-xl p-3 text-sm border" placeholder="اسم المدرّب (اختياري)">
      <textarea id="courseDesc" rows="2" class="w-full bg-gray-100 rounded-xl p-3 text-sm border" placeholder="وصف مختصر"></textarea>
      <div>
        <p class="text-xs font-bold text-gray-600 mb-2">اختر الهاشتاجات:</p>
        <div id="courseHashtagSelection" class="flex flex-wrap gap-2"></div>
      </div>
      <div class="border-t pt-3">
        <h4 class="font-bold text-gray-700 mb-2">📖 أجزاء الكورس</h4>
        <div id="courseModulesContainer" class="space-y-2"></div>
        <button onclick="academy.addCourseModuleField()" class="text-sky-500 text-sm font-bold mt-2">
          <i class="fa-solid fa-plus"></i> إضافة جزء
        </button>
      </div>
      <div class="flex gap-2 justify-end">
        <button onclick="academy.closeModal('courseModal')" class="px-5 py-2 bg-gray-200 rounded-xl font-semibold">إلغاء</button>
        <button onclick="academy.publishCourse()" class="px-5 py-2 bg-sky-500 text-white rounded-xl font-semibold shadow">نشر الكورس</button>
      </div>
    </div>
  </div>

  <!-- مودال إضافة مقال -->
  <div id="articleModal" class="modal">
    <div class="bg-white w-full max-w-md rounded-3xl p-6 mx-4 shadow-2xl space-y-4 max-h-[80vh] overflow-y-auto">
      <h3 class="text-xl font-black text-gray-800">📝 اكتب مقالاً</h3>
      <input id="articleTitle" class="w-full bg-gray-100 rounded-xl p-3 text-sm border" placeholder="عنوان المقال">
      <textarea id="articleContent" rows="6" class="w-full bg-gray-100 rounded-xl p-3 text-sm border" placeholder="محتوى المقال هنا..."></textarea>
      <div>
        <p class="text-xs font-bold text-gray-600 mb-2">اختر الهاشتاجات:</p>
        <div id="articleHashtagSelection" class="flex flex-wrap gap-2"></div>
      </div>
      <div class="flex gap-2 justify-end">
        <button onclick="academy.closeModal('articleModal')" class="px-5 py-2 bg-gray-200 rounded-xl font-semibold">إلغاء</button>
        <button onclick="academy.publishArticle()" class="px-5 py-2 bg-emerald-500 text-white rounded-xl font-semibold shadow">نشر المقال</button>
      </div>
    </div>
  </div>

  <!-- مودال عرض التفاصيل -->
  <div id="detailModal" class="modal">
    <div class="bg-white w-full max-w-md rounded-3xl p-6 mx-4 shadow-2xl max-h-[80vh] overflow-y-auto space-y-4">
      <div id="detailContent"></div>
      <button onclick="academy.closeModal('detailModal')" class="w-full bg-gray-200 py-2 rounded-xl font-bold mt-3">إغلاق</button>
    </div>
  </div>

  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyB_2ms4K8EPbag7uab9gbDy8eePY6xwpxc",
      authDomain: "millionaireapp-be931.firebaseapp.com",
      projectId: "millionaireapp-be931",
      storageBucket: "millionaireapp-be931.firebasestorage.app",
      messagingSenderId: "325577904362",
      appId: "1:325577904362:web:8d85d4547bf22b1d8f4793"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const db = firebase.firestore();
    const auth = firebase.auth();

    // الكائن الرئيسي
    window.academy = {
      currentTab: 'courses',
      currentFilter: 'all',
      sellerMode: false,
      courses: [],
      articles: [],
      hashtags: ['بيزنس', 'استثمار', 'مشاريع', 'تسويق', 'عملات_رقمية', 'ريادة_أعمال'],

      async loadData() {
        try {
          const courseSnap = await db.collection("academy_courses").orderBy("createdAt", "desc").get();
          this.courses = courseSnap.docs.map(d => ({ id: d.id, ...d.data() }));
          const articleSnap = await db.collection("academy_articles").orderBy("createdAt", "desc").get();
          this.articles = articleSnap.docs.map(d => ({ id: d.id, ...d.data() }));
          this.updateCounters();
          this.renderFilterHashtags();
          this.renderContent();
        } catch (e) { alert('تعذر تحميل البيانات'); }
      },

      updateCounters() {
        document.getElementById('coursesCount').textContent = this.courses.length + ' كورس';
        document.getElementById('articlesCount').textContent = this.articles.length + ' مقال';
      },

      renderFilterHashtags() {
        const container = document.getElementById('filterHashtags');
        container.innerHTML = '';
        const allBtn = document.createElement('button');
        allBtn.className = 'hashtag-btn bg-sky-500 text-white px-3 py-1.5 rounded-full text-xs font-bold shadow active';
        allBtn.dataset.tag = 'all';
        allBtn.textContent = 'الكل';
        allBtn.onclick = () => this.filterByHashtag('all');
        container.appendChild(allBtn);
        this.hashtags.forEach(tag => {
          const btn = document.createElement('button');
          btn.className = 'hashtag-btn bg-gray-200 text-gray-700 px-3 py-1.5 rounded-full text-xs font-bold';
          btn.dataset.tag = tag;
          btn.textContent = '#' + tag;
          btn.onclick = () => this.filterByHashtag(tag);
          container.appendChild(btn);
        });
      },

      filterByHashtag(tag) {
        this.currentFilter = tag;
        document.querySelectorAll('#filterHashtags .hashtag-btn').forEach(btn => {
          const isActive = btn.dataset.tag === tag;
          btn.classList.toggle('active', isActive);
          btn.classList.toggle('bg-sky-500', isActive);
          btn.classList.toggle('text-white', isActive);
          btn.classList.toggle('bg-gray-200', !isActive);
          btn.classList.toggle('text-gray-700', !isActive);
        });
        this.renderContent();
      },

      renderContent() {
        const grid = document.getElementById('contentGrid');
        let data = this.currentTab === 'courses' ? this.courses : this.articles;
        if (this.currentFilter !== 'all') data = data.filter(i => (i.hashtags||[]).includes(this.currentFilter));
        if (!data.length) {
          grid.innerHTML = `<div class="text-center text-gray-400 py-10"><i class="fa-solid fa-book-open text-4xl mb-2"></i><p>لا توجد ${this.currentTab==='courses'?'كورسات':'مقالات'}</p></div>`;
          return;
        }
        grid.innerHTML = data.map(item => this.currentTab==='courses' ? this.courseCard(item) : this.articleCard(item)).join('');
        data.forEach(item => {
          document.getElementById(`detail-${item.id}`)?.addEventListener('click', ()=> this.showDetail(item.id));
          if (this.currentTab==='courses') document.getElementById(`buy-${item.id}`)?.addEventListener('click', ()=> this.enrollFreeCourse(item.id));
        });
      },

      courseCard(c) {
        const m = (c.modules||[]).length;
        return `<div class="bg-white rounded-2xl p-4 shadow-sm border card-item">
          <div class="flex justify-between"><h3 class="font-bold">${c.title}</h3><span class="text-xs text-green-600 bg-green-50 px-2 py-0.5 rounded-full">مجاني</span></div>
          <p class="text-xs text-gray-500 line-clamp-2 mb-2">${c.desc||''}</p>
          <div class="text-xs text-gray-400 mb-2"><i class="fa-solid fa-user"></i> ${c.instructor||'مجهول'} • ${m} أجزاء</div>
          <div class="flex flex-wrap gap-1 mb-3">${(c.hashtags||[]).map(t=>`<span class="bg-sky-50 text-sky-600 px-2 py-0.5 rounded-full text-xs font-bold">#${t}</span>`).join('')}</div>
          <div class="flex gap-2"><button id="buy-${c.id}" class="flex-1 bg-sky-500 text-white py-2 rounded-xl text-sm font-bold shadow">انضم مجاناً</button><button id="detail-${c.id}" class="bg-gray-100 text-gray-600 px-4 py-2 rounded-xl text-sm"><i class="fa-solid fa-eye"></i></button></div>
        </div>`;
      },

      articleCard(a) {
        return `<div class="bg-white rounded-2xl p-4 shadow-sm border card-item">
          <div class="flex items-center gap-2 mb-2"><img src="${a.authorPhoto||'data:image/svg+xml,...'}" class="w-8 h-8 rounded-full"><span class="text-xs font-semibold">${a.authorName||'مستخدم'}</span></div>
          <h3 class="font-bold">${a.title}</h3><p class="text-xs text-gray-500 line-clamp-2">${(a.content||'').substring(0,100)}...</p>
          <div class="flex flex-wrap gap-1 mb-3">${(a.hashtags||[]).map(t=>`<span class="bg-emerald-50 text-emerald-600 px-2 py-0.5 rounded-full text-xs font-bold">#${t}</span>`).join('')}</div>
          <div class="flex justify-end"><button id="detail-${a.id}" class="bg-gray-100 text-gray-600 px-4 py-2 rounded-xl text-sm"><i class="fa-solid fa-eye"></i> اقرأ</button></div>
        </div>`;
      },

      showDetail(id) {
        const d = this.currentTab==='courses' ? this.courses.find(c=>c.id===id) : this.articles.find(a=>a.id===id);
        if(!d) return;
        document.getElementById('detailModal').style.display='flex';
        const c = document.getElementById('detailContent');
        if(this.currentTab==='courses') {
          c.innerHTML = `<h3 class="text-xl font-black mb-2">${d.title}</h3><p>${d.desc||''}</p><div class="space-y-3">${(d.modules||[]).map((m,i)=>`<div class="bg-gray-50 p-3 rounded-xl"><h4 class="font-bold">الجزء ${i+1}: ${m.title}</h4><p>${m.content||''}</p></div>`).join('')}</div><button id="enrollFreeBtn" class="w-full bg-sky-500 text-white py-2 rounded-xl mt-4">انضم مجاناً</button>`;
          document.getElementById('enrollFreeBtn').onclick = ()=>this.enrollFreeCourse(d.id);
        } else {
          c.innerHTML = `<div class="flex items-center gap-2 mb-3"><img src="${d.authorPhoto||''}" class="w-10 h-10 rounded-full"><span class="font-bold">${d.authorName||'مستخدم'}</span></div><h3 class="text-xl font-black mb-3">${d.title}</h3><div class="text-sm whitespace-pre-wrap">${d.content}</div><div class="flex gap-1 mt-4">${(d.hashtags||[]).map(t=>`<span class="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full text-xs font-bold">#${t}</span>`).join('')}</div>`;
        }
      },

      async enrollFreeCourse(courseId) {
        if(!auth.currentUser) { alert('سجل الدخول'); return; }
        const course = this.courses.find(c=>c.id===courseId);
        if(!course) return;
        await db.collection("academy_purchases").add({ userId:auth.currentUser.uid, courseId:course.id, courseTitle:course.title, price:0, purchasedAt:firebase.firestore.FieldValue.serverTimestamp() });
        alert(`تم الانضمام إلى "${course.title}"`);
      },

      createHashtagSelector(containerId, selected=[]) {
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        this.hashtags.forEach(tag => {
          const btn = document.createElement('button');
          btn.className = `hashtag-select px-3 py-1 rounded-full text-xs font-bold border ${selected.includes(tag)?'bg-sky-500 text-white':'bg-gray-100 text-gray-600'}`;
          btn.textContent = '#'+tag;
          btn.onclick = (e)=>{ e.preventDefault(); btn.classList.toggle('bg-sky-500'); btn.classList.toggle('text-white'); btn.classList.toggle('bg-gray-100'); btn.classList.toggle('text-gray-600'); };
          container.appendChild(btn);
        });
      },

      getSelectedHashtags(containerId) {
        return Array.from(document.getElementById(containerId).querySelectorAll('.hashtag-select.bg-sky-500')).map(b=>b.dataset.tag);
      },

      openAddCourseModal() {
        document.getElementById('courseModal').style.display='flex';
        document.getElementById('courseTitle').value='';
        document.getElementById('courseInstructor').value='';
        document.getElementById('courseDesc').value='';
        document.getElementById('courseModulesContainer').innerHTML='';
        this.createHashtagSelector('courseHashtagSelection');
        this.addCourseModuleField();
      },

      addCourseModuleField() {
        const container = document.getElementById('courseModulesContainer');
        const div = document.createElement('div');
        div.className = 'flex gap-2 items-start';
        div.innerHTML = `<div class="flex-1 flex gap-2"><input placeholder="عنوان الجزء" class="module-title flex-1 bg-gray-100 rounded-lg p-2 text-xs border"><input placeholder="وصف" class="module-content flex-1 bg-gray-100 rounded-lg p-2 text-xs border"></div><button onclick="this.parentElement.remove()" class="text-red-400">✕</button>`;
        container.appendChild(div);
      },

      async publishCourse() {
        if(!auth.currentUser) { alert('سجل الدخول'); return; }
        const title = document.getElementById('courseTitle').value.trim();
        if(!title) { alert('العنوان مطلوب'); return; }
        const instructor = document.getElementById('courseInstructor').value.trim() || auth.currentUser.displayName || 'مجهول';
        const desc = document.getElementById('courseDesc').value.trim();
        const hashtags = this.getSelectedHashtags('courseHashtagSelection');
        const modules = [];
        document.querySelectorAll('#courseModulesContainer > div').forEach(row => {
          const t = row.querySelector('.module-title')?.value.trim();
          const c = row.querySelector('.module-content')?.value.trim();
          if(t) modules.push({title:t, content:c||''});
        });
        await db.collection("academy_courses").add({ title, instructor, desc, price:0, hashtags, modules, authorId:auth.currentUser.uid, createdAt:firebase.firestore.FieldValue.serverTimestamp() });
        this.closeModal('courseModal');
        this.loadData();
      },

      openAddArticleModal() {
        document.getElementById('articleModal').style.display='flex';
        document.getElementById('articleTitle').value='';
        document.getElementById('articleContent').value='';
        this.createHashtagSelector('articleHashtagSelection');
      },

      async publishArticle() {
        if(!auth.currentUser) { alert('يجب تسجيل الدخول'); return; }
        const title = document.getElementById('articleTitle').value.trim();
        if(!title) { alert('العنوان مطلوب'); return; }
        const content = document.getElementById('articleContent').value.trim();
        if(!content) { alert('المحتوى مطلوب'); return; }
        const hashtags = this.getSelectedHashtags('articleHashtagSelection');
        const user = auth.currentUser;
        await db.collection("academy_articles").add({ title, content, hashtags, authorId:user.uid, authorName:user.displayName||'مستخدم', authorPhoto:user.photoURL||'', createdAt:firebase.firestore.FieldValue.serverTimestamp() });
        this.closeModal('articleModal');
        this.loadData();
        alert('تم نشر المقال 🎉');
      },

      closeModal(id) { document.getElementById(id).style.display='none'; },
      switchTab(tab) {
        this.currentTab = tab;
        document.getElementById('tabCourses').classList.toggle('active', tab==='courses');
        document.getElementById('tabArticles').classList.toggle('active', tab==='articles');
        this.renderContent();
      },
      toggleSellerMode() {
        this.sellerMode = !this.sellerMode;
        document.getElementById('sellerPanel').classList.toggle('hidden', !this.sellerMode);
        const btn = document.getElementById('toggleSellerBtn');
        if(this.sellerMode) { btn.classList.add('bg-sky-500','text-white'); btn.innerHTML='<i class="fa-solid fa-store-alt"></i>'; }
        else { btn.classList.remove('bg-sky-500','text-white'); btn.innerHTML='<i class="fa-solid fa-store"></i>'; }
      }
    };

    window.academy.loadData();
  </script>
</body>
</html>
