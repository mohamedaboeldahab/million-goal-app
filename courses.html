<!-- Shark UP Academy - Final Stable Version -->

<script>
    // حل مشكلة ReferenceError: تعريف الكائن فوراً قبل أي شيء
    window.academy = {
        switchTab: () => {},
        toggleSeller: () => { 
            const p = document.getElementById('sellerPanel');
            if(p) p.classList.toggle('hidden');
        },
        openModal: (id) => { 
            const m = document.getElementById(id);
            if(m) m.classList.remove('hidden');
        },
        closeModal: (id) => {
            const m = document.getElementById(id);
            if(m) m.classList.add('hidden');
        },
        saveData: () => { console.log("جاري التحميل..."); }
    };
</script>

<div class="max-w-2xl mx-auto px-4 pt-6 space-y-6 pb-24">
    <!-- الهيدر -->
    <div class="bg-gradient-to-br from-sky-600 to-blue-800 rounded-[2rem] p-6 text-white shadow-2xl">
        <h2 class="text-xl font-black">📚 أكاديمية Shark UP</h2>
        <div class="mt-4 flex gap-3 text-center">
            <div class="bg-white/10 px-4 py-2 rounded-xl flex-1 border border-white/10">
                <span class="block text-[10px] opacity-70">المحتوى</span>
                <span id="itemsCount" class="text-sm font-bold">0</span>
            </div>
        </div>
    </div>

    <!-- التبويبات -->
    <div class="flex gap-2 bg-white p-1 rounded-2xl shadow-sm border border-gray-100">
        <button id="tabCourses" class="flex-1 py-3 rounded-xl font-bold text-xs bg-sky-500 text-white" onclick="window.academy.switchTab('courses')">الكورسات</button>
        <button id="tabArticles" class="flex-1 py-3 rounded-xl font-bold text-xs text-gray-500" onclick="window.academy.switchTab('articles')">المقالات</button>
    </div>

    <!-- شبكة العرض -->
    <div id="contentGrid" class="grid gap-4 min-h-[200px]">
        <div class="text-center py-10 text-gray-400 text-xs">جاري تحميل البيانات...</div>
    </div>
</div>

<!-- زر الإضافة -->
<button onclick="window.academy.toggleSeller()" class="fixed bottom-6 left-6 w-14 h-14 bg-white shadow-2xl rounded-2xl border flex items-center justify-center z-50">
    <i class="fa-solid fa-plus text-sky-500 text-xl"></i>
</button>

<div id="sellerPanel" class="hidden fixed bottom-24 left-6 right-6 z-50 grid grid-cols-2 gap-3">
    <button onclick="window.academy.openModal('addModal')" class="bg-sky-600 text-white p-4 rounded-2xl text-[10px] font-bold shadow-lg">إضافة جديد</button>
</div>

<!-- المودال (نافذة الإضافة) -->
<div id="addModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-[2rem] p-6 space-y-4">
        <h3 class="font-bold text-gray-800">إضافة محتوى</h3>
        <input id="newTitle" class="w-full bg-gray-50 border-none rounded-xl p-3 text-sm" placeholder="العنوان">
        <textarea id="newDesc" class="w-full bg-gray-50 border-none rounded-xl p-3 text-sm" rows="3" placeholder="التفاصيل"></textarea>
        <div class="flex gap-2">
            <button onclick="window.academy.saveData()" class="flex-1 bg-sky-600 text-white py-3 rounded-xl font-bold">نشر</button>
            <button onclick="window.academy.closeModal('addModal')" class="bg-gray-100 text-gray-500 px-4 rounded-xl">إلغاء</button>
        </div>
    </div>
</div>

<script>
    (function startApp() {
        if (typeof firebase === 'undefined') {
            setTimeout(startApp, 400);
            return;
        }

        const config = {
            apiKey: "AIzaSyB_2ms4K8EPbag7uab9gbDy8eePY6xwpxc",
            authDomain: "millionaireapp-be931.firebaseapp.com",
            projectId: "millionaireapp-be931",
            storageBucket: "millionaireapp-be931.firebasestorage.app",
            messagingSenderId: "325577904362",
            appId: "1:325577904362:web:8d85d4547bf22b1d8f4793"
        };

        if (!firebase.apps.length) firebase.initializeApp(config);
        const db = firebase.firestore();

        // تحديث الدوال بالمنطق الحقيقي
        window.academy.currentTab = 'courses';
        
        window.academy.loadData = async function() {
            const grid = document.getElementById('contentGrid');
            const collection = this.currentTab === 'courses' ? "academy_courses" : "academy_articles";
            try {
                const snap = await db.collection(collection).orderBy("createdAt", "desc").limit(10).get();
                document.getElementById('itemsCount').innerText = snap.size;
                grid.innerHTML = snap.docs.map(doc => `
                    <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
                        <h4 class="font-bold text-sm">${doc.data().title}</h4>
                        <p class="text-[10px] text-gray-500 mt-1">${doc.data().desc}</p>
                    </div>
                `).join('') || '<p class="text-center text-gray-400 text-[10px]">لا يوجد محتوى</p>';
            } catch(e) { grid.innerHTML = "خطأ في الجلب"; }
        };

        window.academy.switchTab = function(tab) {
            this.currentTab = tab;
            document.getElementById('tabCourses').className = tab==='courses' ? 'flex-1 py-3 rounded-xl font-bold text-xs bg-sky-500 text-white' : 'flex-1 py-3 rounded-xl font-bold text-xs text-gray-500';
            document.getElementById('tabArticles').className = tab==='articles' ? 'flex-1 py-3 rounded-xl font-bold text-xs bg-sky-500 text-white' : 'flex-1 py-3 rounded-xl font-bold text-xs text-gray-500';
            this.loadData();
        };

        window.academy.saveData = async function() {
            const title = document.getElementById('newTitle').value;
            const desc = document.getElementById('newDesc').value;
            if(!title || !desc) return alert("املا البيانات");

            const collection = this.currentTab === 'courses' ? "academy_courses" : "academy_articles";
            try {
                await db.collection(collection).add({
                    title, desc, createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("تمت الإضافة!");
                this.closeModal('addModal');
                document.getElementById('newTitle').value = "";
                document.getElementById('newDesc').value = "";
                this.loadData();
            } catch(e) { alert("فشل الحفظ"); }
        };

        window.academy.loadData();
    })();
</script>
