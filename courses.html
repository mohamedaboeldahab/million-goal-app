<!-- Shark UP Academy - Optimized for loadPage -->
<div class="max-w-2xl mx-auto px-4 pt-6 space-y-6">
    <!-- Header Card -->
    <div class="bg-gradient-to-br from-sky-600 to-blue-800 rounded-[2rem] p-6 text-white shadow-2xl relative overflow-hidden">
        <h2 class="text-xl font-black mb-1">📚 أكاديمية Shark UP</h2>
        <p class="text-[10px] opacity-80">طور مهاراتك في البيزنس والتقنية</p>
        <div class="mt-4 flex gap-3 text-center">
            <div class="bg-white/10 px-4 py-2 rounded-xl flex-1 border border-white/5">
                <span class="block text-[9px] opacity-70">الكورسات</span>
                <span id="coursesCount" class="text-sm font-bold">0</span>
            </div>
            <div class="bg-white/10 px-4 py-2 rounded-xl flex-1 border border-white/5">
                <span class="block text-[9px] opacity-70">المقالات</span>
                <span id="articlesCount" class="text-sm font-bold">0</span>
            </div>
        </div>
    </div>

    <!-- Tabs Navigation -->
    <div class="flex gap-2 bg-white p-1 rounded-2xl shadow-sm border border-gray-100">
        <button id="tabCourses" class="flex-1 py-3 rounded-xl font-bold text-xs bg-sky-500 text-white transition-all" onclick="academy.switchTab('courses')">الكورسات</button>
        <button id="tabArticles" class="flex-1 py-3 rounded-xl font-bold text-xs text-gray-500 transition-all" onclick="academy.switchTab('articles')">المقالات</button>
    </div>

    <!-- Content Grid -->
    <div id="contentGrid" class="grid gap-4 py-4 min-h-[200px]">
        <div class="text-center py-10 text-gray-400 text-xs">جاري جلب البيانات...</div>
    </div>
</div>

<!-- Floating Action Button -->
<button onclick="academy.toggleSeller()" class="fixed bottom-6 left-6 w-14 h-14 bg-white shadow-2xl rounded-2xl border border-gray-50 flex items-center justify-center z-50 active:scale-90 transition-transform">
    <i class="fa-solid fa-plus text-sky-500 text-xl"></i>
</button>

<!-- Seller Panel -->
<div id="sellerPanel" class="hidden fixed bottom-24 left-6 right-6 z-50 grid grid-cols-2 gap-3">
    <button onclick="academy.openModal('courseModal')" class="bg-sky-600 text-white p-4 rounded-[1.5rem] text-[10px] font-bold shadow-lg flex flex-col items-center gap-2">
        <i class="fa-solid fa-graduation-cap text-lg"></i> كورس جديد
    </button>
    <button onclick="academy.openModal('articleModal')" class="bg-emerald-600 text-white p-4 rounded-[1.5rem] text-[10px] font-bold shadow-lg flex flex-col items-center gap-2">
        <i class="fa-solid fa-file-lines text-lg"></i> مقال جديد
    </button>
</div>

<!-- Add Course Modal -->
<div id="courseModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-[2rem] p-6 space-y-4 shadow-2xl">
        <div class="flex justify-between items-center">
            <h3 class="font-black text-gray-800">إضافة محتوى جديد</h3>
            <button onclick="academy.closeModal('courseModal')" class="text-gray-400 text-xl">✕</button>
        </div>
        <input id="newTitle" class="w-full bg-gray-50 border-none rounded-xl p-3 text-sm focus:ring-2 focus:ring-sky-500 outline-none" placeholder="العنوان...">
        <textarea id="newDesc" class="w-full bg-gray-50 border-none rounded-xl p-3 text-sm focus:ring-2 focus:ring-sky-500 outline-none" rows="3" placeholder="الوصف أو المحتوى..."></textarea>
        <button onclick="academy.saveData()" class="w-full bg-sky-600 text-white py-4 rounded-xl font-bold shadow-lg shadow-sky-100">نشر الآن</button>
    </div>
</div>

<script>
    (function initAcademy() {
        if (typeof firebase === 'undefined') {
            setTimeout(initAcademy, 500);
            return;
        }

        const config = {
            apiKey: "AIzaSyB_2ms4K8EPbag7uab9gbDy8eePY6xwpxc",
            authDomain: "millionaireapp-be931.firebaseapp.com",
            projectId: "millionaireapp-be931",
            storageBucket: "millionaireapp-be931.firebasestorage.app",
            messagingSenderId: "325577904362",
            appId: "1:325577904362:web:8d85d4547bf22b1d8f4793"
        };

        if (!firebase.apps.length) firebase.initializeApp(config);
        const db = firebase.firestore();

        window.academy = {
            currentTab: 'courses',
            data: [],

            async loadData() {
                const grid = document.getElementById('contentGrid');
                const collectionName = this.currentTab === 'courses' ? "academy_courses" : "academy_articles";
                
                try {
                    const snap = await db.collection(collectionName).orderBy("createdAt", "desc").limit(12).get();
                    this.data = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    
                    // تحديث العدادات بشكل منفصل
                    this.updateCounters();
                    this.render();
                } catch(e) {
                    grid.innerHTML = `<div class="text-[10px] text-red-400 text-center">خطأ في التحميل: ${e.message}</div>`;
                }
            },

            async updateCounters() {
                const cSnap = await db.collection("academy_courses").get();
                const aSnap = await db.collection("academy_articles").get();
                document.getElementById('coursesCount').innerText = cSnap.size;
                document.getElementById('articlesCount').innerText = aSnap.size;
            },

            render() {
                const grid = document.getElementById('contentGrid');
                if(!grid) return;
                
                if(this.data.length === 0) {
                    grid.innerHTML = '<div class="text-xs text-gray-400 text-center py-10">لا توجد بيانات متاحة في هذا القسم حالياً</div>';
                    return;
                }

                grid.innerHTML = this.data.map(item => `
                    <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm animate-fade-in">
                        <div class="flex justify-between items-start mb-2">
                             <span class="text-[8px] font-bold uppercase tracking-wider px-2 py-1 rounded bg-sky-50 text-sky-600">
                                ${this.currentTab === 'courses' ? 'Course' : 'Article'}
                             </span>
                        </div>
                        <h3 class="font-bold text-sm text-gray-800">${item.title}</h3>
                        <p class="text-[10px] text-gray-500 mt-1 line-clamp-2 leading-relaxed">${item.desc || ''}</p>
                    </div>
                `).join('');
            },

            switchTab(tab) {
                this.currentTab = tab;
                const isCourses = tab === 'courses';
                
                document.getElementById('tabCourses').className = isCourses ? 
                    'flex-1 py-3 rounded-xl font-bold text-xs bg-sky-500 text-white transition-all' : 
                    'flex-1 py-3 rounded-xl font-bold text-xs text-gray-500 transition-all';
                
                document.getElementById('tabArticles').className = !isCourses ? 
                    'flex-1 py-3 rounded-xl font-bold text-xs bg-sky-500 text-white transition-all' : 
                    'flex-1 py-3 rounded-xl font-bold text-xs text-gray-500 transition-all';

                this.loadData();
            },

            toggleSeller() {
                document.getElementById('sellerPanel').classList.toggle('hidden');
            },

            openModal(id) {
                document.getElementById(id).classList.remove('hidden');
                document.getElementById('sellerPanel').classList.add('hidden');
            },

            closeModal(id) {
                document.getElementById(id).classList.add('hidden');
            },

            async saveData() {
                const title = document.getElementById('newTitle').value;
                const desc = document.getElementById('newDesc').value;
                const collectionName = this.currentTab === 'courses' ? "academy_courses" : "academy_articles";

                if(!title || !desc) return alert("يرجى ملء البيانات أولاً");

                try {
                    await db.collection(collectionName).add({
                        title: title,
                        desc: desc,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    document.getElementById('newTitle').value = '';
                    document.getElementById('newDesc').value = '';
                    this.closeModal('courseModal');
                    this.loadData();
                    alert("تم النشر بنجاح!");
                } catch(e) {
                    alert("حدث خطأ أثناء الحفظ");
                }
            }
        };

        window.academy.loadData();
    })();
</script>
