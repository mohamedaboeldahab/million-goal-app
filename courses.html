<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أكاديمية Shark UP</title>
    
    <!-- 1. مكتبات Firebase الأساسية (نسخة Compat لضمان التوافق) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- 2. مكتبات التنسيق والأيقونات -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Tajawal', sans-serif; 
            background: #f8fafc; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent;
        }
        
        /* تأثيرات الأزرار والتبويب */
        .tab-btn { transition: all 0.3s ease; border: 2px solid transparent; }
        .tab-btn.active { 
            background: #0ea5e9; 
            color: white; 
            border-color: #0ea5e9;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
        }

        /* تنسيق المودال (النافذة المنبثقة) */
        .modal { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: rgba(15, 23, 42, 0.8); 
            z-index: 1000; 
            align-items: center; 
            justify-content: center; 
            padding: 1rem; 
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }
        .modal.active { display: flex; }

        /* إخفاء شريط التمرير */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* حركات التحميل */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.4s ease forwards; }
    </style>
</head>
<body class="pb-24">

    <!-- واجهة الأكاديمية الرئيسية -->
    <div id="academy-root" class="max-w-2xl mx-auto px-4 pt-6 space-y-6">
        
        <!-- كارت الترحيب والإحصائيات -->
        <div class="bg-gradient-to-br from-sky-600 to-blue-800 rounded-[2rem] p-6 text-white shadow-2xl relative overflow-hidden">
            <div class="relative z-10">
                <h2 class="text-2xl font-black mb-1">📚 أكاديمية Shark UP</h2>
                <p class="opacity-80 text-[11px] font-medium">طريقك لاحتراف البيزنس والاستثمار الذكي</p>
                
                <div class="mt-6 flex gap-3">
                    <div class="bg-white/15 backdrop-blur-md px-4 py-2 rounded-2xl border border-white/10">
                        <span class="block text-[10px] opacity-70">الكورسات</span>
                        <span class="text-sm font-bold" id="coursesCount">0</span>
                    </div>
                    <div class="bg-white/15 backdrop-blur-md px-4 py-2 rounded-2xl border border-white/10">
                        <span class="block text-[10px] opacity-70">المقالات</span>
                        <span class="text-sm font-bold" id="articlesCount">0</span>
                    </div>
                </div>
            </div>
            <!-- شكل ديكوري خلفي -->
            <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-white/10 rounded-full blur-3xl"></div>
        </div>

        <!-- أزرار التنقل (تبديل الأقسام) -->
        <div class="flex gap-2 bg-white p-1.5 rounded-2xl shadow-sm border border-gray-100">
            <button id="tabCourses" class="tab-btn flex-1 py-3 rounded-xl font-bold text-sm active" onclick="academy.switchTab('courses')">
                <i class="fa-solid fa-graduation-cap ml-1"></i> الكورسات
            </button>
            <button id="tabArticles" class="tab-btn flex-1 py-3 rounded-xl font-bold text-sm text-gray-500" onclick="academy.switchTab('articles')">
                <i class="fa-solid fa-newspaper ml-1"></i> المقالات
            </button>
        </div>

        <!-- فلاتر الهاشتاجات -->
        <div class="flex gap-2 overflow-x-auto pb-2 no-scrollbar" id="filterHashtags">
            <!-- سيتم توليد الفلاتر بواسطة الجافا سكريبت -->
        </div>

        <!-- منطقة عرض المحتوى (الشبكة) -->
        <div id="contentGrid" class="grid gap-4 min-h-[300px]">
            <div class="flex flex-col items-center justify-center py-20 text-gray-400">
                <i class="fa-solid fa-circle-notch animate-spin text-2xl mb-3"></i>
                <p class="text-sm">جاري تحديث البيانات...</p>
            </div>
        </div>
    </div>

    <!-- لوحة التحكم للبائع (تظهر عند الضغط على الزر العائم) -->
    <div id="sellerPanel" class="hidden fixed bottom-24 left-6 right-6 z-50 grid grid-cols-2 gap-3 animate-fade-in">
        <button onclick="academy.openModal('courseModal')" class="bg-sky-500 text-white p-5 rounded-[2rem] font-bold shadow-2xl flex flex-col items-center gap-2 border-4 border-white">
            <i class="fa-solid fa-circle-plus text-xl"></i>
            <span class="text-[10px]">كورس جديد</span>
        </button>
        <button onclick="academy.openModal('articleModal')" class="bg-emerald-500 text-white p-5 rounded-[2rem] font-bold shadow-2xl flex flex-col items-center gap-2 border-4 border-white">
            <i class="fa-solid fa-pen-to-square text-xl"></i>
            <span class="text-[10px]">مقال جديد</span>
        </button>
    </div>

    <!-- الزر العائم (Seller Mode) -->
    <button id="toggleSellerBtn" onclick="academy.toggleSellerMode()" class="fixed bottom-6 left-6 w-16 h-16 bg-white rounded-3xl flex items-center justify-center text-gray-400 shadow-[0_10px_30px_rgba(0,0,0,0.1)] border border-gray-50 z-50 transition-all active:scale-90">
        <i class="fa-solid fa-plus text-2xl"></i>
    </button>

    <!-- مودال إضافة كورس جديد -->
    <div id="courseModal" class="modal">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-8 space-y-4 max-h-[90vh] overflow-y-auto shadow-2xl border border-gray-100">
            <div class="flex justify-between items-center mb-2">
                <h3 class="text-xl font-black text-gray-800">🚀 كورس جديد</h3>
                <button onclick="academy.closeModal('courseModal')" class="text-gray-400 hover:text-red-500"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <input id="courseTitle" class="w-full bg-gray-50 rounded-2xl p-4 border border-gray-100 outline-none text-sm focus:border-sky-500 transition-all" placeholder="عنوان الكورس التعليمي">
            <textarea id="courseDesc" rows="2" class="w-full bg-gray-50 rounded-2xl p-4 border border-gray-100 outline-none text-sm focus:border-sky-500 transition-all" placeholder="وصف مختصر للمحتوى"></textarea>
            
            <div class="space-y-2">
                <label class="text-[10px] font-bold text-gray-400 mr-2 uppercase">تصنيف الكورس (هاشتاج):</label>
                <div id="courseHashtags" class="flex flex-wrap gap-2"></div>
            </div>

            <div class="border-t border-gray-100 pt-6 space-y-4">
                <div class="flex justify-between items-center">
                    <h4 class="font-bold text-xs text-sky-600 italic">محتوى الدروس:</h4>
                    <button onclick="academy.addModuleRow()" class="bg-sky-50 text-sky-600 px-3 py-1 rounded-lg text-[10px] font-bold">+ إضافة درس</button>
                </div>
                <div id="modulesContainer" class="space-y-4">
                    <!-- دروس الكورس تضاف هنا -->
                </div>
            </div>

            <div class="flex gap-3 pt-6">
                <button onclick="academy.publishCourse()" class="flex-[2] py-4 bg-sky-600 text-white rounded-2xl font-bold text-sm shadow-lg shadow-sky-200">نشر الكورس الآن</button>
            </div>
        </div>
    </div>

    <!-- مودال عرض المحتوى (القارئ) -->
    <div id="viewerModal" class="modal">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-8 max-h-[85vh] overflow-y-auto shadow-2xl relative">
            <button onclick="academy.closeModal('viewerModal')" class="absolute top-6 left-6 text-gray-300 hover:text-red-500"><i class="fa-solid fa-circle-xmark text-2xl"></i></button>
            <div id="viewerContent" class="pt-4">
                <!-- المحتوى يظهر هنا ديناميكياً -->
            </div>
        </div>
    </div>

    <!-- 3. استدعاء ملف المنطق البرمجي (يجب أن يكون الاسم مطابقاً لملف الـ JS) -->
    <script src="academy.js"></script>
</body>
</html>
