<!-- Shark UP Academy - النسخة الشاملة والمحمية -->

<!-- روابط المكتبات لضمان التشغيل في أي WebView -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
    // 1. تعريف الكائن فوراً لمنع خطأ academy is not defined
    window.academy = window.academy || {
        currentTab: 'courses',
        init: false,
        toggleSeller: () => { document.getElementById('sellerPanel')?.classList.toggle('hidden'); },
        openModal: (id) => { document.getElementById(id)?.classList.remove('hidden'); window.academy.toggleSeller(); },
        closeModal: (id) => { document.getElementById(id)?.classList.add('hidden'); }
    };
</script>

<div class="max-w-2xl mx-auto px-4 pt-6 space-y-6 pb-32">
    <!-- الهيدر -->
    <div class="bg-gradient-to-br from-sky-600 to-blue-800 rounded-[2.5rem] p-8 text-white shadow-2xl relative overflow-hidden">
        <div class="relative z-10">
            <h2 class="text-2xl font-black mb-1 italic">Shark UP Academy</h2>
            <p class="text-xs opacity-70 font-bold">بوابة التعلم الذكي</p>
            <div class="mt-6 flex gap-4">
                <div class="bg-white/20 backdrop-blur-md p-3 rounded-2xl flex-1 border border-white/10">
                    <span class="block text-[10px] uppercase font-bold opacity-60">إجمالي المحتوى</span>
                    <span id="itemsCount" class="text-lg font-black">--</span>
                </div>
            </div>
        </div>
        <div class="absolute -right-10 -top-10 w-40 h-40 bg-white/10 rounded-full blur-3xl"></div>
    </div>

    <!-- التبويبات -->
    <div class="flex gap-2 bg-gray-100 p-1.5 rounded-[1.5rem] border border-gray-200">
        <button id="tabCourses" class="flex-1 py-3.5 rounded-xl font-black text-xs bg-white shadow-sm text-sky-600 transition-all" onclick="window.academy.switchTab('courses')">الكورسات</button>
        <button id="tabArticles" class="flex-1 py-3.5 rounded-xl font-black text-xs text-gray-500 transition-all" onclick="window.academy.switchTab('articles')">المقالات</button>
    </div>

    <!-- شبكة العرض -->
    <div id="contentGrid" class="grid gap-4 min-h-[300px]">
        <div class="flex flex-col items-center justify-center py-20 opacity-50">
            <div class="w-8 h-8 border-4 border-sky-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-xs font-bold">جاري استدعاء البيانات من السحاب...</p>
        </div>
    </div>
</div>

<!-- زر الإضافة العائم -->
<button onclick="window.academy.toggleSeller()" class="fixed bottom-8 left-8 w-16 h-16 bg-sky-600 text-white shadow-[0_10px_30px_rgba(2,132,199,0.4)] rounded-[1.5rem] flex items-center justify-center z-50 active:scale-90 transition-all">
    <i class="fa-solid fa-plus text-2xl"></i>
</button>

<div id="sellerPanel" class="hidden fixed bottom-28 left-8 right-8 z-50 grid grid-cols-2 gap-4">
    <button onclick="window.academy.openModal('addModal')" class="bg-white text-sky-600 p-5 rounded-[2rem] text-xs font-black shadow-2xl border-2 border-sky-100 flex flex-col items-center gap-2">
        <i class="fa-solid fa-cloud-arrow-up text-xl"></i> إضافة محتوى
    </button>
</div>

<!-- مودال الإضافة -->
<div id="addModal" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-md z-[100] flex items-center justify-center p-6">
    <div class="bg-white w-full max-w-md rounded-[2.5rem] p-8 space-y-5 shadow-2xl animate-fade-in">
        <div class="flex justify-between items-center">
            <h3 class="font-black text-xl text-slate-800">نشر جديد</h3>
            <button onclick="window.academy.closeModal('addModal')" class="bg-slate-100 text-slate-400 w-8 h-8 rounded-full flex items-center justify-center">✕</button>
        </div>
        <input id="newTitle" class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 text-sm font-bold outline-none focus:border-sky-500 transition-all" placeholder="عنوان المحتوى...">
        <textarea id="newDesc" class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 text-sm font-bold outline-none focus:border-sky-500 transition-all" rows="5" placeholder="اكتب تفاصيل الكورس أو المقال هنا..."></textarea>
        <button id="btnSave" onclick="window.academy.saveData()" class="w-full bg-sky-600 text-white py-5 rounded-2xl font-black shadow-lg shadow-sky-200 active:scale-95 transition-all">بث المحتوى الآن</button>
    </div>
</div>

<script>
    (function main() {
        // الانتظار حتى تحميل مكتبة Firebase
        if (typeof firebase === 'undefined') { return setTimeout(main, 300); }
        if (window.academy.init) return; // منع تكرار التشغيل

        const config = {
            apiKey: "AIzaSyB_2ms4K8EPbag7uab9gbDy8eePY6xwpxc",
            authDomain: "millionaireapp-be931.firebaseapp.com",
            projectId: "millionaireapp-be931",
            storageBucket: "millionaireapp-be931.firebasestorage.app",
            messagingSenderId: "325577904362",
            appId: "1:325577904362:web:8d85d4547bf22b1d8f4793"
        };

        if (!firebase.apps.length) firebase.initializeApp(config);
        const db = firebase.firestore();
        window.academy.init = true;

        // دالة جلب البيانات
        window.academy.loadData = async function() {
            const grid = document.getElementById('contentGrid');
            const col = this.currentTab === 'courses' ? "academy_courses" : "academy_articles";
            
            try {
                const snap = await db.collection(col).orderBy("createdAt", "desc").limit(10).get();
                document.getElementById('itemsCount').innerText = snap.size;
                
                if (snap.empty) {
                    grid.innerHTML = `<div class="text-center py-20 font-bold text-slate-300">لا يوجد ${this.currentTab === 'courses' ? 'كورسات' : 'مقالات'} حالياً</div>`;
                    return;
                }

                grid.innerHTML = snap.docs.map(doc => `
                    <div class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm hover:shadow-md transition-all">
                        <div class="flex items-center gap-2 mb-3">
                            <span class="w-2 h-2 rounded-full bg-sky-500"></span>
                            <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest">${this.currentTab}</span>
                        </div>
                        <h4 class="font-black text-slate-800 text-md mb-2">${doc.data().title}</h4>
                        <p class="text-[11px] text-slate-500 leading-relaxed font-medium">${doc.data().desc}</p>
                    </div>
                `).join('');
            } catch(e) {
                console.error(e);
                grid.innerHTML = `<div class="p-6 bg-red-50 text-red-500 rounded-2xl text-[10px] font-bold">خطأ: ${e.message}</div>`;
            }
        };

        // دالة تبديل الأقسام
        window.academy.switchTab = function(tab) {
            this.currentTab = tab;
            const isC = tab === 'courses';
            document.getElementById('tabCourses').className = isC ? 'flex-1 py-3.5 rounded-xl font-black text-xs bg-white shadow-sm text-sky-600' : 'flex-1 py-3.5 rounded-xl font-black text-xs text-gray-500';
            document.getElementById('tabArticles').className = !isC ? 'flex-1 py-3.5 rounded-xl font-black text-xs bg-white shadow-sm text-sky-600' : 'flex-1 py-3.5 rounded-xl font-black text-xs text-gray-500';
            this.loadData();
        };

        // دالة الحفظ (التي لا تخيب)
        window.academy.saveData = async function() {
            const t = document.getElementById('newTitle').value.trim();
            const d = document.getElementById('newDesc').value.trim();
            const btn = document.getElementById('btnSave');

            if (!t || !d) return alert("⚠️ املأ الخانات أولاً يا بطل");

            try {
                btn.disabled = true;
                btn.innerText = "⏳ جاري البث...";
                
                const col = this.currentTab === 'courses' ? "academy_courses" : "academy_articles";
                
                await db.collection(col).add({
                    title: t,
                    desc: d,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert("🚀 تم نشر المحتوى بنجاح!");
                document.getElementById('newTitle').value = "";
                document.getElementById('newDesc').value = "";
                this.closeModal('addModal');
                this.loadData();
            } catch (e) {
                alert("❌ حدث خطأ: " + e.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "بث المحتوى الآن";
            }
        };

        // البداية
        window.academy.loadData();
    })();
</script>

<style>
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .animate-fade-in { animation: fadeIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    body { -webkit-tap-highlight-color: transparent; font-family: 'Cairo', sans-serif; }
</style>
