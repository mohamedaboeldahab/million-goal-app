<!-- لا تضع وسوم html أو body إذا كنت تستخدم engine.loadPage، ابدأ من هنا مباشرة -->
<div class="max-w-2xl mx-auto px-4 pt-6 space-y-6">
    <!-- كارت الهيدر -->
    <div class="bg-gradient-to-br from-sky-600 to-blue-800 rounded-[2rem] p-6 text-white shadow-2xl relative overflow-hidden">
        <h2 class="text-xl font-black mb-1">📚 أكاديمية Shark UP</h2>
        <div class="mt-4 flex gap-3 text-center">
            <div class="bg-white/10 px-4 py-2 rounded-xl flex-1">
                <span class="block text-[9px] opacity-70">الكورسات</span>
                <span id="coursesCount" class="text-sm font-bold">0</span>
            </div>
            <div class="bg-white/10 px-4 py-2 rounded-xl flex-1">
                <span class="block text-[9px] opacity-70">المقالات</span>
                <span id="articlesCount" class="text-sm font-bold">0</span>
            </div>
        </div>
    </div>

    <!-- التبويبات -->
    <div class="flex gap-2 bg-white p-1 rounded-xl shadow-sm border border-gray-100">
        <button id="tabCourses" class="flex-1 py-3 rounded-lg font-bold text-xs bg-sky-500 text-white" onclick="academy.switchTab('courses')">الكورسات</button>
        <button id="tabArticles" class="flex-1 py-3 rounded-lg font-bold text-xs text-gray-500" onclick="academy.switchTab('articles')">المقالات</button>
    </div>

    <!-- شبكة المحتوى -->
    <div id="contentGrid" class="grid gap-4 py-4 min-h-[200px]">
        <div class="text-center py-10 text-gray-400 text-xs">جاري جلب البيانات...</div>
    </div>
</div>

<!-- زر الإضافة -->
<button onclick="academy.toggleSeller()" class="fixed bottom-6 left-6 w-12 h-12 bg-white shadow-xl rounded-full border flex items-center justify-center z-50">
    <i class="fa-solid fa-plus text-sky-500"></i>
</button>

<div id="sellerPanel" class="hidden fixed bottom-20 left-6 right-6 z-50 grid grid-cols-2 gap-2 animate-fade-in">
    <button onclick="academy.openModal('courseModal')" class="bg-sky-600 text-white p-4 rounded-2xl text-[10px] font-bold">كورس جديد</button>
    <button onclick="academy.openModal('courseModal')" class="bg-emerald-600 text-white p-4 rounded-2xl text-[10px] font-bold">مقال جديد</button>
</div>

<!-- السكربت البرمجي -->
<script>
    // التأكد من تحميل Firebase أولاً
    (function initAcademy() {
        if (typeof firebase === 'undefined') {
            console.log("Waiting for Firebase...");
            setTimeout(initAcademy, 500); // إعادة المحاولة كل نصف ثانية
            return;
        }

        const config = {
            apiKey: "AIzaSyB_2ms4K8EPbag7uab9gbDy8eePY6xwpxc",
            authDomain: "millionaireapp-be931.firebaseapp.com",
            projectId: "millionaireapp-be931",
            storageBucket: "millionaireapp-be931.firebasestorage.app",
            messagingSenderId: "325577904362",
            appId: "1:325577904362:web:8d85d4547bf22b1d8f4793"
        };

        if (!firebase.apps.length) firebase.initializeApp(config);
        const db = firebase.firestore();

        // تعريف الكائن عالمياً ليعمل مع onclick
        window.academy = {
            currentTab: 'courses',
            courses: [],
            
            async loadData() {
                try {
                    const snap = await db.collection("academy_courses").orderBy("createdAt", "desc").limit(10).get();
                    this.courses = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    document.getElementById('coursesCount').innerText = this.courses.length;
                    this.render();
                } catch(e) { console.error("Error:", e); }
            },

            render() {
                const grid = document.getElementById('contentGrid');
                if(!grid) return;
                if(this.courses.length === 0) {
                    grid.innerHTML = '<div class="text-xs text-gray-400 text-center">لا توجد بيانات</div>';
                    return;
                }
                grid.innerHTML = this.courses.map(c => `
                    <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
                        <h3 class="font-bold text-sm text-gray-800">${c.title}</h3>
                        <p class="text-[10px] text-gray-500 mt-1 line-clamp-2">${c.desc || ''}</p>
                    </div>
                `).join('');
            },

            switchTab(tab) {
                this.currentTab = tab;
                document.getElementById('tabCourses').className = tab==='courses' ? 'flex-1 py-3 rounded-lg font-bold text-xs bg-sky-500 text-white' : 'flex-1 py-3 rounded-lg font-bold text-xs text-gray-500';
                document.getElementById('tabArticles').className = tab==='articles' ? 'flex-1 py-3 rounded-lg font-bold text-xs bg-sky-500 text-white' : 'flex-1 py-3 rounded-lg font-bold text-xs text-gray-500';
            },

            toggleSeller() {
                const p = document.getElementById('sellerPanel');
                if(p) p.classList.toggle('hidden');
            }
        };

        window.academy.loadData();
    })();
</script>
