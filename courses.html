<div class="max-w-2xl mx-auto px-4 pt-2 space-y-3 pb-24 text-right" dir="rtl">
    
    <!-- هيدر أصغر -->
    <div class="relative bg-gradient-to-r from-sky-600 to-blue-700 rounded-2xl p-4 text-white shadow-lg">
        <h2 class="text-lg font-black tracking-tight">🦈 أكاديمية شارك</h2>
    </div>

    <!-- التبويبات الرئيسية -->
    <div class="flex gap-2 bg-gray-100 p-1 rounded-2xl">
        <button id="tabCourses" class="flex-1 py-2.5 rounded-xl font-bold text-xs bg-sky-500 text-white shadow-sm transition" onclick="academy.switchTab('courses')">
            <i class="fa-solid fa-book-open ml-1"></i> كورسات
        </button>
        <button id="tabArticles" class="flex-1 py-2.5 rounded-xl font-bold text-xs text-gray-500 transition" onclick="academy.switchTab('articles')">
            <i class="fa-solid fa-newspaper ml-1"></i> مقالات
        </button>
        <button id="tabVideos" class="flex-1 py-2.5 rounded-xl font-bold text-xs text-gray-500 transition" onclick="academy.switchTab('videos')">
            <i class="fa-solid fa-play ml-1"></i> فيديوهات
        </button>
    </div>

    <!-- أزرار الفئات الفرعية -->
    <div id="subcategoryFilter" class="flex gap-2 overflow-x-auto pb-1"></div>

    <!-- قائمة البطاقات -->
    <div id="academyGrid" class="space-y-3 min-h-[150px]"></div>

    <!-- نافذة عرض المحتوى -->
    <div id="contentModal" class="hidden fixed inset-0 bg-black/90 z-[200] flex items-center justify-center p-4" onclick="if(event.target===this)academy.closeContentModal()">
        <div class="bg-white w-full max-w-lg rounded-2xl overflow-hidden shadow-2xl" style="max-height:90vh;">
            <div class="flex justify-between items-center p-4 border-b">
                <h3 id="modalTitle" class="font-black text-gray-800 text-base break-words flex-1 ml-2"></h3>
                <button onclick="academy.closeContentModal()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
            </div>
            <div id="modalVideo" class="hidden w-full" style="aspect-ratio: 16/9; background:#000;"></div>
            <div id="modalContent" class="p-4 text-sm text-gray-700 leading-relaxed whitespace-pre-wrap overflow-y-auto" style="max-height:60vh;"></div>
            <div class="flex items-center gap-2 px-4 pb-4 text-xs text-gray-500">
                <img id="modalAuthorPhoto" src="" class="w-6 h-6 rounded-full">
                <span id="modalAuthorName" class="font-bold"></span>
                <span id="modalDate" class="mr-2"></span>
            </div>
        </div>
    </div>

    <!-- زر الإضافة العائم -->
    <button onclick="academy.openAddModal()" class="fixed bottom-24 left-6 w-14 h-14 bg-sky-600 text-white shadow-2xl rounded-2xl flex items-center justify-center z-40 hover:bg-sky-700 transition">
        <i class="fa-solid fa-plus text-xl"></i>
    </button>

    <!-- نافذة إضافة محتوى -->
    <div id="acadModal" class="hidden fixed inset-0 bg-black/80 z-[200] flex items-center justify-center p-4" onclick="if(event.target===this)academy.closeAddModal()">
        <div class="bg-white w-full max-w-md rounded-2xl p-5 space-y-3 shadow-2xl">
            <h3 class="font-black text-gray-800 text-lg">إضافة محتوى</h3>
            
            <div>
                <label class="text-xs font-bold text-gray-500 mb-1 block">النوع</label>
                <select id="acadCategory" class="w-full bg-gray-100 border-none rounded-xl p-3 text-sm">
                    <option value="courses">📚 كورس</option>
                    <option value="articles">📄 مقال</option>
                    <option value="videos">🎬 فيديو</option>
                </select>
            </div>

            <div>
                <label class="text-xs font-bold text-gray-500 mb-1 block">المجال</label>
                <select id="acadSubcategory" class="w-full bg-gray-100 border-none rounded-xl p-3 text-sm">
                    <option value="ريادة أعمال">🚀 ريادة أعمال</option>
                    <option value="استثمار">💰 استثمار</option>
                    <option value="تسويق">📢 تسويق</option>
                    <option value="تطوير ذاتي">🧠 تطوير ذاتي</option>
                    <option value="تقنية">💻 تقنية</option>
                    <option value="أخرى">📦 أخرى</option>
                </select>
            </div>

            <input id="acadTitle" class="w-full bg-gray-100 border-none rounded-xl p-3 text-sm" placeholder="عنوان المحتوى">
            <textarea id="acadDesc" class="w-full bg-gray-100 border-none rounded-xl p-3 text-sm" rows="3" placeholder="التفاصيل..."></textarea>
            
            <div id="videoLinkGroup" class="hidden">
                <input id="acadVideoLink" class="w-full bg-gray-100 border-none rounded-xl p-3 text-sm" placeholder="رابط فيديو يوتيوب...">
            </div>

            <button id="acadBtnSave" onclick="academy.saveData()" class="w-full bg-sky-600 text-white py-3 rounded-xl font-bold hover:bg-sky-700 transition">حفظ ونشر</button>
            <button onclick="academy.closeAddModal()" class="w-full text-gray-400 text-xs">إلغاء</button>
        </div>
    </div>
</div>

<style>
    /* إزالة تقطيع النصوص */
    .line-clamp-1 {
        display: block;
        white-space: normal;
        word-wrap: break-word;
        overflow: visible;
    }
    .line-clamp-2 {
        display: block;
        white-space: normal;
        word-wrap: break-word;
        overflow: visible;
    }
    /* تنسيق أفضل للعناوين الطويلة */
    .card-title {
        font-weight: 800;
        font-size: 0.9rem;
        color: #1f2937;
        margin-bottom: 0.25rem;
        word-break: break-word;
        line-height: 1.4;
    }
</style>

<script>
function waitForGlobals(cb) {
    if (window.__firestore_helpers && window.engine && window.engine.postHTML) cb();
    else setTimeout(() => waitForGlobals(cb), 100);
}

waitForGlobals(() => {
    const { collection, query, orderBy, getDocs, addDoc, serverTimestamp, doc, getDoc } = window.__firestore_helpers;
    const db = window.db, auth = window.auth, engine = window.engine;

    function extractYouTubeID(url) {
        if (!url) return null;
        url = url.trim();
        const patterns = [
            /(?:youtube\.com\/watch\?v=)([A-Za-z0-9_-]{11})/,
            /(?:youtube\.com\/embed\/)([A-Za-z0-9_-]{11})/,
            /(?:youtu\.be\/)([A-Za-z0-9_-]{11})/,
            /(?:youtube\.com\/shorts\/)([A-Za-z0-9_-]{11})/
        ];
        for (let p of patterns) { const m = url.match(p); if (m) return m[1]; }
        const fallback = url.match(/[A-Za-z0-9_-]{11}/);
        return fallback ? fallback[0] : null;
    }

    window.academy = {
        currentTab: 'courses',
        currentSubcategory: 'الكل',

        switchTab(tab) {
            this.currentTab = tab;
            this.currentSubcategory = 'الكل';
            ['courses','articles','videos'].forEach(t => {
                const btn = document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1));
                if (btn) {
                    btn.className = t === tab ? 'flex-1 py-2.5 rounded-xl font-bold text-xs bg-sky-500 text-white shadow-sm transition' : 'flex-1 py-2.5 rounded-xl font-bold text-xs text-gray-500 transition';
                }
            });
            this.loadData();
        },

        async loadData() {
            const grid = document.getElementById('academyGrid');
            if (!grid) return;
            grid.innerHTML = '<div class="flex justify-center py-20"><div class="w-6 h-6 border-2 border-sky-500 border-t-transparent rounded-full animate-spin"></div></div>';

            const map = { courses: 'academy_courses', articles: 'academy_articles', videos: 'academy_videos' };
            const col = map[this.currentTab];

            try {
                const q = query(collection(db, col), orderBy('createdAt', 'desc'));
                const snap = await getDocs(q);
                
                const subcats = new Set(['الكل']);
                const docsArray = [];
                snap.forEach(d => {
                    const data = d.data();
                    docsArray.push({ id: d.id, ...data });
                    if (data.subcategory) subcats.add(data.subcategory);
                });
                
                if (snap.empty) {
                    const msgs = { courses: '📚 لا توجد كورسات', articles: '📄 لا توجد مقالات', videos: '🎬 لا توجد فيديوهات' };
                    grid.innerHTML = `<div class="text-center py-16 text-gray-400 text-sm">${msgs[this.currentTab]}</div>`;
                    this.renderSubcategoryChips([]);
                    return;
                }

                const subcatsArray = Array.from(subcats);
                this.renderSubcategoryChips(subcatsArray);

                const filtered = this.currentSubcategory === 'الكل' ? docsArray : docsArray.filter(d => d.subcategory === this.currentSubcategory);

                let html = '';
                filtered.forEach(d => {
                    const title = d.title || 'بدون عنوان';
                    const desc = d.desc || '';
                    const shortDesc = desc.length > 100 ? desc.substring(0,100)+'...' : desc;
                    const authorName = d.authorName || 'Shark UP';
                    const authorPhoto = d.authorPhoto || '';
                    const date = d.createdAt ? new Date(d.createdAt.seconds*1000).toLocaleDateString('ar-EG') : '';
                    const videoLink = d.videoLink || '';
                    const subcategory = d.subcategory || 'أخرى';

                    let icon = '📄';
                    if (this.currentTab === 'courses') icon = '📚';
                    else if (this.currentTab === 'videos') icon = '🎬';

                    html += `
                    <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm cursor-pointer hover:shadow-md transition"
                         data-id="${d.id}" data-title="${title.replace(/"/g,'&quot;')}" data-author="${authorName.replace(/"/g,'&quot;')}"
                         data-photo="${authorPhoto.replace(/"/g,'&quot;')}" data-date="${date}" data-video="${videoLink.replace(/"/g,'&quot;')}"
                         data-tab="${this.currentTab}" onclick="academy.openFromElement(this)">
                        <div class="flex items-start gap-3">
                            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-sky-100 to-blue-100 flex items-center justify-center text-2xl flex-shrink-0">${icon}</div>
                            <div class="flex-1 min-w-0">
                                <div class="flex flex-wrap justify-between items-start gap-2">
                                    <h4 class="card-title flex-1">${title}</h4>
                                    <span class="text-[10px] bg-gray-100 px-2 py-0.5 rounded-full text-gray-600 whitespace-nowrap">${subcategory}</span>
                                </div>
                                <p class="text-xs text-gray-500 mt-2 mb-2 leading-relaxed">${shortDesc}</p>
                                <div class="flex items-center gap-2 text-[10px] text-gray-400 mt-1">
                                    ${authorPhoto ? `<img src="${authorPhoto}" class="w-5 h-5 rounded-full object-cover">` : '<div class="w-5 h-5 rounded-full bg-gray-200 flex items-center justify-center text-[8px]">🦈</div>'}
                                    <span class="font-bold text-gray-500">${authorName}</span>
                                    <span>·</span>
                                    <span>${date}</span>
                                </div>
                            </div>
                        </div>
                    </div>`;
                });
                grid.innerHTML = html || '<div class="text-center py-16 text-gray-400 text-sm">لا يوجد محتوى في هذه الفئة</div>';
            } catch(e) {
                console.error(e);
                grid.innerHTML = '<div class="text-center py-16 text-red-400 text-sm">⚠️ فشل الاتصال</div>';
            }
        },

        renderSubcategoryChips(subcats) {
            const container = document.getElementById('subcategoryFilter');
            if (!container) return;
            let html = '';
            subcats.forEach(sub => {
                const active = this.currentSubcategory === sub;
                html += `<button class="whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-bold transition ${active ? 'bg-sky-500 text-white' : 'bg-gray-100 text-gray-600'}" onclick="academy.filterBySubcategory('${sub.replace(/'/g, "\\'")}')">${sub === 'الكل' ? '🌐 الكل' : sub}</button>`;
            });
            container.innerHTML = html;
        },

        filterBySubcategory(sub) {
            this.currentSubcategory = sub;
            this.loadData();
        },

        openFromElement(el) {
            const id = el.getAttribute('data-id');
            const title = el.getAttribute('data-title');
            const author = el.getAttribute('data-author');
            const photo = el.getAttribute('data-photo');
            const date = el.getAttribute('data-date');
            const video = el.getAttribute('data-video');
            const tab = el.getAttribute('data-tab');
            this.openContent(id, title, author, photo, date, video, tab);
        },

        openContent(id, title, authorName, authorPhoto, date, videoLink, tabType) {
            const modal = document.getElementById('contentModal');
            const modalVideo = document.getElementById('modalVideo');
            const modalContent = document.getElementById('modalContent');

            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalAuthorName').textContent = authorName;
            document.getElementById('modalAuthorPhoto').src = authorPhoto || '';
            document.getElementById('modalDate').textContent = date;

            modal.classList.remove('hidden');
            modalVideo.classList.add('hidden');
            modalVideo.innerHTML = '';
            modalContent.classList.add('hidden');
            modalContent.innerHTML = '';

            if (tabType === 'videos' && videoLink) {
                const videoID = extractYouTubeID(videoLink);
                if (videoID) {
                    modalVideo.classList.remove('hidden');
                    modalVideo.innerHTML = `<iframe class="w-full h-full" src="https://www.youtube.com/embed/${videoID}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="border:0; pointer-events:auto;"></iframe>`;
                    return;
                } else {
                    modalContent.innerHTML = '⚠️ رابط الفيديو غير صالح.';
                    modalContent.classList.remove('hidden');
                    return;
                }
            }

            modalContent.innerHTML = '<div class="text-center py-4"><i class="fa-solid fa-spinner fa-spin"></i> جاري التحميل...</div>';
            modalContent.classList.remove('hidden');
            const map = { courses: 'academy_courses', articles: 'academy_articles', videos: 'academy_videos' };
            const col = map[tabType] || 'academy_articles';
            getDoc(doc(db, col, id)).then(snap => {
                if (snap.exists()) {
                    modalContent.innerHTML = snap.data().desc || 'لا يوجد وصف.';
                } else {
                    modalContent.innerHTML = 'المحتوى غير متوفر.';
                }
            }).catch(() => {
                modalContent.innerHTML = 'تعذر التحميل.';
            });
        },

        closeContentModal() {
            document.getElementById('contentModal').classList.add('hidden');
            document.getElementById('modalVideo').innerHTML = '';
        },

        openAddModal() {
            document.getElementById('acadModal').classList.remove('hidden');
            document.getElementById('acadCategory').value = this.currentTab;
            this.toggleVideoLink();
        },
        closeAddModal() {
            document.getElementById('acadModal').classList.add('hidden');
        },
        toggleVideoLink() {
            const cat = document.getElementById('acadCategory').value;
            document.getElementById('videoLinkGroup').classList.toggle('hidden', cat !== 'videos');
        },

        async saveData() {
            const category = document.getElementById('acadCategory').value;
            const subcategory = document.getElementById('acadSubcategory').value;
            const title = document.getElementById('acadTitle').value.trim();
            const desc = document.getElementById('acadDesc').value.trim();
            const videoLink = document.getElementById('acadVideoLink')?.value.trim() || '';

            if (!title) {
                alert('الرجاء إدخال عنوان');
                return;
            }
            if (!desc) {
                alert('الرجاء إدخال وصف');
                return;
            }

            const btn = document.getElementById('acadBtnSave');
            btn.disabled = true; 
            btn.innerText = 'جاري النشر...';

            try {
                const user = auth.currentUser;
                const profile = await engine.getOrCreateUserProfile().catch(() => ({}));
                const map = { courses: 'academy_courses', articles: 'academy_articles', videos: 'academy_videos' };
                const col = map[category] || 'academy_courses';

                const data = {
                    title, desc, subcategory,
                    authorName: profile.displayName || user.displayName || 'مستخدم',
                    authorPhoto: profile.photoURL || user.photoURL || '',
                    authorId: user.uid,
                    createdAt: serverTimestamp()
                };
                if (category === 'videos' && videoLink) data.videoLink = videoLink;

                await addDoc(collection(db, col), data);

                document.getElementById('acadTitle').value = '';
                document.getElementById('acadDesc').value = '';
                if (document.getElementById('acadVideoLink')) document.getElementById('acadVideoLink').value = '';
                this.closeAddModal();
                this.loadData();
            } catch(e) {
                console.error(e);
                alert('حدث خطأ أثناء النشر');
            } finally {
                btn.disabled = false; 
                btn.innerText = 'حفظ ونشر';
            }
        }
    };

    const categorySelect = document.getElementById('acadCategory');
    if (categorySelect) {
        categorySelect.addEventListener('change', () => window.academy.toggleVideoLink());
    }
    window.academy.loadData();
});
</script>
