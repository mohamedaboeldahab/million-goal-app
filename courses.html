<div class="max-w-2xl mx-auto px-4 pt-6 space-y-6 pb-24">
    <!-- Header -->
    <div class="bg-gradient-to-br from-sky-600 to-blue-800 rounded-[2rem] p-6 text-white shadow-xl">
        <h2 class="text-xl font-black italic">SHARK UP ACADEMY</h2>
        <p id="acadStatus" class="text-[9px] mt-2 py-1 px-3 bg-white/10 rounded-full w-fit">⏳ جاري تهيئة المحيط...</p>
    </div>

    <!-- Tabs -->
    <div class="flex gap-2 bg-gray-100 p-1 rounded-2xl">
        <button id="tabCourses" class="flex-1 py-3 rounded-xl font-bold text-xs bg-sky-500 text-white shadow-sm" onclick="academy.switchTab('courses')">الكورسات</button>
        <button id="tabArticles" class="flex-1 py-3 rounded-xl font-bold text-xs text-gray-500" onclick="academy.switchTab('articles')">المقالات</button>
    </div>

    <!-- Content Grid -->
    <div id="academyGrid" class="grid gap-4 py-4 min-h-[150px]">
        <div class="flex justify-center py-10"><div class="w-6 h-6 border-2 border-sky-500 border-t-transparent rounded-full animate-spin"></div></div>
    </div>
</div>

<!-- Floating Action Button -->
<button onclick="academy.openModal()" class="fixed bottom-24 left-6 w-14 h-14 bg-sky-600 text-white shadow-2xl rounded-2xl flex items-center justify-center z-50">
    <i class="fa-solid fa-plus text-xl"></i>
</button>

<!-- Modal -->
<div id="acadModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-md z-[100] flex items-center justify-center p-6">
    <div class="bg-white w-full max-w-sm rounded-[2rem] p-8 space-y-4">
        <h3 class="font-bold text-gray-800 text-lg text-right">نشر في الأكاديمية</h3>
        <input id="acadTitle" class="w-full bg-gray-100 border-none rounded-xl p-4 text-sm text-right" placeholder="العنوان">
        <textarea id="acadDesc" class="w-full bg-gray-100 border-none rounded-xl p-4 text-sm text-right" rows="4" placeholder="الوصف..."></textarea>
        <button id="acadBtnSave" onclick="academy.saveData()" class="w-full bg-sky-600 text-white py-4 rounded-xl font-bold">نشر الآن</button>
        <button onclick="academy.closeModal()" class="w-full text-gray-400 text-xs">إلغاء</button>
    </div>
</div>

<!-- تحميل Firebase بنظام Compat (العام) ليعمل داخل الـ WebView والـ Engine -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
(function() {
    // إعدادات الفايربيس (تأكد من وضع بياناتك هنا)
    const firebaseConfig = {
        apiKey: "AIzaSy...", 
        authDomain: "sharkup-....firebaseapp.com",
        projectId: "sharkup-...",
        storageBucket: "sharkup-....appspot.com",
        messagingSenderId: "...",
        appId: "..."
    };

    // منع إعادة التعريف إذا تم تحميل الصفحة مرتين
    let acadApp;
    if (!firebase.apps.length) {
        acadApp = firebase.initializeApp(firebaseConfig, "AcademyApp");
    } else {
        acadApp = firebase.app("AcademyApp") || firebase.initializeApp(firebaseConfig, "AcademyApp");
    }
    
    const db = acadApp.firestore();

    window.academy = {
        currentTab: 'courses',
        
        async loadData() {
            const grid = document.getElementById('academyGrid');
            const colName = this.currentTab === 'courses' ? "academy_courses" : "academy_articles";
            grid.innerHTML = '<div class="flex justify-center py-10"><div class="w-6 h-6 border-2 border-sky-500 border-t-transparent rounded-full animate-spin"></div></div>';

            try {
                const snap = await db.collection(colName).orderBy("createdAt", "desc").get();
                
                if (snap.empty) {
                    grid.innerHTML = '<div class="text-center py-10 text-gray-400 text-xs">لا يوجد محتوى حالياً</div>';
                    return;
                }

                let html = '';
                snap.forEach(doc => {
                    const data = doc.data();
                    html += `
                        <div class="bg-white p-5 rounded-[1.5rem] border border-gray-100 shadow-sm text-right">
                            <h4 class="font-bold text-slate-800 text-sm">${data.title}</h4>
                            <p class="text-[10px] text-gray-500 mt-2">${data.desc}</p>
                        </div>`;
                });
                grid.innerHTML = html;
            } catch (e) {
                console.error(e);
                grid.innerHTML = '<p class="text-center text-red-500 text-xs">خطأ في الاتصال</p>';
            }
        },

        switchTab(tab) {
            this.currentTab = tab;
            document.getElementById('tabCourses').className = tab==='courses' ? 'flex-1 py-3 rounded-xl font-bold text-xs bg-sky-500 text-white shadow-sm' : 'flex-1 py-3 rounded-xl font-bold text-xs text-gray-500';
            document.getElementById('tabArticles').className = tab==='articles' ? 'flex-1 py-3 rounded-xl font-bold text-xs bg-sky-500 text-white shadow-sm' : 'flex-1 py-3 rounded-xl font-bold text-xs text-gray-500';
            this.loadData();
        },

        openModal() { document.getElementById('acadModal').classList.remove('hidden'); },
        closeModal() { document.getElementById('acadModal').classList.add('hidden'); },

        async saveData() {
            const t = document.getElementById('acadTitle').value;
            const d = document.getElementById('acadDesc').value;
            const btn = document.getElementById('acadBtnSave');

            if(!t || !d) return alert("الرجاء إكمال البيانات");

            btn.disabled = true;
            try {
                const colName = this.currentTab === 'courses' ? "academy_courses" : "academy_articles";
                await db.collection(colName).add({
                    title: t,
                    desc: d,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                this.closeModal();
                this.loadData();
            } catch(e) {
                alert("فشل النشر");
            } finally {
                btn.disabled = false;
            }
        }
    };

    document.getElementById('acadStatus').innerText = "● الأكاديمية متصلة";
    window.academy.loadData();
})();
</script>
