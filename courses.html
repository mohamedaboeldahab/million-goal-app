<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أكاديمية Shark UP</title>
    
    <!-- مكتبات Firebase الأساسية -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- مكتبات التنسيق -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #f8fafc; margin: 0; padding-bottom: 100px; }
        .tab-btn.active { background: #0ea5e9; color: white; box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.8); z-index: 1000; align-items: center; justify-content: center; padding: 1rem; backdrop-filter: blur(8px); }
        .modal.active { display: flex; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease forwards; }
    </style>
</head>
<body>

    <div class="max-w-2xl mx-auto px-4 pt-6 space-y-6">
        <!-- الهيدر -->
        <div class="bg-gradient-to-br from-sky-600 to-blue-800 rounded-[2rem] p-6 text-white shadow-2xl relative overflow-hidden">
            <h2 class="text-2xl font-black mb-1">📚 أكاديمية Shark UP</h2>
            <p class="opacity-80 text-[11px]">تعلم مهارات المستقبل</p>
            <div class="mt-6 flex gap-3">
                <div class="bg-white/15 px-4 py-2 rounded-2xl border border-white/10 text-center">
                    <span class="block text-[10px] opacity-70">الكورسات</span>
                    <span id="coursesCount" class="text-sm font-bold">0</span>
                </div>
                <div class="bg-white/15 px-4 py-2 rounded-2xl border border-white/10 text-center">
                    <span class="block text-[10px] opacity-70">المقالات</span>
                    <span id="articlesCount" class="text-sm font-bold">0</span>
                </div>
            </div>
        </div>

        <!-- التبويبات -->
        <div class="flex gap-2 bg-white p-1.5 rounded-2xl shadow-sm border border-gray-100">
            <button id="tabCourses" class="tab-btn flex-1 py-3 rounded-xl font-bold text-sm active" onclick="academy.switchTab('courses')">الكورسات</button>
            <button id="tabArticles" class="tab-btn flex-1 py-3 rounded-xl font-bold text-sm text-gray-500" onclick="academy.switchTab('articles')">المقالات</button>
        </div>

        <!-- الفلاتر -->
        <div class="flex gap-2 overflow-x-auto pb-2 no-scrollbar" id="filterHashtags"></div>

        <!-- الشبكة -->
        <div id="contentGrid" class="grid gap-4 min-h-[300px]">
            <div class="flex justify-center py-20 text-gray-400 font-bold">جاري التحميل...</div>
        </div>
    </div>

    <!-- زر الإضافة العائم -->
    <button id="toggleSellerBtn" onclick="academy.toggleSellerMode()" class="fixed bottom-6 left-6 w-14 h-14 bg-white rounded-2xl flex items-center justify-center text-gray-400 shadow-xl border border-gray-50 z-50">
        <i class="fa-solid fa-plus text-xl"></i>
    </button>

    <div id="sellerPanel" class="hidden fixed bottom-24 left-6 right-6 z-50 grid grid-cols-2 gap-3">
        <button onclick="academy.openModal('courseModal')" class="bg-sky-500 text-white p-4 rounded-2xl font-bold shadow-lg flex flex-col items-center gap-1 border-2 border-white">
            <i class="fa-solid fa-graduation-cap"></i> <span class="text-[10px]">كورس جديد</span>
        </button>
        <button onclick="academy.openModal('articleModal')" class="bg-emerald-500 text-white p-4 rounded-2xl font-bold shadow-lg flex flex-col items-center gap-1 border-2 border-white">
            <i class="fa-solid fa-pen"></i> <span class="text-[10px]">مقال جديد</span>
        </button>
    </div>

    <!-- مودال الإضافة -->
    <div id="courseModal" class="modal">
        <div class="bg-white w-full max-w-md rounded-[2rem] p-6 space-y-4 max-h-[90vh] overflow-y-auto shadow-2xl">
            <h3 class="text-lg font-black text-gray-800 flex justify-between items-center">
                إضافة كورس جديد <span onclick="academy.closeModal('courseModal')" class="text-gray-300">✕</span>
            </h3>
            <input id="courseTitle" class="w-full bg-gray-50 rounded-xl p-3 border outline-none text-sm" placeholder="عنوان الكورس">
            <textarea id="courseDesc" class="w-full bg-gray-50 rounded-xl p-3 border outline-none text-sm" placeholder="وصف الكورس"></textarea>
            <div id="courseHashtags" class="flex flex-wrap gap-2"></div>
            <div class="border-t pt-4 space-y-3">
                <button onclick="academy.addModuleRow()" class="text-sky-600 text-[10px] font-bold">+ إضافة درس جديد</button>
                <div id="modulesContainer" class="space-y-3"></div>
            </div>
            <button onclick="academy.publishCourse()" class="w-full py-3 bg-sky-600 text-white rounded-xl font-bold text-sm">نشر الآن</button>
        </div>
    </div>

    <!-- مودال العرض -->
    <div id="viewerModal" class="modal">
        <div class="bg-white w-full max-w-md rounded-[2rem] p-6 max-h-[85vh] overflow-y-auto relative">
            <div id="viewerContent"></div>
            <button onclick="academy.closeModal('viewerModal')" class="w-full mt-4 py-3 bg-gray-100 rounded-xl text-sm font-bold">إغلاق</button>
        </div>
    </div>

    <!-- JavaScript المدمج -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB_2ms4K8EPbag7uab9gbDy8eePY6xwpxc",
            authDomain: "millionaireapp-be931.firebaseapp.com",
            projectId: "millionaireapp-be931",
            storageBucket: "millionaireapp-be931.firebasestorage.app",
            messagingSenderId: "325577904362",
            appId: "1:325577904362:web:8d85d4547bf22b1d8f4793"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        window.academy = {
            currentTab: 'courses',
            filter: 'all',
            courses: [],
            articles: [],
            tags: ['بيزنس', 'استثمار', 'تسويق', 'برمجة', 'عملات_رقمية'],

            init() {
                this.renderTagFilters();
                this.loadData();
            },

            async loadData() {
                try {
                    const cSnap = await db.collection("academy_courses").orderBy("createdAt", "desc").get();
                    this.courses = cSnap.docs.map(d => ({id: d.id, ...d.data()}));
                    
                    const aSnap = await db.collection("academy_articles").orderBy("createdAt", "desc").get();
                    this.articles = aSnap.docs.map(d => ({id: d.id, ...d.data()}));

                    document.getElementById('coursesCount').innerText = this.courses.length;
                    document.getElementById('articlesCount').innerText = this.articles.length;
                    this.renderContent();
                } catch (e) { console.error(e); }
            },

            renderTagFilters() {
                const container = document.getElementById('filterHashtags');
                let html = `<button onclick="academy.setFilter('all')" class="px-4 py-1.5 rounded-full text-[10px] font-bold border ${this.filter==='all'?'bg-sky-500 text-white':'bg-white text-gray-500'}">الكل</button>`;
                html += this.tags.map(t => `<button onclick="academy.setFilter('${t}')" class="px-4 py-1.5 rounded-full text-[10px] font-bold border ${this.filter===t?'bg-sky-500 text-white':'bg-white text-gray-500'}">#${t}</button>`).join('');
                container.innerHTML = html;
            },

            setFilter(tag) { this.filter = tag; this.renderTagFilters(); this.renderContent(); },

            renderContent() {
                const grid = document.getElementById('contentGrid');
                let items = this.currentTab === 'courses' ? this.courses : this.articles;
                if (this.filter !== 'all') items = items.filter(i => (i.hashtags || []).includes(this.filter));

                if (items.length === 0) {
                    grid.innerHTML = `<div class="text-center py-20 text-gray-400 text-xs">لا يوجد محتوى حالياً</div>`;
                    return;
                }

                grid.innerHTML = items.map(item => `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-2 animate-fade-in">
                        <h3 class="font-bold text-gray-800 text-sm">${item.title}</h3>
                        <p class="text-[10px] text-gray-500 line-clamp-2">${item.desc || item.content || ''}</p>
                        <button onclick="academy.viewItem('${item.id}')" class="w-full bg-sky-50 text-sky-600 py-2 rounded-xl text-[10px] font-bold">عرض التفاصيل</button>
                    </div>
                `).join('');
            },

            viewItem(id) {
                const item = [...this.courses, ...this.articles].find(x => x.id === id);
                if (!item) return;
                const viewer = document.getElementById('viewerContent');
                viewer.innerHTML = `
                    <h2 class="text-lg font-black text-gray-800 mb-2">${item.title}</h2>
                    <p class="text-xs text-gray-600 leading-relaxed mb-4">${item.desc || ''}</p>
                    ${(item.modules || []).map((m, i) => `
                        <div class="bg-gray-50 p-3 rounded-xl border-r-4 border-sky-500 mb-2">
                            <h4 class="font-bold text-[11px]">الدرس ${i+1}: ${m.title}</h4>
                            <p class="text-[10px] text-gray-500 mt-1">${m.content}</p>
                        </div>
                    `).join('')}
                `;
                this.openModal('viewerModal');
            },

            switchTab(tab) {
                this.currentTab = tab;
                document.getElementById('tabCourses').classList.toggle('active', tab==='courses');
                document.getElementById('tabArticles').classList.toggle('active', tab==='articles');
                this.renderContent();
            },

            toggleSellerMode() {
                document.getElementById('sellerPanel').classList.toggle('hidden');
            },

            openModal(id) { 
                document.getElementById(id).classList.add('active'); 
                if(id==='courseModal') {
                    this.renderTagSelection('courseHashtags');
                    document.getElementById('modulesContainer').innerHTML = '';
                    this.addModuleRow();
                }
            },

            closeModal(id) { document.getElementById(id).classList.remove('active'); },

            renderTagSelection(id) {
                document.getElementById(id).innerHTML = this.tags.map(t => `
                    <button onclick="this.classList.toggle('selected'); this.classList.toggle('bg-sky-500'); this.classList.toggle('text-white')" 
                    class="border px-3 py-1 rounded-full text-[10px] text-gray-400" data-tag="${t}">#${t}</button>
                `).join('');
            },

            addModuleRow() {
                const div = document.createElement('div');
                div.className = 'module-row space-y-2 bg-gray-50 p-3 rounded-xl relative border';
                div.innerHTML = `<input class="m-t w-full text-[10px] p-2 rounded border" placeholder="عنوان الدرس"><textarea class="m-c w-full text-[10px] p-2 rounded border" placeholder="رابط فيديو أو محتوى"></textarea>`;
                document.getElementById('modulesContainer').appendChild(div);
            },

            async publishCourse() {
                const title = document.getElementById('courseTitle').value;
                if(!title) return alert("ادخل العنوان");
                const modules = Array.from(document.querySelectorAll('.module-row')).map(r => ({
                    title: r.querySelector('.m-t').value,
                    content: r.querySelector('.m-c').value
                }));
                const hashtags = Array.from(document.getElementById('courseHashtags').querySelectorAll('.selected')).map(b => b.dataset.tag);
                
                await db.collection("academy_courses").add({
                    title, desc: document.getElementById('courseDesc').value,
                    modules, hashtags, createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                this.closeModal('courseModal');
                this.loadData();
            }
        };

        document.addEventListener('DOMContentLoaded', () => academy.init());
    </script>
</body>
</html>
