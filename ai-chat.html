<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shark AI 🦈 Memory Mode</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="bg-slate-100 p-4">

<div class="max-w-md mx-auto bg-white rounded-3xl shadow-2xl mt-10 overflow-hidden">

<!-- header -->
<div class="bg-slate-900 text-white p-4 flex justify-between">
  <span>Shark AI 🦈</span>
  <span class="text-xs text-green-400">MEMORY MODE</span>
</div>

<!-- chat -->
<div id="chat" class="h-72 overflow-y-auto p-4 space-y-2 bg-slate-50 text-sm">
</div>

<!-- chart -->
<canvas id="chart" class="p-3"></canvas>

<!-- input -->
<div class="p-3 flex gap-2">
  <input id="msg" class="flex-1 bg-slate-100 p-2 rounded-xl"
  placeholder="اكتب..." onkeypress="if(event.key==='Enter')send()">

  <button onclick="send()" class="bg-sky-600 text-white px-4 rounded-xl">
    إرسال
  </button>
</div>

</div>

<script>

////////////////////////////////////////////////////
// 🧠 MEMORY SYSTEM
////////////////////////////////////////////////////
let memory = JSON.parse(localStorage.getItem("shark_memory") || "{}");

function saveMemory(){
    localStorage.setItem("shark_memory", JSON.stringify(memory));
}

////////////////////////////////////////////////////
// 🧠 SMART AI (Sentence Understanding)
////////////////////////////////////////////////////
function normalize(text){
    return text.toLowerCase().trim();
}

// حساب تشابه بسيط بين جملتين
function similarity(a,b){
    let A = a.split(" ");
    let B = b.split(" ");

    let match = A.filter(w => B.includes(w)).length;

    return match / Math.max(A.length,1);
}

function brain(input){

    let text = normalize(input);

    // 🧠 Memory: تسجيل الاسم
    if(text.includes("اسمي") || text.includes("انا اسمي")){
        let name = text.split(" ").pop();
        memory.name = name;
        saveMemory();
        return "تمام يا " + name + " 🦈 هفكرك بيك";
    }

    // 🧠 Memory recall
    if(text.includes("اسمي اي") || text.includes("مين انا")){
        return memory.name 
        ? "انت اسمك " + memory.name + " 🧠"
        : "مش فاكر اسمك لسه 👀 قولّي اسمك";
    }

    // 🧠 Greetings
    if(similarity(text,"مرحبا كيف حالك") > 0.3){
        return "أهلاً بيك 👋 أنا Shark AI، جاهز أساعدك";
    }

    // 💰 money
    if(similarity(text,"ازاي اكسب فلوس اونلاين") > 0.3){
        return "💰 ممكن تبدأ تسويق بالعمولة أو تبيع خدمات رقمية";
    }

    // 💻 coding
    if(similarity(text,"عايز اتعلم برمجة") > 0.3){
        return "💻 ابدأ بـ HTML ثم JavaScript ثم مشاريع صغيرة";
    }

    // 😂 jokes
    if(text.includes("نكتة")){
        return "😂 ليه المبرمج بيحب البحر؟ عشان فيه Java!";
    }

    // 🦈 Shark personality fallback
    return "🦈 أنا Shark AI مش فاهم الجملة كويس، حاول تعيدها بطريقة أبسط";
}

////////////////////////////////////////////////////
// 💬 chat
////////////////////////////////////////////////////
function send(){

    let input = document.getElementById("msg");
    let text = input.value.trim();
    if(!text) return;

    add(text,"user");
    input.value = "";

    let msg = add("...","ai");

    setTimeout(()=>{
        let reply = brain(text);
        msg.innerText = reply;
        updateChart(reply.length);
    },500);
}

function add(t,type){

    let box = document.getElementById("chat");

    let div = document.createElement("div");

    div.className = type==="user"
    ? "bg-slate-900 text-white p-2 rounded-xl mr-auto w-fit max-w-[80%]"
    : "bg-white p-2 rounded-xl w-fit max-w-[80%]";

    div.innerText = t;

    box.appendChild(div);
    box.scrollTop = box.scrollHeight;

    return div;
}

////////////////////////////////////////////////////
// 📊 Chart
////////////////////////////////////////////////////
let chart;
let i = 0;

window.onload = function(){

    chart = new Chart(document.getElementById("chart"), {
        type: "line",
        data: {
            labels: ["0"],
            datasets: [{
                label: "تفاعل",
                data: [0],
                borderWidth: 2
            }]
        }
    });

    // welcome memory
    if(memory.name){
        add("أهلاً بيك يا " + memory.name + " 🦈","ai");
    }
};

function updateChart(v){
    i++;
    chart.data.labels.push(i);
    chart.data.datasets[0].data.push(v);
    chart.update();
}

</script>

</body>
</html>
