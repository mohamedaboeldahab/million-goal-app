<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shark AI | نسخة المبرمج</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- استدعاء مكتبة جوجل الرسمية -->
    <script type="importmap">
      {
        "imports": {
          "@google/generative-ai": "https://esm.run/@google/generative-ai"
        }
      }
    </script>
</head>
<body class="bg-slate-100 p-4">

    <div class="max-w-md mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden mt-10 border border-slate-200">
        <div class="bg-sky-700 p-5 text-white flex justify-between items-center">
            <span class="font-bold">Shark AI 🦈</span>
            <span class="text-[10px] bg-sky-600 px-2 py-1 rounded">SDK STABLE</span>
        </div>
        
        <div id="chatBox" class="h-96 overflow-y-auto p-5 space-y-4 bg-slate-50 text-sm">
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100">
                جاهز للعمل يا هندسة! اسألني أي سؤال في البرمجة أو الاستثمار.
            </div>
        </div>

        <div class="p-4 bg-white border-t flex gap-2">
            <input type="text" id="userInput" class="flex-1 bg-slate-100 rounded-xl px-4 py-2 outline-none focus:ring-2 focus:ring-sky-500" placeholder="اكتب سؤالك...">
            <button onclick="askAI()" id="sendBtn" class="bg-sky-700 text-white px-4 py-2 rounded-xl active:scale-95">إرسال</button>
        </div>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";

        // ضع مفتاح API الخاص بك هنا
        const API_KEY = "AIzaSyAUamuXa-gndq8CZw5DAXdqcxUuOwAsZz0"; 
        const genAI = new GoogleGenerativeAI(API_KEY);

        window.askAI = async function() {
            const input = document.getElementById('userInput');
            const btn = document.getElementById('sendBtn');
            const text = input.value.trim();

            if (!text || !API_KEY.startsWith("AIza")) {
                alert("يرجى وضع مفتاح API صحيح");
                return;
            }

            addMsg(text, 'user');
            input.value = '';
            const loading = addMsg('جاري التفكير...', 'ai');
            btn.disabled = true;

            try {
                // استخدام نموذج Flash السريع والمجاني
                const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
                const result = await model.generateContent(`أنت مستشار مالي وبرمجي خبير. أجب بالعربية باختصار: ${text}`);
                const response = await result.response;
                loading.innerText = response.text();
            } catch (error) {
                console.error(error);
                loading.innerText = "❌ حدث خطأ. تأكد من صحة المفتاح أو الاتصال.";
            } finally {
                btn.disabled = false;
            }
        }

        function addMsg(t, s) {
            const box = document.getElementById('chatBox');
            const d = document.createElement('div');
            d.className = s === 'ai' 
                ? 'bg-white p-3 rounded-2xl shadow-sm border border-slate-100 w-fit max-w-[85%]' 
                : 'bg-sky-700 p-3 rounded-2xl text-white mr-auto w-fit max-w-[85%]';
            d.innerText = t;
            box.appendChild(d);
            box.scrollTop = box.scrollHeight;
            return d;
        }
    </script>
</body>
</html>
