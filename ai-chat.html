<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shark AI - المستشار المالي</title>
    <!-- حل مشكلة favicon -->
    <link rel="icon" href="data:,">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .chat-box { height: 60vh; border-radius: 20px; }
        .dot-loading { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body class="p-4 sm:p-8">

<div class="max-w-xl mx-auto bg-white rounded-[32px] shadow-2xl border border-slate-100 overflow-hidden">
    <!-- Header -->
    <div class="bg-sky-600 p-6 text-white flex items-center gap-4">
        <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center border border-white/30">
            <i class="fa-solid fa-robot text-xl"></i>
        </div>
        <div>
            <h1 class="font-black text-lg">Shark AI</h1>
            <p class="text-[10px] opacity-80 uppercase tracking-widest font-bold">المستشار الاستثماري الذكي</p>
        </div>
    </div>

    <!-- Chat Area -->
    <div id="chatBox" class="chat-box overflow-y-auto p-6 space-y-4 bg-slate-50/50">
        <div class="bg-white p-4 rounded-2xl rounded-tr-none shadow-sm border border-slate-100 text-sm text-slate-700 max-w-[85%]">
            أهلاً بك! أنا **Shark AI**. كيف يمكنني مساعدتك في استثماراتك اليوم؟
        </div>
    </div>

    <!-- API Key Section (Visible if not set) -->
    <div id="apiSection" class="p-4 bg-amber-50 border-y border-amber-100 hidden">
        <p class="text-[10px] text-amber-700 font-bold mb-2">تنبيه: يجب إدخال مفتاح API ليعمل النظام</p>
        <div class="flex gap-2">
            <input type="password" id="apiKeyInput" placeholder="ألصق Gemini Key هنا..." 
                   class="flex-1 border rounded-xl px-3 py-2 text-xs outline-none focus:border-amber-500 shadow-sm">
            <button onclick="saveKey()" class="bg-amber-600 text-white px-4 py-2 rounded-xl text-xs font-bold transition-transform active:scale-95">حفظ</button>
        </div>
    </div>

    <!-- Input Area -->
    <div class="p-6 bg-white border-t border-slate-50">
        <div class="flex gap-2">
            <input type="text" id="aiInput" onkeypress="handleKeyPress(event)"
                   placeholder="اسأل عن الذهب، الأسهم، أو الميزانية..." 
                   class="flex-1 bg-slate-100 border-none rounded-2xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-sky-500 transition-all">
            
            <button onclick="askAI()" id="sendBtn" class="bg-sky-600 hover:bg-sky-700 text-white w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg transition-all active:scale-90">
                <i class="fa-solid fa-paper-plane text-lg"></i>
            </button>
        </div>
    </div>
</div>

<script>
    // ========== المنطق البرمجي (تم تصحيح كافة المتغيرات) ==========
    let chatHistory = [];
    let currentKey = localStorage.getItem('my_gemini_key') || '';

    // إظهار خانة المفتاح إذا كان فارغاً
    if (!currentKey) {
        document.getElementById('apiSection').classList.remove('hidden');
    }

    function saveKey() {
        const keyVal = document.getElementById('apiKeyInput').value.trim();
        if (keyVal) {
            localStorage.setItem('my_gemini_key', keyVal);
            currentKey = keyVal;
            document.getElementById('apiSection').classList.add('hidden');
            addMessageUI('✅ تم تفعيل المفتاح بنجاح! يمكنك السؤال الآن.', 'ai');
        }
    }

    function handleKeyPress(e) { if (e.key === 'Enter') askAI(); }

    async function askAI() {
        const inputField = document.getElementById('aiInput');
        const sendBtn = document.getElementById('sendBtn');
        const question = inputField.value.trim();

        if (!question) return;
        if (!currentKey) {
            document.getElementById('apiSection').classList.remove('hidden');
            alert('يرجى إدخال API Key أولاً');
            return;
        }

        // 1. إضافة سؤال المستخدم
        addMessageUI(question, 'user');
        inputField.value = '';
        
        // 2. رسالة الانتظار
        const typingDiv = addMessageUI('<span class="dot-loading">جاري تحليل طلبك المالي...</span>', 'ai');
        sendBtn.disabled = true;

        // 3. المحادثة مع AI (تصحيح الروابط والـ Error Handling)
        try {
            chatHistory.push({ role: "user", parts: [{ text: question }] });

            // استخدام الرابط الأكثر استقراراً
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${currentKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: chatHistory,
                    generationConfig: { temperature: 0.7, maxOutputTokens: 800 }
                })
            });

            const data = await response.json();

            if (!response.ok) {
                if (data.error?.message.includes("API key")) {
                    throw new Error("KEY_INVALID");
                }
                throw new Error("SERVER_ERROR");
            }

            const aiReply = data.candidates[0].content.parts[0].text;
            
            // 4. تحديث الواجهة
            updateAIMessage(typingDiv, aiReply);
            chatHistory.push({ role: "model", parts: [{ text: aiReply }] });

        } catch (error) {
            console.error("AI Error:", error);
            if (error.message === "KEY_INVALID") {
                updateAIMessage(typingDiv, "🔑 المفتاح غير صحيح أو غير مفعل. يرجى التأكد منه من Google AI Studio.");
                document.getElementById('apiSection').classList.remove('hidden');
            } else {
                updateAIMessage(typingDiv, "❌ حدث خطأ في الاتصال. تأكد من الإنترنت أو حاول لاحقاً.");
            }
        } finally {
            sendBtn.disabled = false;
            // الحفاظ على آخر 10 رسائل لضمان السرعة
            if (chatHistory.length > 10) chatHistory = chatHistory.slice(-10);
        }
    }

    function addMessageUI(text, sender) {
        const box = document.getElementById('chatBox');
        const div = document.createElement('div');
        const isAI = sender === 'ai';
        
        div.className = isAI
            ? 'bg-white p-4 rounded-2xl rounded-tr-none shadow-sm border border-slate-100 text-sm text-slate-700 max-w-[85%] leading-relaxed'
            : 'bg-sky-600 p-4 rounded-2xl rounded-tl-none shadow-md text-sm text-white max-w-[85%] ml-auto leading-relaxed';
        
        div.innerHTML = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        return div;
    }

    function updateAIMessage(element, text) {
        if (!element) return;
        const formatted = text
            .replace(/\*\*(.*?)\*\*/g, '<strong class="text-sky-800">$1</strong>')
            .replace(/\n/g, '<br>');
        element.innerHTML = formatted;
        document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
    }
</script>

</body>
</html>
