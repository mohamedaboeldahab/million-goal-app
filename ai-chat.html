<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shark AI - Free Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="p-4">

<div class="max-w-xl mx-auto bg-white shadow-2xl rounded-3xl overflow-hidden mt-10">
    <!-- Header -->
    <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-6 text-white text-center">
        <h1 class="text-2xl font-black">Shark AI 🦈</h1>
        <p class="text-xs opacity-80">الإصدار المجاني المستقر</p>
    </div>

    <!-- Chat Box -->
    <div id="chatBox" class="h-[400px] overflow-y-auto p-6 space-y-4 bg-gray-50">
        <div class="bg-blue-100 p-4 rounded-2xl rounded-tr-none text-sm text-gray-700">
            أهلاً بك! أنا أعمل الآن عبر خوادم Hugging Face المجانية. كيف يمكنني مساعدتك؟
        </div>
    </div>

    <!-- Input -->
    <div class="p-4 bg-white border-t">
        <div class="flex gap-2">
            <input type="text" id="userInput" onkeypress="if(event.key === 'Enter') askAI()"
                   placeholder="اكتب سؤالك هنا..." 
                   class="flex-1 border border-gray-200 rounded-xl px-4 py-3 outline-none focus:border-blue-500">
            <button onclick="askAI()" id="sendBtn" class="bg-blue-600 text-white px-6 rounded-xl hover:bg-blue-700 transition-all">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>

<script>
    // هذا رابط نموذج Qwen 2.5 وهو جبار في اللغة العربية ومجاني
    const API_URL = "https://api-inference.huggingface.co/models/Qwen/Qwen2.5-72B-Instruct";
    
    // ملاحظة: يفضل وضع الـ Token الخاص بك هنا لضمان عمله دائماً
    // يمكنك الحصول عليه مجاناً من https://huggingface.co/settings/tokens
    const HF_TOKEN = "hf_VvGAsLpPzWpLwEYSshfMMLvYvXvXvXvXv"; // ضع التوكن الخاص بك هنا

    async function askAI() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        const sendBtn = document.getElementById('sendBtn');

        if (!text) return;

        addMessage(text, 'user');
        input.value = '';
        const typingDiv = addMessage('جاري التفكير...', 'ai');
        sendBtn.disabled = true;

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    // "Authorization": `Bearer ${HF_TOKEN}` // فك التعليق إذا وضعت توكن
                },
                body: JSON.stringify({
                    inputs: `<|im_start|>system\nأنت مستشار مالي ذكي تجيب بالعربية بوضوح.<|im_end|>\n<|im_start|>user\n${text}<|im_end|>\n<|im_start|>assistant`,
                    parameters: { max_new_tokens: 500, return_full_text: false }
                })
            });

            const data = await response.json();
            
            // في Hugging Face الرد يكون مصفوفة
            let aiReply = "";
            if (Array.isArray(data)) {
                aiReply = data[0].generated_text;
            } else {
                aiReply = "النظام مشغول حالياً، حاول مرة أخرى بعد لحظات.";
            }

            updateMessage(typingDiv, aiReply);

        } catch (error) {
            updateMessage(typingDiv, "❌ حدث خطأ، تأكد من اتصال الإنترنت.");
        } finally {
            sendBtn.disabled = false;
        }
    }

    function addMessage(text, sender) {
        const box = document.getElementById('chatBox');
        const div = document.createElement('div');
        div.className = sender === 'ai' 
            ? 'bg-blue-100 p-4 rounded-2xl rounded-tr-none text-sm text-gray-700 w-fit max-w-[85%]'
            : 'bg-blue-600 p-4 rounded-2xl rounded-tl-none text-sm text-white w-fit max-w-[85%] mr-auto';
        div.innerText = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        return div;
    }

    function updateMessage(element, text) {
        element.innerText = text;
        document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
    }
</script>

</body>
</html>
