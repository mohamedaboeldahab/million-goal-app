<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shark AI - المستقر</title>
    <link rel="icon" href="data:,">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-4">

<div class="max-w-lg mx-auto mt-10 p-6 bg-slate-800 rounded-3xl shadow-2xl border border-slate-700">
    <h1 class="text-xl font-black mb-4 border-b border-slate-700 pb-2 text-sky-400">Shark AI V4 🦈</h1>
    
    <div id="chatBox" class="h-80 overflow-y-auto mb-4 space-y-3 p-2">
        <div class="bg-slate-700 p-3 rounded-xl text-sm">تم تحديث الاتصال.. اسألني أي سؤال مالي.</div>
    </div>

    <div class="flex gap-2">
        <input type="text" id="userInput" class="flex-1 bg-slate-700 border-none rounded-xl px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-sky-500 text-white" placeholder="اكتب سؤالك...">
        <button onclick="askAI()" id="sendBtn" class="bg-sky-600 hover:bg-sky-500 px-4 py-2 rounded-xl transition-all">
            إرسال
        </button>
    </div>
</div>

<script>
    // تنظيف أي Service Worker قديم مسبب للمشاكل
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
            for(let registration of registrations) { registration.unregister(); }
        });
    }

    async function askAI() {
        const input = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const text = input.value.trim();
        if(!text) return;

        addMsg(text, 'user');
        input.value = '';
        const loading = addMsg('جاري الاتصال بالسيرفر...', 'ai');
        sendBtn.disabled = true;

        try {
            // سنستخدم نموذج Mistral لأنه أكثر استقراراً مع طلبات الـ CORS
            const response = await fetch("https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.3", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    inputs: `[INST] أنت مستشار مالي ذكي. أجب بالعربية باختصار: ${text} [/INST]`,
                    parameters: { max_new_tokens: 300 }
                })
            });

            const data = await response.json();
            
            if (response.ok) {
                // معالجة رد Hugging Face
                let reply = Array.isArray(data) ? data[0].generated_text : data.generated_text;
                // تنظيف الرد من الـ Instructions
                reply = reply.split('[/INST]').pop().trim();
                loading.innerText = reply;
            } else {
                loading.innerText = "❌ السيرفر مشغول حالياً (Rate Limit). جرب بعد دقيقة.";
            }
        } catch (error) {
            loading.innerText = "❌ فشل الاتصال. تأكد من إغلاق أي VPN وجرب مرة أخرى.";
        } finally {
            sendBtn.disabled = false;
        }
    }

    function addMsg(t, s) {
        const d = document.createElement('div');
        d.className = s === 'ai' ? 'bg-slate-700 p-3 rounded-xl text-sm' : 'bg-sky-600 p-3 rounded-xl text-sm mr-auto w-fit max-w-[80%]';
        d.innerText = t;
        const box = document.getElementById('chatBox');
        box.appendChild(d);
        box.scrollTop = box.scrollHeight;
        return d;
    }
</script>
</body>
</html>
