<div class="flex flex-col h-[75vh]">
    <!-- رأس المستشار -->
    <div class="bg-sky-50 p-4 rounded-2xl mb-4 border border-sky-100 flex items-center gap-3">
        <div class="w-10 h-10 bg-sky-500 rounded-full flex items-center justify-center text-white">
            <i class="fa-solid fa-robot"></i>
        </div>
        <div>
            <h4 class="font-black text-sm text-sky-900">المستشار المالي (Shark AI)</h4>
            <p class="text-[10px] text-sky-600">اسألني عن أي استثمار أو خطة مالية</p>
        </div>
    </div>

    <!-- مربع الدردشة -->
    <div id="chatBox" class="flex-1 overflow-y-auto space-y-4 px-2 pb-4">
        <div class="bg-white p-4 rounded-2xl rounded-tr-none shadow-sm text-sm text-slate-700 max-w-[80%] ml-auto">
            مرحباً أيها القرش! كيف يمكنني مساعدتك في تنمية ثروتك اليوم؟
        </div>
    </div>

    <!-- إعدادات المفتاح (تظهر فقط عند الحاجة) -->
    <div id="apiKeyBanner" class="p-3 bg-amber-50 rounded-xl border border-amber-200 text-xs text-amber-700 mb-2 hidden">
        ⚠️ المفتاح الحالي غير صالح أو منتهي. يمكنك الحصول على مفتاح مجاني من 
        <a href="https://aistudio.google.com/app/apikey" target="_blank" class="underline font-bold">هنا</a>.
        <div class="flex gap-2 mt-2">
            <input type="text" id="apiKeyInput" placeholder="ألصق المفتاح هنا..." class="flex-1 border rounded-lg px-2 py-1 text-xs">
            <button onclick="updateApiKey()" class="bg-amber-500 text-white px-3 py-1 rounded-lg text-xs font-bold">تحديث</button>
        </div>
    </div>

    <!-- حقل الإدخال -->
    <div class="p-4 bg-white rounded-2xl shadow-lg border flex gap-2">
        <input type="text" id="aiInput" placeholder="اسأل المستشار..." class="flex-1 outline-none text-sm bg-transparent">
        <button onclick="askAI()" class="bg-sky-500 text-white w-10 h-10 rounded-xl flex items-center justify-center">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </div>
</div>

<script>
    // ========== الإعدادات ==========
    const DEFAULT_KEY = 'AIzaSyAUamuXa-gndq8CZw5DAXdqcxUuOwAsZz0'; // مفتاحك المدمج
    let currentKey = localStorage.getItem('user_gemini_key') || DEFAULT_KEY;

    function updateApiKey() {
        const newKey = document.getElementById('apiKeyInput').value.trim();
        if (newKey) {
            localStorage.setItem('user_gemini_key', newKey);
            currentKey = newKey;
            document.getElementById('apiKeyBanner').classList.add('hidden');
            addMessage('✅ تم تحديث المفتاح بنجاح. يمكنك الآن السؤال.', 'ai');
        }
    }

    async function askAI() {
        const input = document.getElementById('aiInput');
        const question = input?.value.trim();
        if (!question) return;

        addMessage(question, 'user');
        input.value = '';
        const typingDiv = addMessage('...', 'ai');

        try {
            const response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${currentKey}`,
                {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `أنت مستشار مالي خبير اسمه "Shark AI". تتحدث بالعربية فقط. تعطي إجابات دقيقة، مفصلة، ومفيدة. تقدم تحليلات ونصائح مخصصة بناءً على وصف المستخدم لموقفه المالي. تجيب بأسلوب واضح ومحترف. الآن أجب عن السؤال التالي:\n\n${question}`
                            }]
                        }],
                        generationConfig: {
                            temperature: 0.7,
                            maxOutputTokens: 800
                        }
                    })
                }
            );

            const data = await response.json();

            if (data.error) {
                // خطأ في المفتاح – أظهر البانر لتغييره
                if (data.error.code === 400 || data.error.code === 403 || data.error.status === 'PERMISSION_DENIED') {
                    document.getElementById('apiKeyBanner').classList.remove('hidden');
                    throw new Error('مفتاح API غير صالح');
                } else {
                    throw new Error(data.error.message || 'خطأ غير معروف');
                }
            }

            const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!reply) throw new Error('لم يتم استلام رد من النموذج');
            
            updateMessage(typingDiv, reply);

        } catch (error) {
            console.error(error);
            let msg = '❌ حدث خطأ في الاتصال. حاول مرة أخرى لاحقاً.';
            if (error.message.includes('API key') || error.message.includes('مفتاح')) {
                msg = '🔑 المفتاح الحالي غير صالح. يُرجى تحديثه باستخدام زر الإعدادات أعلاه.';
            } else if (error.message.includes('quota') || error.message.includes('429')) {
                msg = '⏳ لقد تجاوزت الحد المسموح للاستخدام اليومي. يرجى المحاولة غداً أو استخدام مفتاح آخر.';
            }
            updateMessage(typingDiv, msg);
        }
    }

    function addMessage(text, sender) {
        const box = document.getElementById('chatBox');
        if (!box) return null;
        const div = document.createElement('div');
        const isAI = sender === 'ai';
        div.className = isAI
            ? 'bg-white p-4 rounded-2xl rounded-tr-none shadow-sm text-sm text-slate-700 max-w-[80%]'
            : 'bg-sky-500 text-white p-4 rounded-2xl rounded-tl-none shadow-sm text-sm max-w-[80%] ml-auto';
        div.textContent = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        return div;
    }

    function updateMessage(element, newText) {
        if (element) {
            element.textContent = newText;
            const box = document.getElementById('chatBox');
            if (box) box.scrollTop = box.scrollHeight;
        }
    }

    // إذا لم يكن المفتاح الافتراضي يعمل، اختبره عند التحميل (اختياري)
    // يمكن تفعيل الاختبار لكنه قد يستهلك حصة
</script>
