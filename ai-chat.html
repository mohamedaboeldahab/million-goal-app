<div class="flex flex-col h-[75vh]">
    <!-- رأس المستشار -->
    <div class="bg-sky-50 p-4 rounded-2xl mb-4 border border-sky-100 flex items-center gap-3">
        <div class="w-10 h-10 bg-sky-500 rounded-full flex items-center justify-center text-white">
            <i class="fa-solid fa-robot"></i>
        </div>
        <div>
            <h4 class="font-black text-sm text-sky-900">المستشار المالي (Shark AI)</h4>
            <p class="text-[10px] text-sky-600">اسألني عن أي استثمار أو خطة مالية</p>
        </div>
    </div>

    <!-- مربع الدردشة -->
    <div id="chatBox" class="flex-1 overflow-y-auto space-y-4 px-2 pb-4">
        <div class="bg-white p-4 rounded-2xl rounded-tr-none shadow-sm text-sm text-slate-700 max-w-[80%] ml-auto">
            مرحباً! أنا مستشارك المالي. صف لي موقفك المالي وسأساعدك.
        </div>
    </div>

    <!-- شريط المفتاح (يظهر إذا لم يُحفظ) -->
    <div id="apiKeyBanner" class="p-3 bg-amber-50 rounded-xl border border-amber-200 text-xs text-amber-700 mb-2 hidden">
        ⚠️ تحتاج إلى مفتاح Hugging Face (مجاني). <a href="https://huggingface.co/settings/tokens" target="_blank" class="underline font-bold">احصل عليه من هنا</a>.
        <div class="flex gap-2 mt-2">
            <input type="text" id="apiKeyInput" placeholder="hf_..." class="flex-1 border rounded-lg px-2 py-1 text-xs">
            <button onclick="saveKey()" class="bg-amber-500 text-white px-3 py-1 rounded-lg text-xs font-bold">حفظ</button>
        </div>
    </div>

    <!-- شريط اختيار النموذج (صغير جداً) -->
    <div class="flex items-center justify-between px-1 mb-2">
        <span class="text-[9px] text-gray-400">النموذج:</span>
        <select id="modelSelect" class="text-[10px] border rounded px-2 py-0.5 bg-white" onchange="changeModel()">
            <option value="mistralai/Mistral-Nemo-Instruct-2407">Mistral Nemo (الأحدث)</option>
            <option value="mistralai/Mistral-7B-Instruct-v0.2" selected>Mistral 7B (مستقر)</option>
            <option value="HuggingFaceH4/zephyr-7b-beta">Zephyr 7B (خفيف)</option>
        </select>
    </div>

    <!-- حقل الإدخال -->
    <div class="p-4 bg-white rounded-2xl shadow-lg border flex gap-2">
        <input type="text" id="aiInput" placeholder="اسأل المستشار..." class="flex-1 outline-none text-sm bg-transparent">
        <button onclick="askAI()" class="bg-sky-500 text-white w-10 h-10 rounded-xl flex items-center justify-center">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </div>
</div>

<script>
    // ========== المتغيرات ==========
    const DEFAULT_MODEL = 'mistralai/Mistral-7B-Instruct-v0.2';
    let currentModel = localStorage.getItem('selected_model') || DEFAULT_MODEL;
    let HF_TOKEN = localStorage.getItem('hf_token') || '';

    // ضبط القائمة المنسدلة عند التحميل
    document.getElementById('modelSelect').value = currentModel;

    // إظهار شريط المفتاح إن لم يكن موجوداً
    if (!HF_TOKEN) {
        document.getElementById('apiKeyBanner').classList.remove('hidden');
    }

    function changeModel() {
        currentModel = document.getElementById('modelSelect').value;
        localStorage.setItem('selected_model', currentModel);
        addMessage(`✅ تم تغيير النموذج إلى: ${currentModel.split('/')[1]}`, 'ai');
    }

    function saveKey() {
        const key = document.getElementById('apiKeyInput').value.trim();
        if (key.startsWith('hf_')) {
            localStorage.setItem('hf_token', key);
            HF_TOKEN = key;
            document.getElementById('apiKeyBanner').classList.add('hidden');
            addMessage('✅ تم حفظ المفتاح. يمكنك الآن السؤال.', 'ai');
        }
    }

    async function askAI() {
        if (!HF_TOKEN) {
            document.getElementById('apiKeyBanner').classList.remove('hidden');
            addMessage('🔑 يرجى إدخال مفتاح Hugging Face من الشريط أعلاه.', 'ai');
            return;
        }

        const input = document.getElementById('aiInput');
        const question = input?.value.trim();
        if (!question) return;

        addMessage(question, 'user');
        input.value = '';
        const typingDiv = addMessage('...', 'ai');

        const API_URL = `https://api-inference.huggingface.co/models/${currentModel}`;

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${HF_TOKEN}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    inputs: `[INST] أنت مستشار مالي خبير اسمه "Shark AI". تتحدث بالعربية فقط. تعطي إجابات دقيقة، مفصلة، ومفيدة. تقدم تحليلات ونصائح مخصصة بناءً على وصف المستخدم لموقفه المالي. تجيب بأسلوب واضح ومحترف. الآن أجب عن السؤال التالي:\n${question} [/INST]`,
                    parameters: {
                        max_new_tokens: 600,
                        temperature: 0.7
                    }
                })
            });

            const data = await response.json();
            let reply;
            if (data.error) {
                // إذا كان النموذج غير جاهز، انتظر قليلاً ثم أعد المحاولة تلقائياً
                if (data.error.includes('loading') || data.error.includes('currently loading')) {
                    updateMessage(typingDiv, '⏳ النموذج قيد التحميل، أعد المحاولة بعد لحظات...');
                    // إعادة المحاولة بعد 5 ثوانٍ
                    setTimeout(async () => {
                        updateMessage(typingDiv, '🔄 جاري إعادة المحاولة...');
                        await askAI(); // استدعاء ذاتي (مع نفس السؤال لكن ربما يعيد)
                    }, 5000);
                    return;
                }
                throw new Error(data.error);
            }

            if (Array.isArray(data)) {
                reply = data[0]?.generated_text || 'لم يتم توليد رد.';
            } else {
                reply = data.generated_text || 'لم يتم توليد رد.';
            }
            updateMessage(typingDiv, reply.trim());

        } catch (error) {
            console.error(error);
            updateMessage(typingDiv, '❌ حدث خطأ. تأكد من صحة المفتاح أو جرب نموذجاً آخر من القائمة أعلاه.');
        }
    }

    function addMessage(text, sender) {
        const box = document.getElementById('chatBox');
        if (!box) return null;
        const div = document.createElement('div');
        const isAI = sender === 'ai';
        div.className = isAI
            ? 'bg-white p-4 rounded-2xl rounded-tr-none shadow-sm text-sm text-slate-700 max-w-[80%]'
            : 'bg-sky-500 text-white p-4 rounded-2xl rounded-tl-none shadow-sm text-sm max-w-[80%] ml-auto';
        div.textContent = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        return div;
    }

    function updateMessage(element, newText) {
        if (element) {
            element.textContent = newText;
            const box = document.getElementById('chatBox');
            if (box) box.scrollTop = box.scrollHeight;
        }
    }
</script>
