<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shark AI - المستشار المالي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .chat-container { height: calc(100vh - 40px); max-width: 600px; margin: 20px auto; }
        .message-ai { border-bottom-right-radius: 4px; }
        .message-user { border-bottom-left-radius: 4px; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>

<div class="chat-container flex flex-col bg-white shadow-2xl rounded-3xl overflow-hidden border border-slate-200">
    
    <!-- رأس المستشار -->
    <div class="bg-sky-600 p-4 flex items-center gap-3 text-white">
        <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center backdrop-blur-md">
            <i class="fa-solid fa-chart-line text-xl"></i>
        </div>
        <div>
            <h4 class="font-black text-lg">Shark AI</h4>
            <p class="text-[11px] opacity-80">مستشارك المالي الذكي لتنمية الثروة</p>
        </div>
    </div>

    <!-- مربع الدردشة -->
    <div id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50">
        <div class="bg-white p-4 rounded-2xl shadow-sm text-sm text-slate-700 max-w-[85%] border border-slate-100">
            مرحباً بك! أنا **Shark AI**. كيف يمكنني مساعدتك في تخطيط استثماراتك أو إدارة ميزانيتك اليوم؟
        </div>
    </div>

    <!-- تنبيه المفتاح -->
    <div id="apiKeyBanner" class="px-4 py-3 bg-amber-50 border-t border-amber-200 hidden">
        <p class="text-[11px] text-amber-700 font-bold mb-2">⚠️ مفتاح API غير صالح أو غير موجود</p>
        <div class="flex gap-2">
            <input type="password" id="apiKeyInput" placeholder="أدخل API Key هنا..." class="flex-1 border rounded-lg px-3 py-1.5 text-xs outline-none focus:border-amber-500">
            <button onclick="updateApiKey()" class="bg-amber-600 text-white px-4 py-1.5 rounded-lg text-xs font-bold">حفظ</button>
        </div>
    </div>

    <!-- منطقة الإدخال -->
    <div class="p-4 bg-white border-t flex flex-col gap-3">
        <div class="flex gap-2">
            <input type="text" id="aiInput" 
                   onkeypress="if(event.key === 'Enter') askAI()"
                   placeholder="مثال: كيف أستثمر في الذهب بمبلغ بسيط؟" 
                   class="flex-1 outline-none text-sm bg-slate-100 rounded-xl px-4 py-3 focus:ring-2 ring-sky-500 transition-all">
            
            <button onclick="askAI()" id="sendBtn" class="bg-sky-600 hover:bg-sky-700 text-white w-12 h-12 rounded-xl flex items-center justify-center shadow-lg transition-transform active:scale-95">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
        <p class="text-[9px] text-center text-slate-400">جميع الإجابات هي استشارات تعليمية وليست نصائح مالية قانونية.</p>
    </div>
</div>

<script>
    // ========== الإعدادات والذاكرة ==========
    let chatHistory = []; // لتخزين سياق المحادثة
    let currentKey = localStorage.getItem('user_gemini_key') || '';

    // التحقق من وجود المفتاح عند التحميل
    window.onload = () => {
        if (!currentKey) {
            document.getElementById('apiKeyBanner').classList.remove('hidden');
        }
    };

    function updateApiKey() {
        const input = document.getElementById('apiKeyInput');
        if (input.value.trim()) {
            localStorage.setItem('user_gemini_key', input.value.trim());
            currentKey = input.value.trim();
            document.getElementById('apiKeyBanner').classList.add('hidden');
            addMessage('✅ تم تحديث المفتاح بنجاح! أنا جاهز للرد على استفساراتك.', 'ai');
        }
    }

    async function askAI() {
        const input = document.getElementById('aiInput');
        const question = input.value.trim();
        const sendBtn = document.getElementById('sendBtn');

        if (!question || sendBtn.disabled) return;

        if (!currentKey) {
            document.getElementById('apiKeyBanner').classList.remove('hidden');
            return;
        }

        // إضافة سؤال المستخدم للواجهة والذاكرة
        addMessage(question, 'user');
        chatHistory.push({ role: "user", parts: [{ text: question }] });
        input.value = '';
        
        // رسالة جارٍ التفكير
        const typingDiv = addMessage('... جاري تحليل البيانات المالية', 'ai');
        sendBtn.disabled = true;

        try {
            // استخدام رابط v1beta لضمان التوافق
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${currentKey}`;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: chatHistory,
                    systemInstruction: {
                        parts: [{ text: "أنت مستشار مالي خبير ومحلل استثماري اسمك Shark AI. أسلوبك محترف، واضح، وتستخدم أمثلة عملية. أجب دائماً بالعربية." }]
                    },
                    generationConfig: { temperature: 0.7, maxOutputTokens: 1000 }
                })
            });

            const data = await response.json();

            if (!response.ok) {
                if (response.status === 400 || response.status === 403) {
                    throw new Error("KEY_ERROR");
                }
                throw new Error(data.error?.message || "SERVER_ERROR");
            }

            const reply = data.candidates[0].content.parts[0].text;
            
            // تحديث الواجهة والذاكرة
            updateMessage(typingDiv, reply);
            chatHistory.push({ role: "model", parts: [{ text: reply }] });

        } catch (error) {
            console.error(error);
            if (error.message === "KEY_ERROR") {
                updateMessage(typingDiv, "🔑 يبدو أن مفتاح API غير صحيح. يرجى تحديثه من القائمة بالأعلى.");
                document.getElementById('apiKeyBanner').classList.remove('hidden');
            } else {
                updateMessage(typingDiv, "❌ عذراً، واجهت مشكلة في الاتصال بالسوق المالي. حاول مرة أخرى.");
            }
        } finally {
            sendBtn.disabled = false;
            // الحفاظ على آخر 10 رسائل فقط لضمان سرعة الأداء
            if (chatHistory.length > 10) chatHistory = chatHistory.slice(-10);
        }
    }

    function addMessage(text, sender) {
        const box = document.getElementById('chatBox');
        const div = document.createElement('div');
        const isAI = sender === 'ai';
        
        div.className = isAI
            ? 'bg-white p-4 rounded-2xl message-ai shadow-sm text-sm text-slate-700 max-w-[85%] border border-slate-100 leading-relaxed'
            : 'bg-sky-600 text-white p-4 rounded-2xl message-user shadow-md text-sm max-w-[85%] ml-auto leading-relaxed';
        
        div.innerHTML = text.replace(/\n/g, '<br>');
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        return div;
    }

    function updateMessage(element, newText) {
        if (element) {
            // تحويل الـ Markdown البسيط (مثل **النص**) إلى Bold
            const formattedText = newText
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
            
            element.innerHTML = formattedText;
            document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
        }
    }
</script>

</body>
</html>
