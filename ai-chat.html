<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shark AI 🦈 No API</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="bg-slate-100 p-4">

<div class="max-w-md mx-auto bg-white rounded-3xl shadow-2xl mt-10 overflow-hidden">

<!-- header -->
<div class="bg-slate-900 text-white p-4 flex justify-between">
  <span>Shark AI 🦈</span>
  <span class="text-xs text-green-400">NO API MODE</span>
</div>

<!-- chat -->
<div id="chat" class="h-72 overflow-y-auto p-4 space-y-2 bg-slate-50 text-sm">
  <div class="bg-white p-2 rounded-xl">جرب اسأل أي حاجة 👋</div>
</div>

<!-- chart -->
<canvas id="chart" class="p-3"></canvas>

<!-- input -->
<div class="p-3 flex gap-2">
  <input id="msg" class="flex-1 bg-slate-100 p-2 rounded-xl"
  placeholder="اكتب..." onkeypress="if(event.key==='Enter')send()">

  <button onclick="send()" class="bg-sky-600 text-white px-4 rounded-xl">
    إرسال
  </button>
</div>

</div>

<script>

////////////////////////////////////////////////////
// 🧠 AI بسيط (Rules Engine)
////////////////////////////////////////////////////
function brain(text){

    text = text.toLowerCase();

    // greetings
    if(text.includes("مرحبا") || text.includes("سلام") || text.includes("اهلا")){
        return "أهلاً بيك 👋 أنا Shark AI بدون API";
    }

    // money
    if(text.includes("فلوس") || text.includes("ربح")){
        return "💰 ممكن تربح من التسويق بالعمولة أو المشاريع الرقمية";
    }

    // coding
    if(text.includes("كود") || text.includes("برمجة")){
        return "💻 البرمجة محتاجة تدريب، ابدأ بـ HTML + JS";
    }

    // ai
    if(text.includes("ذكاء") || text.includes("ai")){
        return "🤖 الذكاء الاصطناعي بيشتغل بالبيانات مش بالسحر";
    }

    // joke
    if(text.includes("نكتة")){
        return "😂 ليه المبرمج بيحب القهوة؟ عشان فيها Java!";
    }

    // default
    return "🤔 مش فاهمك كويس، جرب تسأل بطريقة أبسط";
}

////////////////////////////////////////////////////
// 💬 chat
////////////////////////////////////////////////////
function send(){

    const input = document.getElementById("msg");
    const text = input.value.trim();
    if(!text) return;

    add(text,"user");
    input.value = "";

    const reply = brain(text);
    const msg = add("جاري التفكير...","ai");

    setTimeout(()=>{
        msg.innerText = reply;
        updateChart(reply.length);
    },500);
}

function add(t,type){
    const box = document.getElementById("chat");

    const div = document.createElement("div");

    div.className = type==="user"
    ? "bg-slate-900 text-white p-2 rounded-xl mr-auto w-fit max-w-[80%]"
    : "bg-white p-2 rounded-xl w-fit max-w-[80%]";

    div.innerText = t;
    box.appendChild(div);

    box.scrollTop = box.scrollHeight;

    return div;
}

////////////////////////////////////////////////////
// 📊 Chart
////////////////////////////////////////////////////
let chart;
let i = 0;

window.onload = function(){

    chart = new Chart(document.getElementById("chart"), {
        type: "line",
        data: {
            labels: ["0"],
            datasets: [{
                label: "تفاعل المستخدم",
                data: [0],
                borderWidth: 2
            }]
        }
    });
};

function updateChart(v){
    i++;
    chart.data.labels.push(i);
    chart.data.datasets[0].data.push(v);
    chart.update();
}

</script>

</body>
</html>
