<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shark AI | الإصدار المستقر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- استدعاء المكتبة بطريقة الـ CDN التقليدية لتجنب خطأ Import -->
    <script src="https://unpkg.com/@google/generative-ai@0.1.0/dist/index.umd.js"></script>
</head>
<body class="bg-slate-100 p-4">

    <div class="max-w-md mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden mt-10 border border-slate-200">
        <div class="bg-slate-900 p-5 text-white flex justify-between items-center">
            <span class="font-bold">Shark AI 🦈</span>
            <span class="text-[10px] text-sky-400 font-bold">V5.0 FINAL</span>
        </div>
        
        <div id="chatBox" class="h-96 overflow-y-auto p-5 space-y-4 bg-slate-50 text-sm">
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 text-slate-700">
                أهلاً بك يا هندسة! تم حل مشكلة الـ Syntax والـ Import. أنا جاهز للرد الآن.
            </div>
        </div>

        <div class="p-4 bg-white border-t flex gap-2">
            <input type="text" id="userInput" 
                   onkeypress="if(event.key === 'Enter') window.askAI()"
                   class="flex-1 bg-slate-100 rounded-xl px-4 py-2 outline-none focus:ring-2 focus:ring-sky-500" 
                   placeholder="اكتب سؤالك...">
            <button onclick="window.askAI()" id="sendBtn" class="bg-sky-600 text-white px-4 py-2 rounded-xl active:scale-95 transition-all">
                إرسال
            </button>
        </div>
    </div>

    <script>
        // دالة تعريفية لتشغيل Gemini بدون نظام الـ Module المعقد
        async function runAI() {
            const API_KEY = "AIzaSyAUamuXa-gndq8CZw5DAXdqcxUuOwAsZz0";
            const input = document.getElementById('userInput');
            const btn = document.getElementById('sendBtn');
            const text = input.value.trim();

            if (!text) return;

            addMsg(text, 'user');
            input.value = '';
            const loading = addMsg('جاري التفكير...', 'ai');
            btn.disabled = true;

            try {
                // استخدام المكتبة من خلال الـ Global Object (UMD)
                const genAI = new window.googleGenerativeAI.GoogleGenerativeAI(API_KEY);
                const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
                
                const result = await model.generateContent(text);
                const response = await result.response;
                loading.innerText = response.text();
            } catch (error) {
                console.error(error);
                loading.innerText = "❌ حدث خطأ في الاتصال. تأكد من إعدادات الـ API.";
            } finally {
                btn.disabled = false;
            }
        }

        // ربط الدالة بـ window لتكون مرئية للزر في HTML
        window.askAI = runAI;

        function addMsg(t, s) {
            const box = document.getElementById('chatBox');
            const d = document.createElement('div');
            d.className = s === 'ai' 
                ? 'bg-white p-3 rounded-2xl shadow-sm border border-slate-100 w-fit max-w-[85%]' 
                : 'bg-slate-900 p-3 rounded-2xl text-white mr-auto w-fit max-w-[85%]';
            d.innerText = t;
            box.appendChild(d);
            box.scrollTop = box.scrollHeight;
            return d;
        }

        // مسح الـ Service Worker الذي يسبب أخطاء التحميل
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(registrations => {
                for(let registration of registrations) { registration.unregister(); }
            });
        }
    </script>
</body>
</html>
