<div class="flex flex-col h-[75vh]">
    <!-- رأس المستشار -->
    <div class="bg-sky-50 p-4 rounded-2xl mb-4 border border-sky-100 flex items-center gap-3">
        <div class="w-10 h-10 bg-sky-500 rounded-full flex items-center justify-center text-white">
            <i class="fa-solid fa-robot"></i>
        </div>
        <div>
            <h4 class="font-black text-sm text-sky-900">المستشار المالي (Shark AI)</h4>
            <p class="text-[10px] text-sky-600">اسألني عن أي استثمار أو خطة مالية</p>
        </div>
    </div>

    <!-- مربع الدردشة -->
    <div id="chatBox" class="flex-1 overflow-y-auto space-y-4 px-2 pb-4">
        <div class="bg-white p-4 rounded-2xl rounded-tr-none shadow-sm text-sm text-slate-700 max-w-[80%] ml-auto">
            مرحباً أيها القرش! كيف يمكنني مساعدتك في تنمية ثروتك اليوم؟
        </div>
    </div>

    <!-- حقل الإدخال -->
    <div class="p-4 bg-white rounded-2xl shadow-lg border flex gap-2">
        <input type="text" id="aiInput" placeholder="اسأل المستشار..." class="flex-1 outline-none text-sm bg-transparent">
        <button onclick="askAI()" class="bg-sky-500 text-white w-10 h-10 rounded-xl flex items-center justify-center">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </div>
</div>

<script>
    // ========== الإعدادات ==========
    const GEMINI_API_KEY = 'AIzaSyAUamuXa-gndq8CZw5DAXdqcxUuOwAsZz0'; // مفتاح احتياطي (قد لا يعمل)

    // ========== قاعدة معرفية مالية محلية (Offline) ==========
    const financialKnowledge = [
        { keywords: ['استثمار', 'استثمر', 'فلوس', 'مبلغ', 'الف', 'دولار', 'جنيه'], reply: '🦈 أفضل استثمار هو توزيع أموالك: 40% في صناديق مؤشرات (ETF)، 30% في أسهم قيادية، 20% في ذهب أو عقار، و10% نقد للطوارئ. ابدأ بمبلغ بسيط وتعلم.' },
        { keywords: ['ادخار', 'أوفر', 'مستقبل', 'تقاعد'], reply: '💰 قاعدة 50/30/20: 50% للضروريات، 30% للكماليات، 20% للادخار. حاول أن تصل إلى ادخار 6 أشهر من المصروفات كصندوق طوارئ.' },
        { keywords: ['عملات', 'رقمية', 'بيتكوين', 'كربتو', 'تداول'], reply: '⚠️ العملات الرقمية عالية المخاطر. لا تستثمر أكثر مما تستطيع خسارته. يُفضل ألا تتجاوز 5% من محفظتك في الأصول عالية المخاطر.' },
        { keywords: ['ديون', 'قرض', 'دين', 'فوائد'], reply: '📉 سدد الديون ذات الفائدة العالية أولاً (مثل بطاقات الائتمان). فكر في تجميع الديون أو التفاوض مع البنك لتخفيض الفائدة.' },
        { keywords: ['مشروع', 'فكرة', 'بيزنس', 'تجارة', 'شركة'], reply: '🚀 قبل البدء: ادرس السوق، اكتب خطة عمل، ابدأ صغيراً، استمع لآراء العملاء، ولا تخف من الفشل. أنصحك بمشاهدة دروس ريادة الأعمال المجانية.' },
        { keywords: ['ضرائب', 'زكاة', 'ضريبة'], reply: '🧾 الزكاة واجبة على المال إذا بلغ النصاب وحال عليه الحول (2.5%). الضرائب تختلف حسب بلدك؛ استشر محاسباً مختصاً.' },
        { keywords: ['مخاطرة', 'خسارة', 'أمان'], reply: '🛡 نوّع استثماراتك ولا تضع البيض كله في سلة واحدة. الاستثمارات الآمنة: الودائع البنكية، أذون الخزانة، صناديق أسواق النقد.' },
        { keywords: ['راتب', 'دخل', 'مرتب', 'وظيفة'], reply: '💼 حاول تطوير مهاراتك لزيادة دخلك. استثمر في تعليمك، وتعلم مهارات جديدة مطلوبة في السوق. الدخل الإضافي يساعد في بناء الثروة.' },
        { keywords: ['عقار', 'أرض', 'شقة', 'عمارة'], reply: '🏠 العقار استثمار طويل الأجل. ادرس الموقع والسوق قبل الشراء. يمكنك البدء بصناديق REIT إذا كان رأس المال محدوداً.' },
        { keywords: ['ذهب', 'فضة', 'معادن'], reply: '🥇 الذهب ملاذ آمن وقت الأزمات. خصص 10-15% من محفظتك للذهب. يُفضل الشراء الفعلي أو عبر صناديق متداولة.' }
    ];

    function getLocalReply(question) {
        const q = question.toLowerCase();
        let bestMatch = null;
        let maxHits = 0;

        for (let entry of financialKnowledge) {
            let hits = 0;
            for (let kw of entry.keywords) {
                if (q.includes(kw)) hits++;
            }
            if (hits > maxHits) {
                maxHits = hits;
                bestMatch = entry.reply;
            }
        }

        if (maxHits > 0) return bestMatch;

        // رد عام إذا لم يتطابق شيء
        const defaultReplies = [
            '📊 نصيحتي: ابدأ بتحديد أهدافك المالية بوضوح. كم تريد أن تجمع؟ ومتى تحتاج المبلغ؟ هذا سيساعدني في إعطائك خطة أدق.',
            '💡 تذكر دائماً: الاستثمار ليس سباقاً سريعاً، بل ماراثون طويل. الصبر والانتظام هما مفتاح الثراء.',
            '📚 أنصحك بقراءة كتب التوعية المالية مثل "الأب الغني والأب الفقير" و"المستثمر الذكي". المعرفة هي أفضل استثمار.',
            '🦈 في عالم القروش، المفترس الحقيقي هو من يخطط جيداً. ضع خطة والتزم بها.'
        ];
        return defaultReplies[Math.floor(Math.random() * defaultReplies.length)];
    }

    // ========== دوال المحادثة ==========
    async function askAI() {
        const input = document.getElementById('aiInput');
        const question = input?.value.trim();
        if (!question) return;

        addMessage(question, 'user');
        input.value = '';
        const typingDiv = addMessage('...', 'ai');

        // محاولة استخدام Gemini أولاً
        let reply = null;
        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `أنت مستشار مالي ذكي اسمه Shark AI. أجب بالعربية فقط بإجابات واضحة ومفيدة. سؤال المستخدم: ${question}` }] }]
                })
            });

            if (response.ok) {
                const data = await response.json();
                if (!data.error) {
                    reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
                }
            }
        } catch (e) { /* ستفعل الاحتياطي تلقائياً */ }

        // إذا لم يحصل رد من Gemini، استخدم القاعدة المحلية
        if (!reply) {
            reply = getLocalReply(question);
        }

        updateMessage(typingDiv, reply);
    }

    function addMessage(text, sender) {
        const box = document.getElementById('chatBox');
        if (!box) return null;
        const div = document.createElement('div');
        const isAI = sender === 'ai';
        div.className = isAI
            ? 'bg-white p-4 rounded-2xl rounded-tr-none shadow-sm text-sm text-slate-700 max-w-[80%]'
            : 'bg-sky-500 text-white p-4 rounded-2xl rounded-tl-none shadow-sm text-sm max-w-[80%] ml-auto';
        div.textContent = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        return div;
    }

    function updateMessage(element, newText) {
        if (element) {
            element.textContent = newText;
            const box = document.getElementById('chatBox');
            if (box) box.scrollTop = box.scrollHeight;
        }
    }
</script>
