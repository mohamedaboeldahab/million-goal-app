<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shark AI | المستشار الذكي</title>
    <!-- Tailwind CSS للتنسيق -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- استدعاء مكتبة الذكاء الاصطناعي من جوجل -->
    <script type="importmap">
      {
        "imports": {
          "@google/generative-ai": "https://esm.run/@google/generative-ai"
        }
      }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f1f5f9; }
        .chat-container { height: calc(100vh - 180px); }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="p-2 sm:p-6">

    <div class="max-w-2xl mx-auto bg-white shadow-2xl rounded-[2rem] overflow-hidden flex flex-col border border-slate-200">
        <!-- Header -->
        <div class="bg-slate-900 p-5 text-white flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-sky-500 rounded-xl flex items-center justify-center shadow-lg shadow-sky-500/30">
                    <span class="text-xl">🦈</span>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Shark AI</h1>
                    <p class="text-[10px] text-sky-400 font-bold uppercase tracking-wider">Professional Assistant</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                <span class="text-[10px] font-bold text-slate-400">V4.0 STABLE</span>
            </div>
        </div>

        <!-- Chat Area -->
        <div id="chatBox" class="chat-container overflow-y-auto p-6 space-y-4 bg-slate-50/50 text-sm">
            <div class="flex justify-start">
                <div class="bg-white p-4 rounded-2xl rounded-tr-none shadow-sm border border-slate-100 text-slate-700 max-w-[85%] leading-relaxed">
                    أهلاً بك يا باشمهندس! أنا **Shark AI**. النظام الآن يعمل بكامل طاقته ومستقر تماماً. كيف يمكنني مساعدتك اليوم؟
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-white border-t border-slate-100 flex gap-2">
            <input type="text" id="userInput" 
                   onkeypress="if(event.key === 'Enter') window.askAI()"
                   class="flex-1 bg-slate-100 border-none rounded-2xl px-5 py-3 outline-none focus:ring-2 focus:ring-sky-500 transition-all text-slate-800" 
                   placeholder="اكتب سؤالك هنا...">
            
            <button onclick="window.askAI()" id="sendBtn" 
                    class="bg-slate-900 hover:bg-sky-600 text-white w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg transition-all active:scale-90">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                </svg>
            </button>
        </div>
    </div>

    <!-- البرمجة -->
    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";

        // ضع مفتاح Gemini API الخاص بك هنا
        const API_KEY = "AIzaSyAUamuXa-gndq8CZw5DAXdqcxUuOwAsZz0"; 
        const genAI = new GoogleGenerativeAI(API_KEY);

        // ربط الدالة بـ window لتعمل مع onclick في HTML
        window.askAI = async function() {
            const input = document.getElementById('userInput');
            const btn = document.getElementById('sendBtn');
            const text = input.value.trim();

            if (!text) return;
            if (API_KEY === "ضع_مفتاحك_هنا") {
                alert("يرجى وضع مفتاح API Key أولاً");
                return;
            }

            // إضافة رسالة المستخدم
            addMessage(text, 'user');
            input.value = '';
            
            // إضافة رسالة الانتظار
            const loadingDiv = addMessage('جاري التفكير...', 'ai');
            btn.disabled = true;

            try {
                // استدعاء النموذج
                const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
                const result = await model.generateContent(text);
                const response = await result.response;
                const replyText = response.text();
                
                // تحديث رسالة الانتظار بالرد الحقيقي
                updateMessage(loadingDiv, replyText);
            } catch (error) {
                console.error("Error:", error);
                updateMessage(loadingDiv, "❌ حدث خطأ في الاتصال. تأكد من صحة المفتاح أو رصيد الـ API.");
            } finally {
                btn.disabled = false;
            }
        }

        function addMessage(text, sender) {
            const box = document.getElementById('chatBox');
            const wrapper = document.createElement('div');
            wrapper.className = sender === 'ai' ? 'flex justify-start' : 'flex justify-end';

            const div = document.createElement('div');
            div.className = sender === 'ai' 
                ? 'bg-white p-4 rounded-2xl rounded-tr-none shadow-sm border border-slate-100 text-slate-700 max-w-[85%] leading-relaxed' 
                : 'bg-slate-900 p-4 rounded-2xl rounded-tl-none text-white max-w-[85%] shadow-md leading-relaxed';
            
            div.innerText = text;
            wrapper.appendChild(div);
            box.appendChild(wrapper);
            
            // سكرول تلقائي لأسفل
            box.scrollTop = box.scrollHeight;
            return div;
        }

        function updateMessage(element, text) {
            // تحويل السطور الجديدة لبريكس
            element.innerText = text;
            document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
        }

        // تنظيف أي Service Worker قديم قد يعطل الطلبات
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
        }
    </script>

</body>
</html>
