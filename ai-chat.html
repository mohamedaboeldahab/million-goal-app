<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shark AI 🦈</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 p-4">

<div class="max-w-md mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden mt-10">
    
    <div class="bg-slate-900 p-5 text-white flex justify-between">
        <span>Shark AI 🦈</span>
        <span class="text-xs text-sky-400">Secure</span>
    </div>

    <div id="chatBox" class="h-96 overflow-y-auto p-5 space-y-3 bg-slate-50 text-sm">
        <div class="bg-white p-3 rounded-xl">أهلاً بيك 👋</div>
    </div>

    <div class="p-4 flex gap-2">
        <input id="msg" type="text"
        class="flex-1 bg-slate-100 px-3 py-2 rounded-xl"
        placeholder="اكتب هنا..."
        onkeypress="if(event.key==='Enter')send()">

        <button onclick="send()" class="bg-sky-600 text-white px-4 rounded-xl">
            إرسال
        </button>
    </div>

</div>

<script>

async function send(){
    const input = document.getElementById('msg');
    const text = input.value.trim();
    if(!text) return;

    add(text,'user');
    input.value = '';

    const loading = add('جاري التفكير...','ai');

    try{
        const res = await fetch('api.php',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({msg:text})
        });

        const data = await res.json();
        loading.innerText = data.reply;

    }catch(e){
        loading.innerText = "❌ حصل خطأ";
    }
}

function add(t,type){
    const box = document.getElementById('chatBox');
    const div = document.createElement('div');

    div.className = type === 'user'
        ? 'bg-slate-900 text-white p-3 rounded-xl mr-auto w-fit max-w-[80%]'
        : 'bg-white p-3 rounded-xl w-fit max-w-[80%]';

    div.innerText = t;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    return div;
}

</script>

</body>
</html>
