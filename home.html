<!-- صندوق الكتابة يفضل زي ما هو مع صورة المستخدم -->
<div class="bg-white rounded-2xl p-6 shadow-lg mb-8 border border-gray-100 hover:shadow-xl transition-shadow">
    <div class="flex items-start gap-4">
        <img id="creatorAvatar" src="" class="w-12 h-12 rounded-full border-2 border-sky-200 object-cover flex-shrink-0">
        <div class="flex-1">
            <textarea 
                id="postInput" 
                placeholder="شاركنا بفكرة مشروعك..." 
                maxlength="300"
                class="w-full bg-gray-50 p-4 outline-none border border-gray-200 rounded-xl text-sm font-normal resize-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition-all placeholder:text-gray-400"
                rows="3"
            ></textarea>
            <div class="flex items-center justify-between mt-3 gap-3">
                <span id="charCount" class="text-xs text-gray-400 font-medium">0 / 300</span>
                <button 
                    onclick="engine.addPost()" 
                    class="flex items-center gap-2 bg-gradient-to-r from-sky-500 to-blue-600 text-white font-bold py-3 px-6 rounded-xl shadow-md hover:shadow-lg hover:from-sky-600 hover:to-blue-700 active:scale-95 transition-all duration-200"
                >
                    <i class="fa-solid fa-paper-plane"></i> نشر
                </button>
            </div>
        </div>
    </div>
</div>

<div id="feedList"></div>

<script>
    // هذا السكريبت صغير عشان يظبط صورة المستخدم ويساعد في العداد
    (function() {
        function updateAvatar() {
            const img = document.getElementById('creatorAvatar');
            if (!img || !window.auth?.currentUser) return;
            const user = auth.currentUser;
            window.engine.getOrCreateUserProfile().then(profile => {
                img.src = profile.photoURL || user.photoURL || '';
            });
        }
        window.addEventListener('load', updateAvatar);
        if (document.readyState === 'complete') updateAvatar();
    })();
</script>
