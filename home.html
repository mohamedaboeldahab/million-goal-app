<div class="bg-white rounded-[2.5rem] p-6 shadow-xl mb-8 border-2 border-sky-100">
    <textarea id="postInput" placeholder="اشرح فكرة مشروعك هنا للتقييم..." class="w-full bg-transparent p-2 outline-none border-none text-sm font-bold resize-none" rows="3"></textarea>
    <button onclick="engine.addPost()" class="w-full bg-slate-900 text-white font-black py-4 rounded-2xl mt-3 shadow-lg active:scale-95 transition-all">
        إرسال للمجتمع
    </button>
</div>
<div id="feedList"></div>

<script>
    // تعديل دالة addPost في app.js لتشمل القيم الافتراضية
    engine.addPost = async function() {
        const input = document.getElementById('postInput');
        if(!input.value.trim()) return;
        await addDoc(collection(db, "posts"), {
            content: input.value,
            authorName: auth.currentUser.displayName,
            authorPhoto: auth.currentUser.photoURL,
            supportCount: 0,
            opposeCount: 0,
            voters: [], // قائمة المستخدمين الذين صوتوا
            createdAt: serverTimestamp()
        });
        input.value = '';
    };
</script>
