<div class="bg-white rounded-2xl p-6 shadow-lg mb-8 border border-gray-100 transition-shadow hover:shadow-xl">
    <!-- حقل الكتابة -->
    <textarea 
        id="postInput" 
        placeholder="اشرح فكرة مشروعك هنا للتقييم..." 
        maxlength="300"
        oninput="updateCharCount()"
        class="w-full bg-gray-50 p-4 outline-none border border-gray-200 rounded-xl text-base font-normal resize-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition-all placeholder:text-gray-400 placeholder:font-normal"
        rows="3"
    ></textarea>
    
    <!-- صف العداد والزر -->
    <div class="flex items-center justify-between mt-3 gap-3">
        <span id="charCount" class="text-xs text-gray-400 font-medium"></span>
        <button 
            onclick="engine.addPost()" 
            class="flex-1 bg-gradient-to-r from-sky-500 to-blue-600 text-white font-bold py-4 px-6 rounded-xl shadow-md hover:shadow-lg hover:from-sky-600 hover:to-blue-700 active:scale-95 transition-all duration-200"
        >
            🚀 إرسال للمجتمع
        </button>
    </div>
</div>

<!-- سكريبت العداد (ضعه قبل إغلاق body) -->
<script>
    function updateCharCount() {
        const input = document.getElementById('postInput');
        const count = document.getElementById('charCount');
        const max = input.getAttribute('maxlength') || 300;
        const remaining = max - input.value.length;
        count.textContent = `${input.value.length}/${max} حرف`;
        // تغيير اللون عند الاقتراب من الحد الأقصى
        count.className = remaining <= 30 
            ? 'text-xs text-red-500 font-bold' 
            : 'text-xs text-gray-400 font-medium';
    }
    // للتشغيل الأول
    updateCharCount();
</script>
