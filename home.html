<div id="storiesRow" class="flex gap-3 overflow-x-auto pb-3 mb-4"></div>

<div class="bg-white rounded-2xl p-4 shadow-md mb-4 border border-gray-100">
    <div class="flex gap-2 mb-3">
        <button id="typePostBtn" onclick="engine.setPostType('post')" class="flex-1 py-2 rounded-lg font-bold text-sm bg-sky-500 text-white shadow"><i class="fa-solid fa-comment"></i> تفاعل</button>
        <button id="typeBiteBtn" onclick="engine.setPostType('bite')" class="flex-1 py-2 rounded-lg font-bold text-sm bg-gray-200 text-gray-600 shadow">🦈 عضّة</button>
    </div>
    <div class="flex items-start gap-3">
        <img id="creatorAvatar" src="" class="w-10 h-10 rounded-full border border-sky-200 object-cover">
        <div class="flex-1">
            <textarea id="postInput" placeholder="ما الذي تفكر فيه؟" maxlength="600" class="w-full bg-gray-50 p-3 outline-none border border-gray-200 rounded-xl text-sm resize-none focus:ring-2 focus:ring-sky-500 transition" rows="3"></textarea>
            <div class="flex items-center justify-between mt-3 gap-3">
                <span id="charCount" class="text-xs text-gray-400 font-medium">0 / 600</span>
                <button onclick="engine.addPost()" class="flex items-center gap-2 bg-gradient-to-r from-sky-500 to-blue-600 text-white font-bold py-2.5 px-5 rounded-lg shadow-md active:scale-95 transition text-sm"><i class="fa-solid fa-paper-plane"></i> نشر</button>
            </div>
        </div>
    </div>
</div>

<div id="feedList"></div>

<script>
    (async function() {
        if (window.engine) {
            await engine.updateCreatorAvatar();
            engine.activateCharCounter();
            engine.updateTypeButtons();
            engine.listenToPosts();
        }
    })();
</script>
