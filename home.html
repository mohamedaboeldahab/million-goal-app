<!-- محتوى الصفحة الرئيسية، يحتوي على حقل الإدخال وقائمة المنشورات -->
<div class="bg-white rounded-2xl p-6 shadow-lg mb-8 border border-gray-100 hover:shadow-xl transition-shadow">
    <div class="flex items-start gap-4">
        <img id="creatorAvatar" src="" class="w-12 h-12 rounded-full border-2 border-sky-200 object-cover flex-shrink-0">
        <div class="flex-1">
            <textarea 
                id="postInput" 
                placeholder="شاركنا بفكرة مشروعك..." 
                maxlength="300"
                class="w-full bg-gray-50 p-4 outline-none border border-gray-200 rounded-xl text-sm font-normal resize-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition-all placeholder:text-gray-400"
                rows="3"
            ></textarea>
            <div class="flex items-center justify-between mt-3 gap-3">
                <span id="charCount" class="text-xs text-gray-400 font-medium">0 / 300</span>
                <button 
                    onclick="engine.addPost()" 
                    class="flex items-center gap-2 bg-gradient-to-r from-sky-500 to-blue-600 text-white font-bold py-3 px-6 rounded-xl shadow-md hover:shadow-lg hover:from-sky-600 hover:to-blue-700 active:scale-95 transition-all duration-200"
                >
                    <i class="fa-solid fa-paper-plane"></i> نشر
                </button>
            </div>
        </div>
    </div>
</div>

<div id="feedList"></div>

<script>
    // بمجرد تحميل الصفحة، نعيد تعريف طريقة عرض المنشورات لتشمل التحسينات الجديدة
    function upgradeFeed() {
        if (!window.engine || !window.auth) {
            setTimeout(upgradeFeed, 200);
            return;
        }

        // تحديث صورة المنشئ في أعلى الصفحة
        const updateCreatorAvatar = async () => {
            const img = document.getElementById('creatorAvatar');
            if (!img) return;
            const user = auth.currentUser;
            if (user) {
                const profile = await engine.getOrCreateUserProfile();
                img.src = profile.photoURL || user.photoURL || '';
            }
        };
        updateCreatorAvatar();

        // حفظ الدالة الأصلية
        const originalListen = engine.listenToPosts.bind(engine);

        // إعادة تعريف دالة الاستماع للمنشورات
        engine.listenToPosts = function() {
            const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                const feed = document.getElementById('feedList');
                if (!feed) return;

                feed.innerHTML = snapshot.docs.map(doc => {
                    const p = doc.data();
                    const postId = doc.id;
                    const commentsCount = p.commentsCount || 0;

                    return `
                    <div class="bg-white rounded-[2rem] p-5 mb-6 shadow-md border border-gray-100 hover:shadow-lg transition-shadow">
                        <!-- رأس المنشور -->
                        <div class="flex items-center gap-3 mb-4">
                            <img src="${p.authorPhoto}" class="w-12 h-12 rounded-full border-2 border-sky-200 object-cover">
                            <div>
                                <span class="font-extrabold text-gray-800 text-base block">${p.authorName}</span>
                                <span class="text-xs text-gray-400">${new Date(p.createdAt?.toDate()).toLocaleString('ar-EG')}</span>
                            </div>
                        </div>

                        <!-- محتوى المنشور -->
                        <p class="text-gray-700 text-sm leading-relaxed mb-6 whitespace-pre-wrap">${p.content}</p>

                        <!-- أزرار التصويت -->
                        <div class="flex gap-3 mb-5">
                            <button onclick="engine.handleVote('${postId}', 'support')" 
                                class="flex-1 bg-gradient-to-r from-emerald-400 to-emerald-500 text-white font-bold py-3 rounded-xl shadow-md hover:shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2 text-sm">
                                🦈 أؤيد <span class="bg-white/20 px-2 py-0.5 rounded-full text-xs">${p.supportCount || 0}</span>
                            </button>
                            <button onclick="engine.handleVote('${postId}', 'oppose')" 
                                class="flex-1 bg-gradient-to-r from-rose-400 to-rose-500 text-white font-bold py-3 rounded-xl shadow-md hover:shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2 text-sm">
                                🦈 لا أؤيد <span class="bg-white/20 px-2 py-0.5 rounded-full text-xs">${p.opposeCount || 0}</span>
                            </button>
                        </div>

                        <!-- قسم التعليقات -->
                        <div class="border-t border-gray-100 pt-4">
                            <div id="comments_section_${postId}">
                                <div id="comments_list_${postId}" class="space-y-3 mb-3">
                                    <!-- سيتم ملؤها بواسطة مستمع التعليقات -->
                                </div>
                                <button id="load_more_btn_${postId}" 
                                    style="display: none;" 
                                    onclick="engine.loadMoreComments('${postId}')" 
                                    class="text-sky-600 text-xs font-bold hover:underline w-full text-center py-2">
                                    عرض المزيد من التعليقات
                                </button>
                            </div>
                            <!-- صندوق إضافة تعليق -->
                            <div class="flex gap-2 mt-2">
                                <input type="text" id="comm_${postId}" placeholder="أضف تعليقاً..." 
                                    class="flex-1 bg-gray-50 rounded-xl px-4 py-3 text-xs border border-gray-200 outline-none focus:ring-2 focus:ring-sky-400 transition">
                                <button onclick="engine.addComment('${postId}')" 
                                    class="bg-sky-500 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-sky-600 active:scale-95 transition">
                                    <i class="fa-solid fa-paper-plane"></i>
                                </button>
                            </div>
                        </div>
                    </div>`;
                }).join('');

                // بدء الاستماع للتعليقات لكل منشور
                snapshot.docs.forEach(d => engine.listenToComments(d.id));
            });
        };

        // استدعاء المستمع الجديد
        if (typeof engine.listenToPosts === 'function') {
            engine.listenToPosts();
        }
    }

    // تشغيل التحسين بعد تحميل الصفحة
    if (document.readyState === 'complete') {
        upgradeFeed();
    } else {
        window.addEventListener('load', upgradeFeed);
    }
</script>
