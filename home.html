<!-- شريط الستوريز (العضّات) -->
<div id="storiesRow" class="flex gap-3 overflow-x-auto pb-3 mb-4"></div>

<div class="bg-white rounded-2xl p-4 shadow-md mb-4 border border-gray-100">
    <!-- أزرار اختيار النوع -->
    <div class="flex gap-2 mb-3">
        <button id="typePostBtn" onclick="engine.setPostType('post')" 
            class="flex-1 py-2 rounded-lg font-bold text-sm bg-sky-500 text-white shadow">
            <i class="fa-solid fa-comment"></i> تفاعل
        </button>
        <button id="typeBiteBtn" onclick="engine.setPostType('bite')" 
            class="flex-1 py-2 rounded-lg font-bold text-sm bg-gray-200 text-gray-600 shadow">
            🦈 عضّة
        </button>
    </div>
    <!-- حقل الكتابة -->
    <div class="flex items-start gap-3">
        <img id="creatorAvatar" src="" class="w-10 h-10 rounded-full border border-sky-200 object-cover">
        <div class="flex-1">
            <textarea id="postInput" placeholder="ما الذي تفكر فيه؟" maxlength="600"
                class="w-full bg-gray-50 p-3 outline-none border border-gray-200 rounded-xl text-sm resize-none focus:ring-2 focus:ring-sky-500 transition"
                rows="3"></textarea>
            <div class="flex items-center justify-between mt-3 gap-3">
                <span id="charCount" class="text-xs text-gray-400 font-medium">0 / 600</span>
                <button onclick="engine.addPost()" 
                    class="flex items-center gap-2 bg-gradient-to-r from-sky-500 to-blue-600 text-white font-bold py-2.5 px-5 rounded-lg shadow-md hover:shadow-lg active:scale-95 transition text-sm">
                    <i class="fa-solid fa-paper-plane"></i> نشر
                </button>
            </div>
        </div>
    </div>
</div>

<!-- قائمة المنشورات -->
<div id="feedList"></div>

<!-- مشغل القصص الثابت (يتم إظهاره/إخفاؤه) -->
<div id="storyPlayer" class="fixed inset-0 z-50 flex flex-col items-center justify-center hidden" style="background: linear-gradient(135deg, #0f172a, #1e3a5f);">
    <button id="closeStoryBtn" class="absolute top-4 right-4 text-white text-3xl z-10">&times;</button>
    <div id="storyContent" class="flex-1 flex flex-col items-center justify-center text-white p-6"></div>
    <div class="flex justify-between w-full mt-4 px-6">
        <button id="prevStoryBtn" class="text-white text-2xl bg-white/20 rounded-full w-10 h-10 flex items-center justify-center">&larr;</button>
        <button id="nextStoryBtn" class="text-white text-2xl bg-white/20 rounded-full w-10 h-10 flex items-center justify-center">&rarr;</button>
    </div>
</div>

<script>
    // تحديث صورة الأفاتار
    (async function() {
        if (window.auth && window.engine) {
            const img = document.getElementById('creatorAvatar');
            if (img) {
                const profile = await window.engine.getOrCreateUserProfile();
                img.src = profile.photoURL || window.auth.currentUser?.photoURL || '';
            }
        }
    })();

    // تفويض الأحداث للقصص (يدعم اللمس والنقر)
    (function() {
        const storiesRow = document.getElementById('storiesRow');
        if (!storiesRow) return;

        function handleStoryTap(e) {
            const storyDiv = e.target.closest('[data-story-index]');
            if (storyDiv) {
                e.preventDefault();
                const index = parseInt(storyDiv.getAttribute('data-story-index'));
                if (!isNaN(index) && window.engine) {
                    window.engine.openStoryPlayer(index);
                }
            }
        }

        storiesRow.addEventListener('touchstart', handleStoryTap, { passive: false });
        storiesRow.addEventListener('click', handleStoryTap);
    })();

    // ربط أزرار المشغل الثابت
    (function() {
        const player = document.getElementById('storyPlayer');
        document.getElementById('closeStoryBtn').addEventListener('click', () => {
            player.classList.add('hidden');
        });
        document.getElementById('prevStoryBtn').addEventListener('click', () => {
            if (window.engine) window.engine.prevStory();
        });
        document.getElementById('nextStoryBtn').addEventListener('click', () => {
            if (window.engine) window.engine.nextStory();
        });
    })();
</script>
