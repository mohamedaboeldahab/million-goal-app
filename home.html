<div class="bg-white rounded-2xl p-5 shadow-md mb-6 border border-gray-100">
    <div class="flex items-start gap-3">
        <img id="creatorAvatar" src="" class="w-11 h-11 rounded-full border-2 border-sky-200 object-cover flex-shrink-0">
        <div class="flex-1">
            <textarea id="postInput" placeholder="شاركنا بفكرة مشروعك..." maxlength="300"
                class="w-full bg-gray-50 p-3 outline-none border border-gray-200 rounded-xl text-sm resize-none focus:ring-2 focus:ring-sky-500 transition"
                rows="3"></textarea>
            <div class="flex items-center justify-between mt-3 gap-3">
                <span id="charCount" class="text-xs text-gray-400 font-medium">0 / 300</span>
                <button onclick="engine.addPost()"
                    class="flex items-center gap-2 bg-gradient-to-r from-sky-500 to-blue-600 text-white font-bold py-2.5 px-5 rounded-lg shadow-md hover:shadow-lg active:scale-95 transition text-sm">
                    <i class="fa-solid fa-paper-plane"></i> نشر
                </button>
            </div>
        </div>
    </div>
</div>

<div id="feedList"></div>

<script>
    // تحديث صورة المستخدم فقط
    (function() {
        function updateAvatar() {
            const img = document.getElementById('creatorAvatar');
            if (!img || !window.auth?.currentUser) return;
            window.engine.getOrCreateUserProfile().then(profile => {
                img.src = profile.photoURL || auth.currentUser.photoURL || '';
            });
        }
        if (document.readyState === 'complete') updateAvatar();
        else window.addEventListener('load', updateAvatar);
    })();
</script>
