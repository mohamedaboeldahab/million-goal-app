<!-- شريط الستوريز (عضّات) -->
<div id="storiesRow" class="flex gap-3 overflow-x-auto pb-4 mb-5"></div>

<div class="bg-white rounded-2xl p-5 shadow-md mb-5 border border-gray-100">
    <div class="flex gap-2 mb-4">
        <button id="typePostBtn" onclick="engine.setPostType('post')" class="flex-1 py-3 rounded-xl font-bold text-base bg-sky-500 text-white shadow"><i class="fa-solid fa-comment"></i> تفاعل</button>
        <button id="typeBiteBtn" onclick="engine.setPostType('bite')" class="flex-1 py-3 rounded-xl font-bold text-base bg-gray-200 text-gray-600 shadow">🦈 عضّة</button>
    </div>
    <div class="flex items-start gap-4">
        <img id="creatorAvatar" src="" class="w-12 h-12 rounded-full border-2 border-sky-200 object-cover">
        <div class="flex-1">
            <textarea id="postInput" placeholder="ما الذي تفكر فيه؟" maxlength="600"
                class="w-full bg-gray-50 p-4 outline-none border border-gray-200 rounded-xl text-base resize-none focus:ring-2 focus:ring-sky-500 transition"
                rows="3"></textarea>

            <!-- صف اختيار خلفية البوست -->
            <div id="bgPickerContainer" class="flex gap-2 mt-3 flex-wrap"></div>

            <div class="flex items-center justify-between mt-4 gap-3">
                <span id="charCount" class="text-sm text-gray-400 font-medium">0 / 600</span>
                <button onclick="engine.addPost()"
                    class="flex items-center gap-2 bg-gradient-to-r from-sky-500 to-blue-600 text-white font-bold py-3 px-6 rounded-xl shadow-md active:scale-95 transition text-base">
                    <i class="fa-solid fa-paper-plane"></i> نشر
                </button>
            </div>
        </div>
    </div>
</div>

<div id="feedList"></div>

<script>
    (async function() { if (window.engine) { await engine.updateCreatorAvatar(); engine.activateCharCounter(); } })();
</script>
