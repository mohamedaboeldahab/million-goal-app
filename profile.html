<!-- غلاف القرش (معدل للجوال) -->
<div class="relative h-56 sm:h-64 bg-gradient-to-b from-[#0ea5e9] to-[#0284c7] overflow-hidden">
    <!-- موجات متحركة واضحة -->
    <div class="absolute bottom-0 left-0 w-full h-16">
        <svg class="wave-anim" viewBox="0 0 1440 120" preserveAspectRatio="none">
            <path fill="rgba(255,255,255,0.25)" d="M0,60 C240,120 480,0 720,60 C960,120 1200,0 1440,60 L1440,120 L0,120 Z"></path>
        </svg>
        <svg class="wave-anim2" viewBox="0 0 1440 120" preserveAspectRatio="none">
            <path fill="rgba(255,255,255,0.15)" d="M0,80 C240,40 480,120 720,80 C960,40 1200,120 1440,80 L1440,120 L0,120 Z"></path>
        </svg>
    </div>
    <!-- قرش + سمكات صغيرة -->
    <div class="absolute bottom-6 left-0 w-full flex justify-between px-4">
        <span class="text-4xl sm:text-5xl filter drop-shadow-lg" style="animation: swimShark 6s ease-in-out infinite alternate;">🦈</span>
        <span class="text-lg opacity-80" style="animation: swimFish 4s linear infinite alternate;">🐟🐟🐟</span>
    </div>
    <style>
        .wave-anim, .wave-anim2 {
            position: absolute; bottom: 0; left: 0; width: 200%; height: 60px;
            animation: waveMove 8s linear infinite;
        }
        .wave-anim2 { bottom: 10px; opacity: 0.6; animation-duration: 12s; animation-delay: -2s; }
        @keyframes waveMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        @keyframes swimShark {
            0% { transform: translateX(0); }
            100% { transform: translateX(30px); }
        }
        @keyframes swimFish {
            0% { transform: translateX(0); }
            100% { transform: translateX(-20px); }
        }
    </style>
</div>

<!-- معلومات البروفايل -->
<div class="bg-white rounded-b-2xl shadow-md -mt-12 sm:-mt-16 px-4 pb-6 pt-14 sm:pt-20 relative">
    <!-- صورة البروفايل قابلة للتغيير -->
    <div class="absolute -top-10 sm:-top-14 right-4 sm:right-6 w-20 h-20 sm:w-28 sm:h-28 rounded-full border-4 border-white shadow-lg overflow-hidden bg-white group">
        <img id="profileAvatar" class="w-full h-full object-cover" src="" alt="صورتي">
        <div id="avatarOverlay" class="absolute inset-0 bg-black/40 hidden group-hover:flex items-center justify-center text-white cursor-pointer text-sm">
            <i class="fa-solid fa-camera"></i>
        </div>
        <input type="file" id="avatarFileInput" accept="image/*" class="hidden">
    </div>

    <!-- الاسم والبريد (قابلان للتعديل والحفظ) -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <div>
            <h1 id="profileName" class="text-xl sm:text-2xl font-black text-gray-800" contenteditable="false">جار التحميل...</h1>
            <p id="profileEmail" class="text-sm text-gray-500"></p>
            <p id="profileBio" class="text-sm text-gray-600 mt-1" contenteditable="false">🦈 مؤسس في Shark Hub</p>
        </div>
        <div class="flex gap-2">
            <button id="editProfileBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-lg text-sm transition flex items-center gap-1">
                <i class="fa-solid fa-pen-to-square"></i> تعديل
            </button>
            <button id="saveProfileBtn" class="bg-sky-500 hover:bg-sky-600 text-white font-bold py-2 px-4 rounded-lg text-sm transition hidden flex items-center gap-1">
                <i class="fa-solid fa-check"></i> حفظ
            </button>
            <button onclick="engine.logout()" class="bg-white border border-red-200 text-red-500 hover:bg-red-50 font-bold py-2 px-4 rounded-lg text-sm transition flex items-center gap-1 shadow-sm">
                <i class="fa-solid fa-right-from-bracket"></i> خروج
            </button>
        </div>
    </div>

    <!-- تبويبات -->
    <div class="flex gap-1 mt-6 border-b pb-2 overflow-x-auto" id="profileTabs">
        <button class="tab-btn active font-bold text-sm px-4 py-2 rounded-lg bg-gray-100" data-tab="posts">📄 المنشورات</button>
        <button class="tab-btn font-bold text-sm px-4 py-2 rounded-lg text-gray-500 hover:bg-gray-100" data-tab="about">ℹ️ عني</button>
        <button class="tab-btn font-bold text-sm px-4 py-2 rounded-lg text-gray-500 hover:bg-gray-100" data-tab="friends">👥 الأصدقاء</button>
        <button class="tab-btn font-bold text-sm px-4 py-2 rounded-lg text-gray-500 hover:bg-gray-100" data-tab="photos">🖼️ صور</button>
    </div>

    <!-- محتوى التبويبات -->
    <div class="mt-4">
        <div id="tab-posts" class="tab-content">
            <div id="userPostsContainer" class="space-y-3">
                <div class="text-center py-10 text-gray-400">
                    <div class="w-8 h-8 border-4 border-sky-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                    <p class="mt-2 text-sm">جاري تحميل المنشورات...</p>
                </div>
            </div>
        </div>
        <div id="tab-about" class="tab-content hidden">
            <div class="bg-gray-50 rounded-xl p-4">
                <p class="font-bold mb-2">نبذة عني</p>
                <p id="aboutBio" class="text-sm text-gray-600"></p>
            </div>
        </div>
        <div id="tab-friends" class="tab-content hidden"><p class="text-gray-400 text-sm">لا يوجد أصدقاء بعد</p></div>
        <div id="tab-photos" class="tab-content hidden"><p class="text-gray-400 text-sm">لا توجد صور</p></div>
    </div>
</div>

<script>
    (() => {
        // === إدارة التبويبات ===
        const tabs = document.querySelectorAll('.tab-btn');
        const panes = document.querySelectorAll('.tab-content');
        tabs.forEach(btn => {
            btn.addEventListener('click', () => {
                tabs.forEach(b => { b.classList.remove('active','bg-gray-100'); b.classList.add('text-gray-500'); });
                btn.classList.add('active','bg-gray-100');
                btn.classList.remove('text-gray-500');
                const target = btn.dataset.tab;
                panes.forEach(p => p.classList.add('hidden'));
                document.getElementById(`tab-${target}`).classList.remove('hidden');
            });
        });

        // === جلب البيانات من localStorage (مخصص) أو من Google ===
        function getCustomData() {
            return {
                name: localStorage.getItem('sharkhub_name'),
                bio: localStorage.getItem('sharkhub_bio'),
                photo: localStorage.getItem('sharkhub_photo')
            };
        }

        function loadUserData() {
            const user = window.auth?.currentUser;
            if (!user) return false;
            const custom = getCustomData();
            
            // الصورة: custom > Google > افتراضية
            const avatar = document.getElementById('profileAvatar');
            const photoSrc = custom.photo || user.photoURL;
            avatar.src = photoSrc || '';
            
            // الاسم: custom > Google
            const nameEl = document.getElementById('profileName');
            nameEl.textContent = custom.name || user.displayName || 'مستخدم';
            
            // البريد
            document.getElementById('profileEmail').textContent = user.email || '';
            
            // البايو
            const bioEl = document.getElementById('profileBio');
            const aboutEl = document.getElementById('aboutBio');
            bioEl.textContent = custom.bio || '🦈 مؤسس في Shark Hub';
            aboutEl.textContent = bioEl.textContent;
            
            return true;
        }

        if (!loadUserData()) {
            let attempts = 0;
            const interval = setInterval(() => {
                if (loadUserData() || ++attempts > 10) clearInterval(interval);
            }, 300);
        }

        // === تشغيل مستمع المنشورات ===
        if (window.engine && typeof window.engine.listenToUserPosts === 'function') {
            window.engine.listenToUserPosts('userPostsContainer');
        } else {
            document.getElementById('userPostsContainer').innerHTML = '<p class="text-red-500 text-sm">خاصية المنشورات غير متاحة حالياً</p>';
        }

        // === تحميل صورة جديدة من الجهاز ===
        const avatarOverlay = document.getElementById('avatarOverlay');
        const avatarFileInput = document.getElementById('avatarFileInput');
        const avatarImg = document.getElementById('profileAvatar');

        avatarOverlay.addEventListener('click', () => {
            avatarFileInput.click();
        });

        avatarFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = () => {
                const dataUrl = reader.result;
                avatarImg.src = dataUrl;
                localStorage.setItem('sharkhub_photo', dataUrl);
                showToast('تم تحديث الصورة ✅');
            };
            reader.readAsDataURL(file);
        });

        // === تحرير الاسم والبايو ===
        const editBtn = document.getElementById('editProfileBtn');
        const saveBtn = document.getElementById('saveProfileBtn');
        const nameEl = document.getElementById('profileName');
        const bioEl = document.getElementById('profileBio');
        const aboutBioEl = document.getElementById('aboutBio');

        editBtn.addEventListener('click', () => {
            nameEl.contentEditable = 'true';
            bioEl.contentEditable = 'true';
            nameEl.classList.add('bg-yellow-50','px-2','rounded');
            bioEl.classList.add('bg-yellow-50','px-2','rounded');
            editBtn.classList.add('hidden');
            saveBtn.classList.remove('hidden');
        });

        saveBtn.addEventListener('click', () => {
            nameEl.contentEditable = 'false';
            bioEl.contentEditable = 'false';
            nameEl.classList.remove('bg-yellow-50','px-2','rounded');
            bioEl.classList.remove('bg-yellow-50','px-2','rounded');
            saveBtn.classList.add('hidden');
            editBtn.classList.remove('hidden');
            
            // حفظ في localStorage
            localStorage.setItem('sharkhub_name', nameEl.textContent.trim());
            localStorage.setItem('sharkhub_bio', bioEl.textContent.trim());
            aboutBioEl.textContent = bioEl.textContent;
            showToast('تم حفظ التغييرات ✅');
        });

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-4 left-4 bg-gray-800 text-white px-4 py-2 rounded-lg text-sm z-50 animate-pulse';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }
    })();
</script>
