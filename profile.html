<!-- غلاف محسّن بموجات وقروش -->
<div class="relative h-60 sm:h-80 bg-gradient-to-br from-cyan-400 via-sky-500 to-blue-600 overflow-hidden">
    <!-- فقاقيع ماء خلفية -->
    <div class="absolute inset-0 opacity-20">
        <div class="bubble bg-white w-4 h-4 rounded-full absolute top-10 left-10 animate-ping"></div>
        <div class="bubble bg-white w-6 h-6 rounded-full absolute top-20 right-20 animate-bounce"></div>
        <div class="bubble bg-white w-3 h-3 rounded-full absolute bottom-10 left-1/3 animate-pulse"></div>
    </div>
    <!-- أمواج -->
    <div class="absolute bottom-0 left-0 w-full">
        <svg viewBox="0 0 1440 120" preserveAspectRatio="none" class="fill-white/20 h-12 w-full">
            <path d="M0,60 C240,120 480,0 720,60 C960,120 1200,0 1440,60 L1440,120 L0,120 Z"/>
        </svg>
        <svg viewBox="0 0 1440 120" preserveAspectRatio="none" class="fill-white/10 h-10 w-full -mt-2">
            <path d="M0,80 C240,40 480,120 720,80 C960,40 1200,120 1440,80 L1440,120 L0,120 Z"/>
        </svg>
    </div>
    <!-- قرش + سمكات -->
    <div class="absolute bottom-6 left-4 sm:left-8 text-5xl sm:text-7xl drop-shadow-xl animate-shark">🦈</div>
    <div class="absolute bottom-4 right-4 sm:right-8 text-2xl opacity-70">🐟🐟🐟</div>
</div>

<style>
@keyframes shark {
    0%,100% { transform: translateX(0); }
    50% { transform: translateX(15px); }
}
.animate-shark { animation: shark 4s ease-in-out infinite; }
</style>

<!-- منطقة المعلومات -->
<div class="bg-white rounded-t-3xl shadow-lg -mt-8 sm:-mt-12 px-4 pb-6 pt-16 sm:pt-20 relative">
    <!-- صورة البروفايل كبيرة -->
    <div class="absolute -top-14 sm:-top-20 left-1/2 transform -translate-x-1/2 w-28 h-28 sm:w-36 sm:h-36 rounded-full border-4 border-white shadow-xl overflow-hidden bg-white group">
        <img id="profileAvatar" class="w-full h-full object-cover" src="" alt="صورتي">
        <!-- أيقونة الكاميرا للقص -->
        <div id="avatarOverlay" class="absolute inset-0 bg-black/30 hidden group-hover:flex items-center justify-center text-white cursor-pointer text-2xl">
            <i class="fa-solid fa-camera"></i>
        </div>
        <input type="file" id="avatarFileInput" accept="image/*" class="hidden">
    </div>

    <!-- الاسم + شارة التوثيق -->
    <div class="text-center flex flex-col items-center">
        <div class="flex items-center gap-2">
            <h1 id="profileName" class="text-2xl sm:text-3xl font-black text-gray-800" contenteditable="false">جار التحميل...</h1>
            <span class="bg-sky-500 text-white text-xs px-2 py-0.5 rounded-full flex items-center gap-1 font-bold">
                <i class="fa-solid fa-shield-check"></i> موثّق
            </span>
        </div>
        <p id="profileEmail" class="text-sm text-gray-500"></p>
        <p id="profileBio" class="text-sm text-gray-600 mt-1 max-w-md" contenteditable="false">🦈 مؤسس في Shark Hub</p>
    </div>

    <!-- أزرار التحكم -->
    <div class="flex justify-center gap-2 mt-4">
        <button id="editProfileBtn" class="bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-2 px-5 rounded-lg text-sm transition flex items-center gap-1">
            <i class="fa-solid fa-pen-to-square"></i> تعديل
        </button>
        <button id="saveProfileBtn" class="bg-sky-500 hover:bg-sky-600 text-white font-bold py-2 px-5 rounded-lg text-sm transition hidden flex items-center gap-1">
            <i class="fa-solid fa-check"></i> حفظ
        </button>
        <button onclick="engine.logout()" class="bg-white border border-red-200 text-red-500 hover:bg-red-50 font-bold py-2 px-5 rounded-lg text-sm transition flex items-center gap-1 shadow-sm">
            <i class="fa-solid fa-right-from-bracket"></i> خروج
        </button>
    </div>

    <!-- تبويبات -->
    <div class="flex gap-1 mt-6 border-b pb-2 overflow-x-auto justify-center">
        <button class="tab-btn active font-bold text-sm px-4 py-2 rounded-lg bg-gray-100" data-tab="posts">📄 المنشورات</button>
        <button class="tab-btn font-bold text-sm px-4 py-2 rounded-lg text-gray-500 hover:bg-gray-100" data-tab="about">ℹ️ عني</button>
        <button class="tab-btn font-bold text-sm px-4 py-2 rounded-lg text-gray-500 hover:bg-gray-100" data-tab="friends">👥 الأصدقاء</button>
    </div>

    <!-- محتوى التبويبات -->
    <div class="mt-4">
        <div id="tab-posts">
            <div id="userPostsContainer" class="space-y-4"></div>
        </div>
        <div id="tab-about" class="hidden">
            <div class="bg-gray-50 rounded-xl p-4">
                <p class="font-bold mb-2">نبذة عني</p>
                <p id="aboutBio" class="text-sm text-gray-600"></p>
            </div>
        </div>
        <div id="tab-friends" class="hidden"><p class="text-gray-400 text-sm">لا يوجد أصدقاء بعد</p></div>
    </div>
</div>

<!-- نافذة قص الصورة -->
<div id="cropperModal" class="fixed inset-0 bg-black/70 z-[200] hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-4 w-full max-w-lg">
        <h3 class="font-bold mb-3 text-center">قص الصورة</h3>
        <div class="relative w-full h-64 bg-gray-100 rounded-lg overflow-hidden">
            <img id="cropImage" class="max-w-full block" src="" alt="صورة للقص">
        </div>
        <div class="flex justify-center gap-3 mt-4">
            <button id="cancelCrop" class="bg-gray-200 hover:bg-gray-300 font-bold px-5 py-2 rounded-lg">إلغاء</button>
            <button id="confirmCrop" class="bg-sky-500 hover:bg-sky-600 text-white font-bold px-5 py-2 rounded-lg">تأكيد</button>
        </div>
    </div>
</div>

<!-- Cropper.js -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

<script>
(() => {
    // --- التبويبات ---
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active','bg-gray-100'); b.classList.add('text-gray-500'); });
            btn.classList.add('active','bg-gray-100');
            btn.classList.remove('text-gray-500');
            document.querySelectorAll('.tab-content, [id^="tab-"]').forEach(el => el.classList.add('hidden'));
            const target = btn.dataset.tab;
            document.getElementById(`tab-${target}`).classList.remove('hidden');
        });
    });

    // --- عناصر الصفحة ---
    const avatarImg = document.getElementById('profileAvatar');
    const nameEl = document.getElementById('profileName');
    const emailEl = document.getElementById('profileEmail');
    const bioEl = document.getElementById('profileBio');
    const aboutEl = document.getElementById('aboutBio');
    const editBtn = document.getElementById('editProfileBtn');
    const saveBtn = document.getElementById('saveProfileBtn');
    const avatarInput = document.getElementById('avatarFileInput');
    const avatarOverlay = document.getElementById('avatarOverlay');
    const cropModal = document.getElementById('cropperModal');
    const cropImage = document.getElementById('cropImage');
    const cancelCrop = document.getElementById('cancelCrop');
    const confirmCrop = document.getElementById('confirmCrop');
    let cropper = null;

    // --- تحميل بيانات المستخدم ---
    async function loadProfile() {
        try {
            const userProfile = await window.engine.getOrCreateUserProfile();
            avatarImg.src = userProfile.photoURL || window.auth?.currentUser?.photoURL || '';
            nameEl.textContent = userProfile.displayName || window.auth?.currentUser?.displayName || 'مستخدم';
            emailEl.textContent = window.auth?.currentUser?.email || '';
            bioEl.textContent = userProfile.bio || '🦈 مؤسس في Shark Hub';
            aboutEl.textContent = bioEl.textContent;
        } catch (e) {
            const user = window.auth?.currentUser;
            if (user) {
                avatarImg.src = user.photoURL || '';
                nameEl.textContent = user.displayName || '';
                emailEl.textContent = user.email || '';
            }
        }
    }
    loadProfile();

    // --- تجهيز المنشورات ---
    if (window.engine && typeof window.engine.listenToUserPosts === 'function') {
        window.engine.listenToUserPosts('userPostsContainer');
    } else {
        document.getElementById('userPostsContainer').innerHTML = '<p class="text-red-500 text-sm">خاصية المنشورات غير متاحة</p>';
    }

    // --- فتح أداة قص الصورة ---
    avatarOverlay.addEventListener('click', () => avatarInput.click());

    avatarInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
            cropImage.src = reader.result;
            if (cropper) cropper.destroy();
            cropper = new Cropper(cropImage, {
                aspectRatio: 1,
                viewMode: 1,
                autoCropArea: 0.8,
            });
            cropModal.classList.remove('hidden');
            cropModal.classList.add('flex');
        };
        reader.readAsDataURL(file);
    });

    cancelCrop.addEventListener('click', () => {
        cropModal.classList.add('hidden');
        cropModal.classList.remove('flex');
        if (cropper) cropper.destroy();
        cropper = null;
        avatarInput.value = '';
    });

    confirmCrop.addEventListener('click', async () => {
        if (!cropper) return;
        const canvas = cropper.getCroppedCanvas({ width: 300, height: 300 });
        const dataUrl = canvas.toDataURL('image/jpeg', 0.7); // تخفيض الحجم
        avatarImg.src = dataUrl;
        // حفظ في Firestore
        await window.engine.updateUserProfile({ photoURL: dataUrl });
        cropModal.classList.add('hidden');
        cropModal.classList.remove('flex');
        if (cropper) cropper.destroy();
        cropper = null;
        avatarInput.value = '';
        showToast('تم تحديث الصورة وحفظها ✅');
    });

    // --- تحرير الاسم والوصف ---
    editBtn.addEventListener('click', () => {
        nameEl.contentEditable = 'true';
        bioEl.contentEditable = 'true';
        nameEl.classList.add('bg-yellow-50','px-2','rounded');
        bioEl.classList.add('bg-yellow-50','px-2','rounded');
        editBtn.classList.add('hidden');
        saveBtn.classList.remove('hidden');
    });

    saveBtn.addEventListener('click', async () => {
        nameEl.contentEditable = 'false';
        bioEl.contentEditable = 'false';
        nameEl.classList.remove('bg-yellow-50','px-2','rounded');
        bioEl.classList.remove('bg-yellow-50','px-2','rounded');
        editBtn.classList.remove('hidden');
        saveBtn.classList.add('hidden');
        const newName = nameEl.textContent.trim();
        const newBio = bioEl.textContent.trim();
        await window.engine.updateUserProfile({ displayName: newName, bio: newBio });
        aboutEl.textContent = newBio;
        showToast('تم حفظ البيانات في السحابة ☁️');
    });

    function showToast(msg) {
        const t = document.createElement('div');
        t.className = 'fixed bottom-4 left-4 bg-gray-800 text-white px-4 py-2 rounded-lg text-sm z-50 shadow-lg';
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2500);
    }
})();
</script>
