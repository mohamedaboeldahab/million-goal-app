<!-- ========== غلاف محيطي (متجاوب) ========== -->
<div class="relative h-48 sm:h-72 bg-gradient-to-b from-cyan-400 via-sky-500 to-blue-600 overflow-hidden">
    <div class="absolute inset-0 opacity-30">
        <div class="bubble w-4 h-4 bg-white rounded-full absolute top-8 left-10 animate-ping"></div>
        <div class="bubble w-6 h-6 bg-white rounded-full absolute top-16 right-16 animate-bounce"></div>
        <div class="bubble w-3 h-3 bg-white rounded-full absolute bottom-12 left-1/3 animate-pulse"></div>
        <div class="bubble w-5 h-5 bg-white rounded-full absolute top-24 left-1/2 animate-bounce delay-200"></div>
    </div>
    <div class="absolute bottom-0 left-0 w-full">
        <svg class="wave wave1" viewBox="0 0 1440 120" preserveAspectRatio="none">
            <path fill="rgba(255,255,255,0.4)" d="M0,60 C240,120 480,0 720,60 C960,120 1200,0 1440,60 L1440,120 L0,120 Z"></path>
        </svg>
        <svg class="wave wave2" viewBox="0 0 1440 120" preserveAspectRatio="none">
            <path fill="rgba(255,255,255,0.2)" d="M0,80 C240,40 480,120 720,80 C960,40 1200,120 1440,80 L1440,120 L0,120 Z"></path>
        </svg>
    </div>
    <div class="absolute inset-0 flex flex-col items-center justify-center text-white px-4">
        <div class="text-5xl sm:text-8xl mb-1 drop-shadow-lg" style="animation: swim 3s ease-in-out infinite alternate;">🦈</div>
        <h1 class="text-2xl sm:text-4xl font-black tracking-widest text-center" style="animation: glow 2s ease-in-out infinite alternate;">SHARK UP</h1>
    </div>
</div>

<style>
@keyframes swim { 0% { transform: translateX(-10px) rotate(-3deg); } 100% { transform: translateX(10px) rotate(3deg); } }
@keyframes glow { 0% { text-shadow: 0 0 5px rgba(255,255,255,0.6); } 100% { text-shadow: 0 0 20px rgba(255,255,255,0.9), 0 0 30px rgba(14,165,233,0.7); } }
.wave { animation: moveWave 8s linear infinite; }
.wave2 { animation: moveWave 12s linear infinite reverse; }
@keyframes moveWave { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
</style>

<!-- ========== معلومات البروفايل (بدون تداخل سلبي) ========== -->
<div dir="rtl" class="bg-white rounded-t-3xl shadow-xl -mt-6 sm:-mt-14 px-4 pb-6 pt-6 relative z-10">
    <div class="flex flex-col items-start">
        <div class="w-24 h-24 sm:w-32 sm:h-32 rounded-2xl border-4 border-white shadow-lg overflow-hidden bg-white group relative -mt-14 sm:-mt-20">
            <img id="profileAvatar" class="w-full h-full object-cover" src="" alt="صورتي">
            <div id="avatarOverlay" class="absolute inset-0 bg-black/30 hidden group-hover:flex items-center justify-center text-white cursor-pointer text-xl sm:text-2xl">
                <i class="fa-solid fa-camera"></i>
            </div>
            <input type="file" id="avatarFileInput" accept="image/*" class="hidden">
        </div>
        <div class="mt-2 flex items-center gap-2 flex-wrap">
            <h1 id="profileName" class="text-xl sm:text-3xl font-black text-gray-800">جار التحميل...</h1>
            <span class="text-xl sm:text-2xl">🦈</span>
            <span class="bg-sky-500 text-white text-[10px] sm:text-xs px-2 py-0.5 rounded-full font-bold whitespace-nowrap"><i class="fa-solid fa-shield-check"></i> موثّق</span>
        </div>
    </div>
    <div class="mt-3 text-right">
        <p id="profileEmail" class="text-xs sm:text-sm text-gray-500"></p>
        <p id="profileBio" class="text-xs sm:text-sm text-gray-600 mt-1 max-w-md"></p>
        <div id="profileActions" class="flex justify-start gap-2 mt-3 flex-wrap">
            <button id="editProfileBtn" class="bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-1.5 px-4 sm:py-2 sm:px-5 rounded-lg text-xs sm:text-sm"><i class="fa-solid fa-pen-to-square"></i> تعديل</button>
            <button id="saveProfileBtn" class="bg-sky-500 hover:bg-sky-600 text-white font-bold py-1.5 px-4 sm:py-2 sm:px-5 rounded-lg text-xs sm:text-sm hidden"><i class="fa-solid fa-check"></i> حفظ</button>
            <button id="logoutBtn" onclick="engine.logout()" class="bg-white border border-red-200 text-red-500 hover:bg-red-50 font-bold py-1.5 px-4 sm:py-2 sm:px-5 rounded-lg text-xs sm:text-sm"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
        </div>
    </div>
    <div class="flex gap-1 mt-6 border-b pb-2 overflow-x-auto justify-start">
        <button class="tab-btn active font-bold text-xs sm:text-sm px-3 sm:px-4 py-2 rounded-lg bg-gray-100" data-tab="posts">📄 المنشورات</button>
        <button class="tab-btn font-bold text-xs sm:text-sm px-3 sm:px-4 py-2 rounded-lg text-gray-500 hover:bg-gray-100" data-tab="about">ℹ️ عني</button>
    </div>
    <div class="mt-4">
        <div id="tab-posts">
            <div id="userPostsContainer" class="space-y-3">
                <div class="text-center py-10 text-gray-400">
                    <div class="w-8 h-8 border-4 border-sky-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                    <p class="mt-2 text-xs sm:text-sm">جاري تحميل المنشورات...</p>
                </div>
            </div>
        </div>
        <div id="tab-about" class="hidden">
            <div class="bg-gray-50 rounded-xl p-4">
                <p class="font-bold mb-2 text-sm">نبذة عني</p>
                <p id="aboutBio" class="text-xs sm:text-sm text-gray-600">🦈 مؤسس في Shark Hub</p>
            </div>
        </div>
    </div>
</div>

<!-- ========== سكريبت تحميل البروفايل (عام أو شخصي) ========== -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, query, where, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-firestore.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB_2ms4K8EPbag7uab9gbDy8eePY6xwpxc",
        authDomain: "millionaireapp-be931.firebaseapp.com",
        projectId: "millionaireapp-be931",
        storageBucket: "millionaireapp-be931.firebasestorage.app",
        messagingSenderId: "325577904362",
        appId: "1:325577904362:web:8d85d4547bf22b1d8f4793"
    };

    let app;
    try {
        app = initializeApp(firebaseConfig);
    } catch (e) {
        app = firebase.getApp();
    }
    const db = getFirestore(app);
    const auth = getAuth(app);

    function fixPhotoUrl(url) {
        if (!url) return "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23e2e8f0'/%3E%3Ctext x='50' y='67' font-size='60' text-anchor='middle' fill='%2394a3b8'%3E🦈%3C/text%3E%3C/svg%3E";
        if (url.startsWith('data:')) return url;
        if (url.includes('googleusercontent.com') || url.includes('ggpht.com')) {
            return url.replace(/=s[0-9]+(-c)?/, '=s50-c').replace(/=s[0-9]+/, '=s50');
        }
        return url;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const profileUid = urlParams.get('uid');

    const avatarImg = document.getElementById('profileAvatar');
    const nameEl = document.getElementById('profileName');
    const emailEl = document.getElementById('profileEmail');
    const bioEl = document.getElementById('profileBio');
    const aboutEl = document.getElementById('aboutBio');
    const postsContainer = document.getElementById('userPostsContainer');
    const editBtn = document.getElementById('editProfileBtn');
    const saveBtn = document.getElementById('saveProfileBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const avatarOverlay = document.getElementById('avatarOverlay');
    const avatarFileInput = document.getElementById('avatarFileInput');

    async function loadPublicProfile(uid) {
        if (editBtn) editBtn.style.display = 'none';
        if (saveBtn) saveBtn.style.display = 'none';
        if (logoutBtn) logoutBtn.style.display = 'none';
        if (avatarOverlay) avatarOverlay.style.display = 'none';
        if (avatarFileInput) avatarFileInput.disabled = true;

        const userDoc = await getDoc(doc(db, "users", uid));
        if (!userDoc.exists()) {
            alert("المستخدم غير موجود");
            window.location.href = "index.html";
            return;
        }
        const userData = userDoc.data();

        nameEl.textContent = userData.displayName || 'مستخدم';
        avatarImg.src = fixPhotoUrl(userData.photoURL);
        bioEl.textContent = userData.bio || '';
        aboutEl.textContent = userData.bio || '';
        emailEl.textContent = '';

        const q = query(collection(db, "posts"), where("authorId", "==", uid), orderBy("createdAt", "desc"));
        const snapshot = await getDocs(q);
        postsContainer.innerHTML = '';
        if (snapshot.empty) {
            postsContainer.innerHTML = '<p class="text-gray-400 text-sm text-center py-8">لا توجد منشورات بعد</p>';
            return;
        }
        snapshot.forEach(docSnap => {
            const p = docSnap.data();
            const dateStr = p.createdAt?.toDate().toLocaleString('ar-EG') || '';
            const img = fixPhotoUrl(p.authorPhoto);
            const card = document.createElement('div');
            card.className = 'bg-white rounded-2xl p-4 mb-3 shadow-sm';
            card.innerHTML = `
                <div class="flex items-center gap-2 mb-2">
                    <img src="${img}" class="w-10 h-10 rounded-full border border-sky-200 object-cover">
                    <span class="font-extrabold text-gray-800 text-sm">${p.authorName || 'مستخدم'}</span>
                    <span class="text-xs text-gray-400">${dateStr}</span>
                </div>
                <p class="text-gray-700 text-sm leading-relaxed whitespace-pre-wrap">${p.content}</p>
            `;
            postsContainer.appendChild(card);
        });
    }

    if (profileUid) {
        loadPublicProfile(profileUid);
    } else {
        (function waitForEngine() {
            if (window.engine && window.engine.listenToProfilePosts) {
                window.engine.listenToProfilePosts('userPostsContainer');
                window.engine.activateProfile?.();
            } else {
                setTimeout(waitForEngine, 100);
            }
        })();
    }
</script>
