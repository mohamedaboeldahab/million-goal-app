<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>البروفايل – Shark UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #f0f2f5; margin: 0; }
        @keyframes swim { 0% { transform: translateX(-8px) rotate(-2deg); } 100% { transform: translateX(8px) rotate(2deg); } }
        @keyframes glow { 0% { text-shadow: 0 0 5px rgba(255,255,255,0.5); } 100% { text-shadow: 0 0 15px rgba(255,255,255,0.8), 0 0 25px rgba(14,165,233,0.6); } }
        .wave { animation: moveWave 8s linear infinite; }
        .wave2 { animation: moveWave 12s linear infinite reverse; }
        @keyframes moveWave { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .tab-btn.active { background: #0ea5e9 !important; color: white !important; }
        .card-shadow { box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
    </style>
</head>
<body class="bg-gray-50">

<!-- هيدر علوي (يظهر فقط في الوضع المستقل، مخفي داخل SPA) -->
<div id="standaloneHeader" class="bg-gradient-to-l from-sky-500 to-blue-600 text-white px-4 py-3 flex items-center gap-3 shadow-md sticky top-0 z-50">
    <button id="backBtnInHeader" onclick="window.history.back()" class="w-9 h-9 bg-white/20 rounded-xl flex items-center justify-center text-white hover:bg-white/30 transition">
        <i class="fa-solid fa-arrow-right text-sm"></i>
    </button>
    <span class="font-black text-lg tracking-wider">SHARK UP</span>
    <span class="text-xs bg-white/20 px-2 py-0.5 rounded-full mr-auto">🦈 الملف الشخصي</span>
</div>

<div class="max-w-md mx-auto px-3 pb-6">
    <!-- غلاف البروفايل -->
    <div class="relative h-40 bg-gradient-to-b from-cyan-400 via-sky-500 to-blue-600 rounded-b-[2rem] overflow-hidden shadow-lg mt-0">
        <div class="absolute inset-0 opacity-20">
            <div class="w-3 h-3 bg-white rounded-full absolute top-6 left-6 animate-ping"></div>
            <div class="w-4 h-4 bg-white rounded-full absolute top-10 right-10 animate-bounce"></div>
            <div class="w-2 h-2 bg-white rounded-full absolute bottom-8 left-1/3 animate-pulse"></div>
            <div class="w-5 h-5 bg-white rounded-full absolute top-16 left-1/2 animate-bounce" style="animation-delay: 0.3s;"></div>
        </div>
        <div class="absolute inset-0 flex flex-col items-center justify-center text-white">
            <div class="text-4xl drop-shadow-lg" style="animation: swim 3s ease-in-out infinite alternate;">🦈</div>
            <h1 class="text-lg font-black tracking-widest" style="animation: glow 2s ease-in-out infinite alternate;">SHARK UP</h1>
        </div>
    </div>

    <!-- بطاقة المعلومات (تتداخل مع الغلاف) -->
    <div class="bg-white rounded-2xl card-shadow -mt-10 px-4 pt-8 pb-4 relative z-10">
        <!-- صورة البروفايل -->
        <div class="flex flex-col items-center">
            <div class="w-24 h-24 rounded-full border-4 border-white shadow-md overflow-hidden bg-white relative -mt-16 group">
                <img id="profileAvatar" class="w-full h-full object-cover" src="" alt="الصورة الشخصية">
                <div id="avatarOverlay" class="absolute inset-0 bg-black/30 hidden group-hover:flex items-center justify-center text-white cursor-pointer text-2xl">
                    <i class="fa-solid fa-camera"></i>
                </div>
                <input type="file" id="avatarFileInput" accept="image/*" class="hidden">
            </div>
            <!-- الاسم والشارة -->
            <div class="mt-2 flex items-center gap-1 flex-wrap justify-center">
                <h1 id="profileName" class="text-lg font-black text-gray-800">جار التحميل...</h1>
                <span class="text-lg">🦈</span>
                <span class="bg-sky-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold"><i class="fa-solid fa-shield-check"></i> موثّق</span>
            </div>
        </div>

        <!-- البريد والبيو -->
        <div class="text-center mt-2">
            <p id="profileEmail" class="text-xs text-gray-400"></p>
            <p id="profileBio" class="text-xs text-gray-500 mt-1 px-2"></p>

            <!-- أزرار الإجراءات -->
            <div id="profileActions" class="flex justify-center gap-2 mt-4 flex-wrap">
                <button id="editProfileBtn" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2 px-4 rounded-xl text-xs transition">
                    <i class="fa-solid fa-pen-to-square"></i> تعديل
                </button>
                <button id="saveProfileBtn" class="bg-sky-500 hover:bg-sky-600 text-white font-bold py-2 px-4 rounded-xl text-xs transition hidden">
                    <i class="fa-solid fa-check"></i> حفظ
                </button>
                <button id="logoutBtn" class="bg-white border border-red-200 text-red-500 hover:bg-red-50 font-bold py-2 px-4 rounded-xl text-xs transition">
                    <i class="fa-solid fa-right-from-bracket"></i> خروج
                </button>
            </div>
        </div>

        <!-- تبويبات -->
        <div class="flex gap-1 mt-5 border-b pb-2 justify-center">
            <button class="tab-btn active font-bold text-xs px-4 py-2 rounded-lg bg-gray-100" data-tab="posts">
                📄 المنشورات
            </button>
            <button class="tab-btn font-bold text-xs px-4 py-2 rounded-lg text-gray-500" data-tab="about">
                ℹ️ عني
            </button>
        </div>

        <!-- محتوى التبويبات -->
        <div class="mt-3">
            <div id="tab-posts">
                <div id="userPostsContainer" class="space-y-3">
                    <div class="text-center py-8 text-gray-400">
                        <div class="w-8 h-8 border-4 border-sky-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                        <p class="mt-2 text-xs">جاري تحميل المنشورات...</p>
                    </div>
                </div>
            </div>
            <div id="tab-about" class="hidden">
                <div class="bg-gray-50 rounded-xl p-4 text-center">
                    <p class="font-bold text-sm mb-1">نبذة عني</p>
                    <p id="aboutBio" class="text-xs text-gray-600">🦈 مؤسس في Shark Hub</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Firebase config
    const firebaseConfig = {
        apiKey: "AIzaSyB_2ms4K8EPbag7uab9gbDy8eePY6xwpxc",
        authDomain: "millionaireapp-be931.firebaseapp.com",
        projectId: "millionaireapp-be931",
        storageBucket: "millionaireapp-be931.firebasestorage.app",
        messagingSenderId: "325577904362",
        appId: "1:325577904362:web:8d85d4547bf22b1d8f4793"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    function fixPhotoUrl(url) {
        if (!url) return "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23e2e8f0'/%3E%3Ctext x='50' y='67' font-size='60' text-anchor='middle' fill='%2394a3b8'%3E🦈%3C/text%3E%3C/svg%3E";
        if (url.startsWith('data:')) return url;
        if (url.includes('googleusercontent.com') || url.includes('ggpht.com')) {
            return url.replace(/=s[0-9]+(-c)?/, '=s50-c').replace(/=s[0-9]+/, '=s50');
        }
        return url;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const profileUid = urlParams.get('uid');

    const avatarImg = document.getElementById('profileAvatar');
    const nameEl = document.getElementById('profileName');
    const emailEl = document.getElementById('profileEmail');
    const bioEl = document.getElementById('profileBio');
    const aboutEl = document.getElementById('aboutBio');
    const postsContainer = document.getElementById('userPostsContainer');
    const editBtn = document.getElementById('editProfileBtn');
    const saveBtn = document.getElementById('saveProfileBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const avatarOverlay = document.getElementById('avatarOverlay');
    const avatarFileInput = document.getElementById('avatarFileInput');
    const standaloneHeader = document.getElementById('standaloneHeader');
    const backBtnInHeader = document.getElementById('backBtnInHeader');

    // إظهار/إخفاء الهيدر المستقل حسب الحاجة
    // إذا كان هناك engine أو كنا داخل SPA، نخفي الهيدر
    if (window.engine || window !== window.top) {
        if (standaloneHeader) standaloneHeader.style.display = 'none';
    } else {
        if (standaloneHeader) standaloneHeader.style.display = 'flex';
    }

    // تبديل التبويبات
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active','bg-gray-100'); b.classList.add('text-gray-500'); });
            btn.classList.add('active','bg-gray-100');
            btn.classList.remove('text-gray-500');
            document.getElementById('tab-posts').classList.toggle('hidden', btn.dataset.tab !== 'posts');
            document.getElementById('tab-about').classList.toggle('hidden', btn.dataset.tab !== 'about');
        });
    });

    // تحميل بروفايل عام
    async function loadPublicProfile(uid) {
        // إخفاء أزرار التعديل
        editBtn.style.display = 'none';
        saveBtn.style.display = 'none';
        logoutBtn.style.display = 'none';
        if (avatarOverlay) avatarOverlay.style.display = 'none';
        if (avatarFileInput) avatarFileInput.disabled = true;
        // زر الرجوع يظهر في الهيدر
        if (backBtnInHeader) backBtnInHeader.style.display = 'flex';

        try {
            const userDoc = await db.collection("users").doc(uid).get();
            if (!userDoc.exists) {
                alert("المستخدم غير موجود");
                window.location.href = "index.html";
                return;
            }
            const userData = userDoc.data();
            nameEl.textContent = userData.displayName || 'مستخدم';
            avatarImg.src = fixPhotoUrl(userData.photoURL);
            bioEl.textContent = userData.bio || '';
            aboutEl.textContent = userData.bio || '';
            emailEl.textContent = '';

            const snapshot = await db.collection("posts")
                .where("authorId", "==", uid)
                .orderBy("createdAt", "desc")
                .get();

            postsContainer.innerHTML = '';
            if (snapshot.empty) {
                postsContainer.innerHTML = '<p class="text-gray-400 text-sm text-center py-6">لا توجد منشورات بعد</p>';
                return;
            }
            snapshot.forEach(docSnap => {
                const p = docSnap.data();
                const dateStr = p.createdAt?.toDate().toLocaleString('ar-EG') || '';
                const img = fixPhotoUrl(p.authorPhoto);
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl p-3 shadow-sm border border-gray-100';
                card.innerHTML = `
                    <div class="flex items-center gap-2 mb-2">
                        <img src="${img}" class="w-8 h-8 rounded-full border border-sky-200 object-cover">
                        <span class="font-bold text-gray-800 text-xs">${p.authorName || 'مستخدم'}</span>
                        <span class="text-[10px] text-gray-400 mr-auto">${dateStr}</span>
                    </div>
                    <p class="text-gray-700 text-xs leading-relaxed whitespace-pre-wrap">${p.content}</p>
                `;
                postsContainer.appendChild(card);
            });
        } catch (e) {
            postsContainer.innerHTML = '<p class="text-red-500 text-xs text-center py-6">حدث خطأ في تحميل البروفايل</p>';
        }
    }

    // تحميل البروفايل الشخصي
    async function loadOwnProfile() {
        try {
            const user = auth.currentUser;
            if (!user) {
                window.location.href = "index.html";
                return;
            }
            const userDoc = await db.collection("users").doc(user.uid).get();
            const userData = userDoc.data() || {};
            avatarImg.src = fixPhotoUrl(userData.photoURL || user.photoURL);
            nameEl.textContent = userData.displayName || user.displayName || 'مستخدم';
            bioEl.textContent = userData.bio || '';
            aboutEl.textContent = userData.bio || '';
            emailEl.textContent = user.email || '';

            if (window.engine && window.engine.listenToProfilePosts) {
                window.engine.listenToProfilePosts('userPostsContainer');
                window.engine.activateProfile?.();
            } else {
                const snapshot = await db.collection("posts")
                    .where("authorId", "==", user.uid)
                    .orderBy("createdAt", "desc")
                    .get();
                postsContainer.innerHTML = '';
                if (snapshot.empty) {
                    postsContainer.innerHTML = '<p class="text-gray-400 text-xs text-center py-6">لا توجد منشورات بعد</p>';
                    return;
                }
                snapshot.forEach(docSnap => {
                    const p = docSnap.data();
                    const dateStr = p.createdAt?.toDate().toLocaleString('ar-EG') || '';
                    const img = fixPhotoUrl(p.authorPhoto);
                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-2xl p-3 shadow-sm border border-gray-100';
                    card.innerHTML = `
                        <div class="flex items-center gap-2 mb-2">
                            <img src="${img}" class="w-8 h-8 rounded-full border border-sky-200 object-cover">
                            <span class="font-bold text-gray-800 text-xs">${p.authorName || 'مستخدم'}</span>
                            <span class="text-[10px] text-gray-400 mr-auto">${dateStr}</span>
                        </div>
                        <p class="text-gray-700 text-xs leading-relaxed whitespace-pre-wrap">${p.content}</p>
                    `;
                    postsContainer.appendChild(card);
                });
            }
        } catch (e) {
            postsContainer.innerHTML = '<p class="text-red-500 text-xs text-center py-6">حدث خطأ في تحميل البروفايل</p>';
        }
    }

    // بدء التشغيل
    if (profileUid) {
        loadPublicProfile(profileUid);
    } else {
        auth.onAuthStateChanged(user => {
            if (user) {
                loadOwnProfile();
            } else {
                window.location.href = "index.html";
            }
        });
    }

    // ربط زر الخروج
    if (logoutBtn) {
        logoutBtn.addEventListener('click', async () => {
            if (confirm("هل تريد مغادرة المحيط؟")) {
                await auth.signOut();
                window.location.href = "index.html";
            }
        });
    }
</script>

</body>
</html>
