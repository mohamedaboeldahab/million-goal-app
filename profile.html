<!-- ========== غلاف محيطي (متجاوب) ========== -->
<div class="relative h-48 sm:h-72 bg-gradient-to-b from-cyan-400 via-sky-500 to-blue-600 overflow-hidden">
    <div class="absolute inset-0 opacity-30">
        <div class="bubble w-4 h-4 bg-white rounded-full absolute top-8 left-10 animate-ping"></div>
        <div class="bubble w-6 h-6 bg-white rounded-full absolute top-16 right-16 animate-bounce"></div>
        <div class="bubble w-3 h-3 bg-white rounded-full absolute bottom-12 left-1/3 animate-pulse"></div>
        <div class="bubble w-5 h-5 bg-white rounded-full absolute top-24 left-1/2 animate-bounce delay-200"></div>
    </div>
    <div class="absolute bottom-0 left-0 w-full">
        <svg class="wave wave1" viewBox="0 0 1440 120" preserveAspectRatio="none">
            <path fill="rgba(255,255,255,0.4)" d="M0,60 C240,120 480,0 720,60 C960,120 1200,0 1440,60 L1440,120 L0,120 Z"></path>
        </svg>
        <svg class="wave wave2" viewBox="0 0 1440 120" preserveAspectRatio="none">
            <path fill="rgba(255,255,255,0.2)" d="M0,80 C240,40 480,120 720,80 C960,40 1200,120 1440,80 L1440,120 L0,120 Z"></path>
        </svg>
    </div>
    <div class="absolute inset-0 flex flex-col items-center justify-center text-white px-4">
        <div class="text-5xl sm:text-8xl mb-1 drop-shadow-lg" style="animation: swim 3s ease-in-out infinite alternate;">🦈</div>
        <h1 class="text-2xl sm:text-4xl font-black tracking-widest text-center" style="animation: glow 2s ease-in-out infinite alternate;">SHARK UP</h1>
    </div>
</div>

<style>
@keyframes swim { 0% { transform: translateX(-10px) rotate(-3deg); } 100% { transform: translateX(10px) rotate(3deg); } }
@keyframes glow { 0% { text-shadow: 0 0 5px rgba(255,255,255,0.6); } 100% { text-shadow: 0 0 20px rgba(255,255,255,0.9), 0 0 30px rgba(14,165,233,0.7); } }
.wave { animation: moveWave 8s linear infinite; }
.wave2 { animation: moveWave 12s linear infinite reverse; }
@keyframes moveWave { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
</style>

<!-- ========== معلومات البروفايل ========== -->
<div dir="rtl" class="bg-white rounded-t-3xl shadow-xl -mt-6 sm:-mt-14 px-4 pb-6 pt-6 relative z-10">
    <div class="flex flex-col items-start">
        <!-- صورة المستخدم المربعة على اليمين -->
        <div class="w-24 h-24 sm:w-32 sm:h-32 rounded-2xl border-4 border-white shadow-lg overflow-hidden bg-white group relative -mt-14 sm:-mt-20">
            <img id="profileAvatar" class="w-full h-full object-cover" src="" alt="صورتي">
            <div id="avatarOverlay" class="absolute inset-0 bg-black/30 hidden group-hover:flex items-center justify-center text-white cursor-pointer text-xl sm:text-2xl">
                <i class="fa-solid fa-camera"></i>
            </div>
            <input type="file" id="avatarFileInput" accept="image/*" class="hidden">
        </div>
        
        <div class="mt-2 flex items-center gap-2 flex-wrap">
            <h1 id="profileName" class="text-xl sm:text-3xl font-black text-gray-800">جار التحميل...</h1>
            <span class="text-xl sm:text-2xl">🦈</span>
            <span class="bg-sky-500 text-white text-[10px] sm:text-xs px-2 py-0.5 rounded-full font-bold whitespace-nowrap">
                <i class="fa-solid fa-shield-check"></i> موثّق
            </span>
        </div>
    </div>
    
    <div class="mt-3 text-right">
        <p id="profileEmail" class="text-xs sm:text-sm text-gray-500"></p>
        <p id="profileBio" class="text-xs sm:text-sm text-gray-600 mt-1 max-w-md"></p>
        
        <!-- إحصائيات المستخدم -->
        <div class="flex gap-4 mt-3">
            <div class="text-center">
                <span id="postsCount" class="block font-bold text-gray-800 text-sm">0</span>
                <span class="text-xs text-gray-400">منشورات</span>
            </div>
            <div class="text-center">
                <span id="friendsCount" class="block font-bold text-gray-800 text-sm">0</span>
                <span class="text-xs text-gray-400">أصدقاء</span>
            </div>
        </div>
        
        <div id="profileActions" class="flex justify-start gap-2 mt-3 flex-wrap">
            <!-- ستُملأ هذه المنطقة ديناميكيًا -->
        </div>
    </div>
    
    <!-- تبويبات -->
    <div class="flex gap-1 mt-6 border-b pb-2 overflow-x-auto justify-start">
        <button class="tab-btn active font-bold text-xs sm:text-sm px-3 sm:px-4 py-2 rounded-lg bg-gray-100" data-tab="posts">
            📄 المنشورات
        </button>
        <button class="tab-btn font-bold text-xs sm:text-sm px-3 sm:px-4 py-2 rounded-lg text-gray-500 hover:bg-gray-100" data-tab="about">
            ℹ️ عني
        </button>
        <button id="friendsTabBtn" class="tab-btn font-bold text-xs sm:text-sm px-3 sm:px-4 py-2 rounded-lg text-gray-500 hover:bg-gray-100 hidden" data-tab="friends">
            👥 الأصدقاء
        </button>
    </div>
    
    <div class="mt-4">
        <!-- تبويب المنشورات -->
        <div id="tab-posts">
            <div id="userPostsContainer" class="space-y-3">
                <div class="text-center py-10 text-gray-400">
                    <div class="w-8 h-8 border-4 border-sky-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                    <p class="mt-2 text-xs sm:text-sm">جاري تحميل المنشورات...</p>
                </div>
            </div>
        </div>
        
        <!-- تبويب عني -->
        <div id="tab-about" class="hidden">
            <div class="bg-gray-50 rounded-xl p-4">
                <div class="flex items-center gap-2 mb-3">
                    <i class="fa-solid fa-shark text-sky-500"></i>
                    <p class="font-bold text-sm">نبذة عني</p>
                </div>
                <p id="aboutBio" class="text-xs sm:text-sm text-gray-600">لا توجد معلومات</p>
                <div class="mt-3 pt-3 border-t">
                    <p class="text-xs text-gray-400">
                        <i class="fa-regular fa-calendar ml-1"></i> 
                        تاريخ الانضمام: <span id="joinDate">...</span>
                    </p>
                </div>
            </div>
        </div>
        
        <!-- تبويب الأصدقاء -->
        <div id="tab-friends" class="hidden">
            <div class="bg-gray-50 rounded-xl p-4">
                <h2 class="text-md font-bold mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-user-plus text-sky-500"></i> طلبات الصداقة
                </h2>
                <div id="friendRequestsList" class="space-y-2 mb-6">
                    <p class="text-gray-400 text-xs text-center py-3">✨ لا توجد طلبات صداقة</p>
                </div>

                <h2 class="text-md font-bold mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-users text-sky-500"></i> أصدقائي
                </h2>
                <div id="friendsList" class="space-y-2">
                    <p class="text-gray-400 text-xs text-center py-3">💙 لا يوجد أصدقاء بعد</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ========== سكريبت تحميل البيانات ========== -->
<!-- ========== سكريبت تحميل البيانات ========== -->
<script>
    (function() {
        // منع تكرار التحميل
        if (window._profileLoaded) return;
        window._profileLoaded = true;
        
        async function updateAllStats() {
            if (!window.auth?.currentUser) {
                console.log("انتظار تسجيل الدخول...");
                return;
            }
            
            const userId = window.auth.currentUser.uid;
            console.log("تحديث الإحصائيات للمستخدم:", userId);
            
            try {
                // عدد المنشورات
                const postsQuery = query(collection(window.db, "posts"), where("authorId", "==", userId));
                const postsSnap = await getDocs(postsQuery);
                const postsCount = document.getElementById('postsCount');
                if (postsCount) {
                    postsCount.textContent = postsSnap.size;
                    console.log("✅ تم تحميل المنشورات:", postsSnap.size);
                }
            } catch(e) { console.error("خطأ في المنشورات:", e); }
            
            try {
                // عدد الأصدقاء
                const q1 = query(collection(window.db, "friendships"), where("user1", "==", userId));
                const q2 = query(collection(window.db, "friendships"), where("user2", "==", userId));
                const [snap1, snap2] = await Promise.all([getDocs(q1), getDocs(q2)]);
                const friendsCount = document.getElementById('friendsCount');
                if (friendsCount) {
                    const total = snap1.size + snap2.size;
                    friendsCount.textContent = total;
                    console.log("✅ تم تحميل الأصدقاء:", total);
                }
            } catch(e) { console.error("خطأ في الأصدقاء:", e); }
        }
        
        function waitForEngine() {
            if (window.engine && window.engine.listenToProfilePosts && window.auth?.currentUser) {
                console.log("Engine جاهز، بدء تحميل البروفايل...");
                window.engine.listenToProfilePosts('userPostsContainer');
                window.engine.activateProfile();
                
                // تحديث الإحصائيات بعد 1 ثانية
                setTimeout(() => {
                    updateAllStats();
                }, 1000);
            } else {
                console.log("انتظار تحميل Engine...");
                setTimeout(waitForEngine, 200);
            }
        }
        
        // تاريخ الانضمام
        const joinDateSpan = document.getElementById('joinDate');
        if (joinDateSpan && window.auth?.currentUser?.metadata?.creationTime) {
            const date = new Date(window.auth.currentUser.metadata.creationTime);
            joinDateSpan.textContent = date.toLocaleDateString('ar-EG');
            console.log("تاريخ الانضمام:", joinDateSpan.textContent);
        }
        
        waitForEngine();
        
        // إعداد التبويبات
        function setupTabs() {
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    const targetTab = this.dataset.tab;
                    tabs.forEach(t => {
                        t.classList.remove('active', 'bg-gray-100');
                        t.classList.add('text-gray-500');
                    });
                    this.classList.add('active', 'bg-gray-100');
                    this.classList.remove('text-gray-500');
                    
                    document.getElementById('tab-posts').classList.add('hidden');
                    document.getElementById('tab-about').classList.add('hidden');
                    document.getElementById('tab-friends').classList.add('hidden');
                    
                    document.getElementById(`tab-${targetTab}`).classList.remove('hidden');
                    
                    if (targetTab === 'friends') {
                        updateAllStats();
                    }
                });
            });
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', setupTabs);
        } else {
            setupTabs();
        }
        
        // تحديث الإحصائيات كل 10 ثواني
        setInterval(updateAllStats, 10000);
    })();
</script>
