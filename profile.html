<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>البروفايل – Shark UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <!-- ✅ إضافة Firebase Storage للتعامل مع رفع الصور -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #f0f2f5; margin: 0; }
        @keyframes swim { 0% { transform: translateX(-8px) rotate(-2deg); } 100% { transform: translateX(8px) rotate(2deg); } }
        @keyframes glow { 0% { text-shadow: 0 0 5px rgba(255,255,255,0.5); } 100% { text-shadow: 0 0 15px rgba(255,255,255,0.8), 0 0 25px rgba(14,165,233,0.6); } }
        .tab-btn.active { background: #0ea5e9 !important; color: white !important; }
    </style>
</head>
<body class="bg-gray-50">

<!-- الهيدر المستقل -->
<div id="standaloneHeader" class="bg-gradient-to-l from-sky-500 to-blue-600 text-white px-4 py-3 flex items-center gap-3 shadow-md sticky top-0 z-50" style="display:none;">
    <button id="backBtnInHeader" onclick="window.location.href='index.html'" class="w-9 h-9 bg-white/20 rounded-xl flex items-center justify-center text-white hover:bg-white/30 transition">
        <i class="fa-solid fa-arrow-right text-sm"></i>
    </button>
    <span class="font-black text-lg tracking-wider">SHARK UP</span>
    <span class="text-xs bg-white/20 px-2 py-0.5 rounded-full mr-auto">🦈 الملف الشخصي</span>
</div>

<div id="profileContainer" class="max-w-md mx-auto pb-6">
    <!-- غلاف البروفايل -->
    <div class="relative h-36 bg-gradient-to-b from-cyan-400 via-sky-500 to-blue-600 rounded-b-[2.5rem] overflow-hidden shadow-lg mt-0">
        <div class="absolute inset-0 opacity-20">
            <div class="w-3 h-3 bg-white rounded-full absolute top-6 left-6 animate-ping"></div>
            <div class="w-4 h-4 bg-white rounded-full absolute top-10 right-10 animate-bounce"></div>
            <div class="w-2 h-2 bg-white rounded-full absolute bottom-8 left-1/3 animate-pulse"></div>
        </div>
        <div class="absolute inset-0 flex flex-col items-center justify-center text-white">
            <div class="text-4xl drop-shadow-lg" style="animation: swim 3s ease-in-out infinite alternate;">🦈</div>
            <h1 class="text-lg font-black tracking-widest" style="animation: glow 2s ease-in-out infinite alternate;">SHARK UP</h1>
        </div>
    </div>

    <!-- بطاقة المعلومات -->
    <div class="bg-white rounded-2xl shadow-xl -mt-10 px-5 pt-8 pb-5 relative z-10">
        <div class="flex items-start gap-4">
            <!-- الصورة المربعة -->
            <div class="w-24 h-24 rounded-2xl border-4 border-white shadow-lg overflow-hidden bg-white relative -mt-14 group flex-shrink-0 cursor-pointer" id="avatarBox">
                <img id="profileAvatar" class="w-full h-full object-cover" src="" alt="الصورة">
                <div id="avatarOverlay" class="absolute inset-0 bg-black/30 hidden group-hover:flex items-center justify-center text-white text-2xl">
                    <i class="fa-solid fa-camera"></i>
                </div>
                <input type="file" id="avatarFileInput" accept="image/*" class="hidden">
            </div>
            <!-- الاسم وقابل للتعديل -->
            <div class="mt-2 flex-1">
                <div class="flex items-center gap-1 flex-wrap">
                    <span id="profileNameDisplay" class="text-lg font-black text-gray-800"></span>
                    <input id="profileNameInput" class="hidden text-lg font-black text-gray-800 bg-gray-100 rounded px-2 py-1 w-full" placeholder="الاسم">
                    <span class="text-lg">🦈</span>
                    <span class="bg-sky-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold"><i class="fa-solid fa-shield-check"></i> موثّق</span>
                </div>
                <p id="profileEmail" class="text-xs text-gray-400 mt-1"></p>
                <p id="profileBio" class="text-xs text-gray-500 mt-1"></p>
                <textarea id="profileBioInput" class="hidden text-xs text-gray-500 mt-1 bg-gray-100 rounded p-2 w-full" rows="2" placeholder="نبذة عنك"></textarea>
            </div>
        </div>

        <!-- أزرار الإجراءات -->
        <div id="profileActions" class="flex justify-start gap-2 mt-4 flex-wrap">
            <button id="editProfileBtn" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2 px-4 rounded-xl text-xs transition"><i class="fa-solid fa-pen-to-square"></i> تعديل</button>
            <button id="saveProfileBtn" class="bg-sky-500 hover:bg-sky-600 text-white font-bold py-2 px-4 rounded-xl text-xs transition hidden"><i class="fa-solid fa-check"></i> حفظ</button>
            <button id="logoutBtn" class="bg-white border border-red-200 text-red-500 hover:bg-red-50 font-bold py-2 px-4 rounded-xl text-xs transition"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
        </div>

        <!-- تبويبات -->
        <div class="flex gap-1 mt-5 border-b pb-2 justify-start">
            <button class="tab-btn active font-bold text-xs px-4 py-2 rounded-lg bg-gray-100" data-tab="posts">📄 المنشورات</button>
            <button class="tab-btn font-bold text-xs px-4 py-2 rounded-lg text-gray-500" data-tab="about">ℹ️ عني</button>
        </div>

        <!-- محتوى التبويبات -->
        <div class="mt-3">
            <div id="tab-posts">
                <div id="userPostsContainer" class="space-y-3">
                    <div class="text-center py-8 text-gray-400"><div class="w-8 h-8 border-4 border-sky-500 border-t-transparent rounded-full animate-spin mx-auto"></div><p class="mt-2 text-xs">جاري تحميل المنشورات...</p></div>
                </div>
            </div>
            <div id="tab-about" class="hidden">
                <div class="bg-gray-50 rounded-xl p-4 text-center"><p class="font-bold text-sm mb-1">نبذة عني</p><p id="aboutBio" class="text-xs text-gray-600">🦈 مؤسس في Shark Hub</p></div>
            </div>
        </div>
    </div>

    <!-- شاشة الحساب المغلق -->
    <div id="closedAccountScreen" class="bg-white rounded-2xl shadow-xl px-5 py-12 text-center mt-6 hidden">
        <div class="text-6xl mb-4">🔒</div>
        <h2 class="text-xl font-black text-gray-800 mb-2">هذا الحساب مغلق</h2>
        <p class="text-sm text-gray-500 mb-6">لم يعد هذا الحساب متاحاً أو أنه غير موجود.</p>
        <button onclick="window.location.href='index.html'" class="bg-sky-500 text-white font-bold py-2 px-6 rounded-xl text-sm shadow hover:bg-sky-600 transition">العودة للرئيسية</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyB_2ms4K8EPbag7uab9gbDy8eePY6xwpxc",
        authDomain: "millionaireapp-be931.firebaseapp.com",
        projectId: "millionaireapp-be931",
        storageBucket: "millionaireapp-be931.firebasestorage.app",
        messagingSenderId: "325577904362",
        appId: "1:325577904362:web:8d85d4547bf22b1d8f4793"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    const storage = firebase.storage();

    function fixPhotoUrl(url) {
        if (!url) return "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23e2e8f0'/%3E%3Ctext x='50' y='67' font-size='60' text-anchor='middle' fill='%2394a3b8'%3E🦈%3C/text%3E%3C/svg%3E";
        if (url.startsWith('data:')) return url;
        if (url.includes('googleusercontent.com') || url.includes('ggpht.com')) {
            return url.replace(/=s[0-9]+(-c)?/, '=s50-c').replace(/=s[0-9]+/, '=s50');
        }
        return url;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const profileUid = urlParams.get('uid');

    const elements = {
        avatar: document.getElementById('profileAvatar'),
        nameDisplay: document.getElementById('profileNameDisplay'),
        nameInput: document.getElementById('profileNameInput'),
        email: document.getElementById('profileEmail'),
        bio: document.getElementById('profileBio'),
        bioInput: document.getElementById('profileBioInput'),
        about: document.getElementById('aboutBio'),
        posts: document.getElementById('userPostsContainer'),
        edit: document.getElementById('editProfileBtn'),
        save: document.getElementById('saveProfileBtn'),
        logout: document.getElementById('logoutBtn'),
        overlay: document.getElementById('avatarOverlay'),
        fileInput: document.getElementById('avatarFileInput'),
        avatarBox: document.getElementById('avatarBox'),
        header: document.getElementById('standaloneHeader'),
        container: document.getElementById('profileContainer'),
        closed: document.getElementById('closedAccountScreen')
    };

    // إعدادات الوضع
    const isStandalone = !window.engine && window.self === window.top;
    if (isStandalone) {
        elements.header.style.display = 'flex';
        elements.container.classList.add('px-4');
    } else {
        elements.header.style.display = 'none';
        elements.container.classList.add('px-0');
    }

    // تبديل التبويبات
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active','bg-gray-100'); b.classList.add('text-gray-500'); });
            btn.classList.add('active','bg-gray-100');
            btn.classList.remove('text-gray-500');
            document.getElementById('tab-posts').classList.toggle('hidden', btn.dataset.tab !== 'posts');
            document.getElementById('tab-about').classList.toggle('hidden', btn.dataset.tab !== 'about');
        });
    });

    function showClosed() {
        document.querySelector('.bg-white.rounded-2xl.shadow-xl.-mt-10').style.display = 'none';
        elements.closed.classList.remove('hidden');
    }

    function renderPosts(docsArray) {
        elements.posts.innerHTML = '';
        if (docsArray.length === 0) {
            elements.posts.innerHTML = '<p class="text-gray-400 text-sm text-center py-6">لا توجد منشورات بعد</p>';
            return;
        }
        docsArray.forEach(p => {
            const dateStr = p.createdAt?.toDate ? p.createdAt.toDate().toLocaleString('ar-EG') : '';
            const img = fixPhotoUrl(p.authorPhoto);
            const card = document.createElement('div');
            card.className = 'bg-white rounded-2xl p-3 shadow-sm border border-gray-100';
            card.innerHTML = `
                <div class="flex items-center gap-2 mb-2">
                    <img src="${img}" class="w-8 h-8 rounded-full border border-sky-200 object-cover">
                    <span class="font-bold text-gray-800 text-xs">${p.authorName || 'مستخدم'}</span>
                    <span class="text-[10px] text-gray-400 mr-auto">${dateStr}</span>
                </div>
                <p class="text-gray-700 text-xs leading-relaxed whitespace-pre-wrap">${p.content}</p>
            `;
            elements.posts.appendChild(card);
        });
    }

    // تحميل بروفايل عام
    async function loadPublicProfile(uid) {
        if (!uid || uid === 'undefined' || uid.trim() === '') return showClosed();
        elements.edit.style.display = 'none';
        elements.save.style.display = 'none';
        elements.logout.style.display = 'none';
        if (elements.overlay) elements.overlay.style.display = 'none';
        if (elements.fileInput) elements.fileInput.disabled = true;
        if (elements.avatarBox) elements.avatarBox.style.cursor = 'default';

        try {
            const userDoc = await db.collection("users").doc(uid).get();
            if (!userDoc.exists) return showClosed();
            const userData = userDoc.data();
            elements.nameDisplay.textContent = userData.displayName || 'مستخدم';
            elements.avatar.src = fixPhotoUrl(userData.photoURL);
            elements.bio.textContent = userData.bio || '';
            elements.about.textContent = userData.bio || '';
            elements.email.textContent = '';

            const snap = await db.collection("posts").where("authorId", "==", uid).get();
            const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            docs.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
            renderPosts(docs);
        } catch (e) {
            showClosed();
        }
    }

    // تحميل البروفايل الشخصي
    async function loadOwnProfile() {
        const user = auth.currentUser;
        if (!user) {
            window.location.href = "index.html";
            return;
        }
        try {
            const userDoc = await db.collection("users").doc(user.uid).get();
            const userData = userDoc.data() || {};
            const name = userData.displayName || user.displayName || 'مستخدم';
            elements.nameDisplay.textContent = name;
            elements.nameInput.value = name;
            elements.avatar.src = fixPhotoUrl(userData.photoURL || user.photoURL);
            elements.bio.textContent = userData.bio || '';
            elements.bioInput.value = userData.bio || '';
            elements.about.textContent = userData.bio || '🦈 مؤسس في Shark Hub';
            elements.email.textContent = user.email || '';

            const snap = await db.collection("posts").where("authorId", "==", user.uid).get();
            const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            docs.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
            renderPosts(docs);
        } catch (e) {
            elements.posts.innerHTML = '<p class="text-red-500 text-xs text-center py-6">حدث خطأ في تحميل البروفايل</p>';
        }
    }

    // ✅ تفعيل وضع التعديل
    elements.edit.addEventListener('click', () => {
        elements.nameDisplay.classList.add('hidden');
        elements.nameInput.classList.remove('hidden');
        elements.bio.classList.add('hidden');
        elements.bioInput.classList.remove('hidden');
        elements.edit.classList.add('hidden');
        elements.save.classList.remove('hidden');
    });

    // ✅ حفظ التعديلات
    elements.save.addEventListener('click', async () => {
        const user = auth.currentUser;
        if (!user) return;
        const newName = elements.nameInput.value.trim();
        const newBio = elements.bioInput.value.trim();
        if (!newName) {
            alert("الرجاء إدخال الاسم");
            return;
        }
        elements.save.disabled = true;
        try {
            // تحديث في Firestore
            await db.collection("users").doc(user.uid).set({
                displayName: newName,
                bio: newBio
            }, { merge: true });

            // تحديث الاسم في حساب المصادقة
            await user.updateProfile({ displayName: newName });

            // تحديث واجهة المستخدم
            elements.nameDisplay.textContent = newName;
            elements.bio.textContent = newBio || '';
            elements.about.textContent = newBio || '🦈 مؤسس في Shark Hub';

            // إخفاء الحقول والعودة للوضع الطبيعي
            elements.nameDisplay.classList.remove('hidden');
            elements.nameInput.classList.add('hidden');
            elements.bio.classList.remove('hidden');
            elements.bioInput.classList.add('hidden');
            elements.edit.classList.remove('hidden');
            elements.save.classList.add('hidden');
        } catch (error) {
            alert("فشل الحفظ: " + error.message);
        } finally {
            elements.save.disabled = false;
        }
    });

    // ✅ رفع الصورة الشخصية
    elements.avatarBox.addEventListener('click', () => {
        if (elements.edit.style.display !== 'none') { // فقط في البروفايل الشخصي
            elements.fileInput.click();
        }
    });

    elements.fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
            alert("الرجاء اختيار ملف صورة");
            return;
        }
        const user = auth.currentUser;
        if (!user) return;
        
        // إظهار مؤشر تحميل بسيط
        elements.avatar.style.opacity = '0.5';
        try {
            // رفع الصورة إلى Firebase Storage
            const storageRef = storage.ref(`avatars/${user.uid}/${Date.now()}_${file.name}`);
            const snapshot = await storageRef.put(file);
            const downloadURL = await snapshot.ref.getDownloadURL();

            // تحديث Firestore
            await db.collection("users").doc(user.uid).update({ photoURL: downloadURL });
            // تحديث حساب المصادقة
            await user.updateProfile({ photoURL: downloadURL });
            // تحديث الواجهة
            elements.avatar.src = fixPhotoUrl(downloadURL);
        } catch (error) {
            alert("فشل رفع الصورة: " + error.message);
        } finally {
            elements.avatar.style.opacity = '1';
            elements.fileInput.value = ''; // لتفعيل التغيير مرة أخرى
        }
    });

    // بدء التشغيل
    if (profileUid) {
        loadPublicProfile(profileUid);
    } else {
        auth.onAuthStateChanged(user => {
            if (user) loadOwnProfile();
            else window.location.href = "index.html";
        });
    }

    // تسجيل الخروج
    elements.logout.addEventListener('click', async () => {
        if (confirm("هل تريد مغادرة المحيط؟")) {
            await auth.signOut();
            window.location.href = "index.html";
        }
    });
</script>

</body>
</html>
