<!-- profile.html -->
<div class="max-w-2xl mx-auto px-4 pt-6 pb-20 space-y-6">
    <!-- غلاف البروفايل -->
    <div class="relative h-48 bg-gradient-to-b from-cyan-400 via-sky-500 to-blue-600 rounded-3xl overflow-hidden shadow-xl">
        <div class="absolute inset-0 opacity-30">
            <div class="w-4 h-4 bg-white rounded-full absolute top-8 left-10 animate-ping"></div>
            <div class="w-6 h-6 bg-white rounded-full absolute top-16 right-16 animate-bounce"></div>
            <div class="w-3 h-3 bg-white rounded-full absolute bottom-12 left-1/3 animate-pulse"></div>
            <div class="w-5 h-5 bg-white rounded-full absolute top-24 left-1/2 animate-bounce" style="animation-delay: 0.2s;"></div>
        </div>
        <div class="absolute inset-0 flex flex-col items-center justify-center text-white px-4">
            <div class="text-5xl sm:text-7xl mb-1 drop-shadow-lg" style="animation: swim 3s ease-in-out infinite alternate;">🦈</div>
            <h1 class="text-xl sm:text-3xl font-black tracking-widest text-center" style="animation: glow 2s ease-in-out infinite alternate;">SHARK UP</h1>
        </div>
    </div>

    <!-- بطاقة المعلومات -->
    <div class="bg-white rounded-3xl shadow-xl -mt-10 px-5 pt-8 pb-6">
        <div class="flex flex-col items-start">
            <!-- صورة البروفايل -->
            <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-2xl border-4 border-white shadow-lg overflow-hidden bg-white relative -mt-16 group">
                <img id="profileAvatar" class="w-full h-full object-cover" src="" alt="صورتي">
                <div id="avatarOverlay" class="absolute inset-0 bg-black/30 hidden group-hover:flex items-center justify-center text-white cursor-pointer text-2xl">
                    <i class="fa-solid fa-camera"></i>
                </div>
                <input type="file" id="avatarFileInput" accept="image/*" class="hidden">
            </div>

            <!-- الاسم والشارة -->
            <div class="mt-3 flex items-center gap-2 flex-wrap">
                <h1 id="profileName" class="text-xl sm:text-2xl font-black text-gray-800">جار التحميل...</h1>
                <span class="text-xl">🦈</span>
                <span class="bg-sky-500 text-white text-[10px] sm:text-xs px-2 py-0.5 rounded-full font-bold"><i class="fa-solid fa-shield-check"></i> موثّق</span>
            </div>
        </div>

        <!-- البريد والبيو -->
        <div class="mt-3 text-right">
            <p id="profileEmail" class="text-xs text-gray-500"></p>
            <p id="profileBio" class="text-xs text-gray-600 mt-1 max-w-md"></p>

            <!-- أزرار الإجراءات -->
            <div class="flex justify-start gap-2 mt-3 flex-wrap">
                <button id="editProfileBtn" class="bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-1.5 px-4 rounded-lg text-xs"><i class="fa-solid fa-pen-to-square"></i> تعديل</button>
                <button id="saveProfileBtn" class="bg-sky-500 hover:bg-sky-600 text-white font-bold py-1.5 px-4 rounded-lg text-xs hidden"><i class="fa-solid fa-check"></i> حفظ</button>
                <button id="logoutBtn" class="bg-white border border-red-200 text-red-500 hover:bg-red-50 font-bold py-1.5 px-4 rounded-lg text-xs"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
                <button id="backBtn" class="bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-1.5 px-4 rounded-lg text-xs hidden"><i class="fa-solid fa-arrow-right"></i> رجوع</button>
            </div>
        </div>

        <!-- تبويبات -->
        <div class="flex gap-1 mt-6 border-b pb-2 overflow-x-auto">
            <button class="tab-btn active font-bold text-xs px-3 py-2 rounded-lg bg-gray-100" data-tab="posts">📄 المنشورات</button>
            <button class="tab-btn font-bold text-xs px-3 py-2 rounded-lg text-gray-500" data-tab="about">ℹ️ عني</button>
        </div>

        <!-- المحتوى -->
        <div class="mt-4">
            <div id="tab-posts">
                <div id="userPostsContainer" class="space-y-3">
                    <div class="text-center py-10 text-gray-400">
                        <div class="w-8 h-8 border-4 border-sky-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                        <p class="mt-2 text-xs">جاري تحميل المنشورات...</p>
                    </div>
                </div>
            </div>
            <div id="tab-about" class="hidden">
                <div class="bg-gray-50 rounded-xl p-4">
                    <p class="font-bold mb-2 text-sm">نبذة عني</p>
                    <p id="aboutBio" class="text-xs text-gray-600">🦈 مؤسس في Shark Hub</p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    @keyframes swim { 0% { transform: translateX(-10px) rotate(-3deg); } 100% { transform: translateX(10px) rotate(3deg); } }
    @keyframes glow { 0% { text-shadow: 0 0 5px rgba(255,255,255,0.6); } 100% { text-shadow: 0 0 20px rgba(255,255,255,0.9), 0 0 30px rgba(14,165,233,0.7); } }
    .tab-btn.active { background: #0ea5e9; color: white; }
</style>

<script>
    (function() {
        // ننتظر تحميل Firebase (قد يكون موجوداً من app.js أو نحمله احتياطياً)
        function waitForFirebase(callback) {
            if (window.firebase && window.firebase.firestore) {
                callback();
            } else {
                // تحميل Firebase compat إذا لم يكن موجوداً
                const scripts = [
                    "https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js",
                    "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js",
                    "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"
                ];
                let loaded = 0;
                scripts.forEach(src => {
                    if (!document.querySelector(`script[src="${src}"]`)) {
                        const s = document.createElement('script');
                        s.src = src;
                        s.onload = () => { loaded++; if (loaded === scripts.length) initFirebase(callback); };
                        document.head.appendChild(s);
                    } else {
                        loaded++;
                        if (loaded === scripts.length) initFirebase(callback);
                    }
                });
            }
        }

        function initFirebase(callback) {
            const firebaseConfig = {
                apiKey: "AIzaSyB_2ms4K8EPbag7uab9gbDy8eePY6xwpxc",
                authDomain: "millionaireapp-be931.firebaseapp.com",
                projectId: "millionaireapp-be931",
                storageBucket: "millionaireapp-be931.firebasestorage.app",
                messagingSenderId: "325577904362",
                appId: "1:325577904362:web:8d85d4547bf22b1d8f4793"
            };
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            window.db = firebase.firestore();
            window.auth = firebase.auth();
            callback();
        }

        function fixPhotoUrl(url) {
            if (!url) return "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23e2e8f0'/%3E%3Ctext x='50' y='67' font-size='60' text-anchor='middle' fill='%2394a3b8'%3E🦈%3C/text%3E%3C/svg%3E";
            if (url.startsWith('data:')) return url;
            if (url.includes('googleusercontent.com') || url.includes('ggpht.com')) {
                return url.replace(/=s[0-9]+(-c)?/, '=s50-c').replace(/=s[0-9]+/, '=s50');
            }
            return url;
        }

        function run() {
            const db = window.db;
            const auth = window.auth;

            const urlParams = new URLSearchParams(window.location.search);
            const profileUid = urlParams.get('uid');

            const avatarImg = document.getElementById('profileAvatar');
            const nameEl = document.getElementById('profileName');
            const emailEl = document.getElementById('profileEmail');
            const bioEl = document.getElementById('profileBio');
            const aboutEl = document.getElementById('aboutBio');
            const postsContainer = document.getElementById('userPostsContainer');
            const editBtn = document.getElementById('editProfileBtn');
            const saveBtn = document.getElementById('saveProfileBtn');
            const logoutBtn = document.getElementById('logoutBtn');
            const backBtn = document.getElementById('backBtn');
            const avatarOverlay = document.getElementById('avatarOverlay');
            const avatarFileInput = document.getElementById('avatarFileInput');

            // تبديل التبويبات
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active','bg-gray-100'); b.classList.add('text-gray-500'); });
                    btn.classList.add('active','bg-gray-100');
                    btn.classList.remove('text-gray-500');
                    document.getElementById('tab-posts').classList.toggle('hidden', btn.dataset.tab !== 'posts');
                    document.getElementById('tab-about').classList.toggle('hidden', btn.dataset.tab !== 'about');
                });
            });

            // تحميل بروفايل عام
            async function loadPublicProfile(uid) {
                editBtn.style.display = 'none';
                saveBtn.style.display = 'none';
                logoutBtn.style.display = 'none';
                if (avatarOverlay) avatarOverlay.style.display = 'none';
                if (avatarFileInput) avatarFileInput.disabled = true;
                backBtn.style.display = 'inline-flex';
                backBtn.onclick = () => window.history.back();

                try {
                    const userDoc = await db.collection("users").doc(uid).get();
                    if (!userDoc.exists) {
                        alert("المستخدم غير موجود");
                        window.location.href = "index.html";
                        return;
                    }
                    const userData = userDoc.data();
                    nameEl.textContent = userData.displayName || 'مستخدم';
                    avatarImg.src = fixPhotoUrl(userData.photoURL);
                    bioEl.textContent = userData.bio || '';
                    aboutEl.textContent = userData.bio || '';
                    emailEl.textContent = '';

                    const snapshot = await db.collection("posts")
                        .where("authorId", "==", uid)
                        .orderBy("createdAt", "desc")
                        .get();

                    postsContainer.innerHTML = '';
                    if (snapshot.empty) {
                        postsContainer.innerHTML = '<p class="text-gray-400 text-sm text-center py-8">لا توجد منشورات بعد</p>';
                        return;
                    }
                    snapshot.forEach(docSnap => {
                        const p = docSnap.data();
                        const dateStr = p.createdAt?.toDate().toLocaleString('ar-EG') || '';
                        const img = fixPhotoUrl(p.authorPhoto);
                        const card = document.createElement('div');
                        card.className = 'bg-white rounded-2xl p-4 mb-3 shadow-sm';
                        card.innerHTML = `
                            <div class="flex items-center gap-2 mb-2">
                                <img src="${img}" class="w-10 h-10 rounded-full border border-sky-200 object-cover">
                                <span class="font-extrabold text-gray-800 text-sm">${p.authorName || 'مستخدم'}</span>
                                <span class="text-xs text-gray-400">${dateStr}</span>
                            </div>
                            <p class="text-gray-700 text-sm leading-relaxed whitespace-pre-wrap">${p.content}</p>
                        `;
                        postsContainer.appendChild(card);
                    });
                } catch (e) {
                    postsContainer.innerHTML = '<p class="text-red-500 text-sm text-center py-8">حدث خطأ في تحميل البروفايل</p>';
                }
            }

            // تحميل البروفايل الشخصي
            async function loadOwnProfile() {
                try {
                    const user = auth.currentUser;
                    if (!user) {
                        window.location.href = "index.html";
                        return;
                    }
                    const userDoc = await db.collection("users").doc(user.uid).get();
                    const userData = userDoc.data() || {};
                    avatarImg.src = fixPhotoUrl(userData.photoURL || user.photoURL);
                    nameEl.textContent = userData.displayName || user.displayName || 'مستخدم';
                    bioEl.textContent = userData.bio || '';
                    aboutEl.textContent = userData.bio || '';
                    emailEl.textContent = user.email || '';

                    // استدعاء دوال engine الخاصة بالبروفايل إن وجدت
                    if (window.engine && window.engine.listenToProfilePosts) {
                        window.engine.listenToProfilePosts('userPostsContainer');
                        window.engine.activateProfile?.();
                    } else {
                        // عرض بسيط لمنشورات المستخدم الحالي
                        const snapshot = await db.collection("posts")
                            .where("authorId", "==", user.uid)
                            .orderBy("createdAt", "desc")
                            .get();
                        postsContainer.innerHTML = '';
                        if (snapshot.empty) {
                            postsContainer.innerHTML = '<p class="text-gray-400 text-sm text-center py-8">لا توجد منشورات بعد</p>';
                            return;
                        }
                        snapshot.forEach(docSnap => {
                            const p = docSnap.data();
                            const dateStr = p.createdAt?.toDate().toLocaleString('ar-EG') || '';
                            const img = fixPhotoUrl(p.authorPhoto);
                            const card = document.createElement('div');
                            card.className = 'bg-white rounded-2xl p-4 mb-3 shadow-sm';
                            card.innerHTML = `
                                <div class="flex items-center gap-2 mb-2">
                                    <img src="${img}" class="w-10 h-10 rounded-full border border-sky-200 object-cover">
                                    <span class="font-extrabold text-gray-800 text-sm">${p.authorName || 'مستخدم'}</span>
                                    <span class="text-xs text-gray-400">${dateStr}</span>
                                </div>
                                <p class="text-gray-700 text-sm leading-relaxed whitespace-pre-wrap">${p.content}</p>
                            `;
                            postsContainer.appendChild(card);
                        });
                    }
                } catch (e) {
                    postsContainer.innerHTML = '<p class="text-red-500 text-sm text-center py-8">حدث خطأ في تحميل البروفايل</p>';
                }
            }

            if (profileUid) {
                loadPublicProfile(profileUid);
            } else {
                // إذا لم يكن هناك uid، قد نكون داخل التطبيق (SPA) وننتظر engine
                if (window.engine) {
                    // engine سيتولى المهمة، لكننا نجهز الأساسيات
                    auth.onAuthStateChanged(user => {
                        if (user) {
                            // نترك engine يشغل الاستماع
                            window.engine.getOrCreateUserProfile?.().then(profile => {
                                avatarImg.src = fixPhotoUrl(profile.photoURL || user.photoURL);
                                nameEl.textContent = profile.displayName || user.displayName || 'مستخدم';
                                bioEl.textContent = profile.bio || '';
                                aboutEl.textContent = profile.bio || '';
                                emailEl.textContent = user.email || '';
                            });
                        }
                    });
                } else {
                    // لا engine، نحمّل البروفايل الشخصي مباشرة
                    auth.onAuthStateChanged(user => {
                        if (user) loadOwnProfile();
                    });
                }
            }
        }

        waitForFirebase(run);
    })();
</script>
