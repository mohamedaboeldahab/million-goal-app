<!-- غلاف المحيط (أنيق، بتدرج سماوي مع فقاعات) -->
<div class="relative h-48 sm:h-72 bg-gradient-to-br from-cyan-400 via-sky-500 to-blue-500 overflow-hidden">
    <!-- فقاعات متحركة -->
    <div class="absolute inset-0 opacity-30">
        <span class="bubble" style="--size:6rem; --duration:8s; --left:10%;"></span>
        <span class="bubble" style="--size:4rem; --duration:12s; --left:30%; animation-delay: -2s;"></span>
        <span class="bubble" style="--size:8rem; --duration:10s; --left:60%; animation-delay: -4s;"></span>
        <span class="bubble" style="--size:3rem; --duration:7s; --left:80%; animation-delay: -1s;"></span>
        <span class="bubble" style="--size:5rem; --duration:11s; --left:50%; animation-delay: -3s;"></span>
    </div>
    <!-- سمكة قرش تسبح -->
    <div class="absolute bottom-4 right-4 text-5xl sm:text-7xl filter drop-shadow-lg" style="animation: swimShark 6s ease-in-out infinite alternate;">
        🦈
    </div>
    <style>
        .bubble {
            display: block;
            width: var(--size);
            height: var(--size);
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            position: absolute;
            bottom: -20%;
            left: var(--left);
            animation: floatUp var(--duration) linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 0.7; }
            100% { transform: translateY(-120vh) scale(0.5); opacity: 0; }
        }
        @keyframes swimShark {
            0% { transform: translateX(0) rotate(-2deg); }
            100% { transform: translateX(-40px) rotate(2deg); }
        }
    </style>
</div>

<!-- قسم المعلومات -->
<div class="bg-white rounded-b-2xl shadow-md -mt-16 sm:-mt-24 px-4 pb-6 pt-20 sm:pt-28 relative">
    <!-- صورة بروفايل كبيرة مع شارة التوثيق -->
    <div class="absolute -top-16 sm:-top-24 right-6 w-28 h-28 sm:w-36 sm:h-36 rounded-full border-4 border-white shadow-xl overflow-hidden bg-white group">
        <img id="profileAvatar" class="w-full h-full object-cover" src="" alt="صورة المستخدم">
        <div id="avatarOverlay" class="absolute inset-0 bg-black/40 hidden group-hover:flex items-center justify-center text-white cursor-pointer text-sm transition">
            <i class="fa-solid fa-camera"></i>
        </div>
        <input type="file" id="avatarFileInput" accept="image/*" class="hidden">
        <!-- شارة التوثيق (سمكة ذهبية) -->
        <span class="absolute bottom-1 right-1 bg-yellow-400 text-white text-xs w-6 h-6 rounded-full flex items-center justify-center shadow-md border-2 border-white" title="حساب موثق">
            🐟
        </span>
    </div>

    <!-- الاسم والبايو وأزرار التحكم -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <div>
            <div class="flex items-center gap-2">
                <h1 id="profileName" class="text-2xl sm:text-3xl font-black text-gray-800" contenteditable="false">اسم المستخدم</h1>
                <!-- أيقونة توثيق ثانية بجانب الاسم -->
                <span class="bg-sky-100 text-sky-600 text-xs px-2 py-0.5 rounded-full font-bold flex items-center gap-1">
                    <i class="fa-solid fa-check-circle"></i> موثوق
                </span>
            </div>
            <p id="profileEmail" class="text-sm text-gray-500 mt-1"></p>
            <p id="profileBio" class="text-sm text-gray-600 mt-2 max-w-lg" contenteditable="false">🦈 مؤسس في Shark Hub</p>
        </div>
        <div class="flex gap-2">
            <button id="editProfileBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2.5 px-5 rounded-lg text-sm transition flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square"></i> تعديل
            </button>
            <button id="saveProfileBtn" class="bg-sky-500 hover:bg-sky-600 text-white font-bold py-2.5 px-5 rounded-lg text-sm transition hidden flex items-center gap-2">
                <i class="fa-solid fa-check"></i> حفظ
            </button>
            <button onclick="engine.logout()" class="bg-white border border-red-200 text-red-500 hover:bg-red-50 font-bold py-2.5 px-5 rounded-lg text-sm transition flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-right-from-bracket"></i> خروج
            </button>
        </div>
    </div>

    <!-- تبويبات -->
    <div class="flex gap-1 mt-6 border-b pb-2 overflow-x-auto" id="profileTabs">
        <button class="tab-btn active font-bold text-sm px-4 py-2 rounded-lg bg-gray-100" data-tab="posts">📄 المنشورات</button>
        <button class="tab-btn font-bold text-sm px-4 py-2 rounded-lg text-gray-500 hover:bg-gray-100" data-tab="about">ℹ️ عني</button>
        <button class="tab-btn font-bold text-sm px-4 py-2 rounded-lg text-gray-500 hover:bg-gray-100" data-tab="friends">👥 الأصدقاء</button>
        <button class="tab-btn font-bold text-sm px-4 py-2 rounded-lg text-gray-500 hover:bg-gray-100" data-tab="photos">🖼️ صور</button>
    </div>

    <!-- محتوى التبويبات -->
    <div class="mt-4">
        <div id="tab-posts" class="tab-content">
            <div id="userPostsContainer" class="space-y-3">
                <div class="text-center py-10 text-gray-400">
                    <div class="w-8 h-8 border-4 border-sky-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                    <p class="mt-2 text-sm">جاري تحميل المنشورات...</p>
                </div>
            </div>
        </div>
        <div id="tab-about" class="tab-content hidden">
            <div class="bg-gray-50 rounded-xl p-4">
                <p class="font-bold mb-2">نبذة عني</p>
                <p id="aboutBio" class="text-sm text-gray-600"></p>
            </div>
        </div>
        <div id="tab-friends" class="tab-content hidden"><p class="text-gray-400 text-sm">لا يوجد أصدقاء بعد</p></div>
        <div id="tab-photos" class="tab-content hidden"><p class="text-gray-400 text-sm">لا توجد صور</p></div>
    </div>
</div>

<script>
    (() => {
        // === إدارة التبويبات ===
        const tabs = document.querySelectorAll('.tab-btn');
        const panes = document.querySelectorAll('.tab-content');
        tabs.forEach(btn => {
            btn.addEventListener('click', () => {
                tabs.forEach(b => { b.classList.remove('active','bg-gray-100'); b.classList.add('text-gray-500'); });
                btn.classList.add('active','bg-gray-100');
                btn.classList.remove('text-gray-500');
                const target = btn.dataset.tab;
                panes.forEach(p => p.classList.add('hidden'));
                document.getElementById(`tab-${target}`).classList.remove('hidden');
            });
        });

        // === جلب البيانات من localStorage (مخصص) أو من Google ===
        function getCustomData() {
            return {
                name: localStorage.getItem('sharkhub_name'),
                bio: localStorage.getItem('sharkhub_bio'),
                photo: localStorage.getItem('sharkhub_photo')
            };
        }

        function loadUserData() {
            const user = window.auth?.currentUser;
            if (!user) return false;
            const custom = getCustomData();
            
            // الصورة: custom > Google > افتراضية
            const avatar = document.getElementById('profileAvatar');
            const photoSrc = custom.photo || user.photoURL;
            avatar.src = photoSrc || '';
            
            // الاسم: custom > Google
            const nameEl = document.getElementById('profileName');
            nameEl.textContent = custom.name || user.displayName || 'مستخدم';
            
            // البريد
            document.getElementById('profileEmail').textContent = user.email || '';
            
            // البايو
            const bioEl = document.getElementById('profileBio');
            const aboutEl = document.getElementById('aboutBio');
            bioEl.textContent = custom.bio || '🦈 مؤسس في Shark Hub';
            aboutEl.textContent = bioEl.textContent;
            
            return true;
        }

        if (!loadUserData()) {
            let attempts = 0;
            const interval = setInterval(() => {
                if (loadUserData() || ++attempts > 10) clearInterval(interval);
            }, 300);
        }

        // === تشغيل مستمع المنشورات ===
        if (window.engine && typeof window.engine.listenToUserPosts === 'function') {
            window.engine.listenToUserPosts('userPostsContainer');
        } else {
            document.getElementById('userPostsContainer').innerHTML = '<p class="text-red-500 text-sm">خاصية المنشورات غير متاحة حالياً</p>';
        }

        // === تحميل صورة جديدة من الجهاز ===
        const avatarOverlay = document.getElementById('avatarOverlay');
        const avatarFileInput = document.getElementById('avatarFileInput');
        const avatarImg = document.getElementById('profileAvatar');

        avatarOverlay.addEventListener('click', () => {
            avatarFileInput.click();
        });

        avatarFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = () => {
                const dataUrl = reader.result;
                avatarImg.src = dataUrl;
                localStorage.setItem('sharkhub_photo', dataUrl);
                showToast('تم تحديث الصورة ✅');
            };
            reader.readAsDataURL(file);
        });

        // === تحرير الاسم والبايو ===
        const editBtn = document.getElementById('editProfileBtn');
        const saveBtn = document.getElementById('saveProfileBtn');
        const nameEl = document.getElementById('profileName');
        const bioEl = document.getElementById('profileBio');
        const aboutBioEl = document.getElementById('aboutBio');

        editBtn.addEventListener('click', () => {
            nameEl.contentEditable = 'true';
            bioEl.contentEditable = 'true';
            nameEl.classList.add('bg-yellow-50','px-2','rounded');
            bioEl.classList.add('bg-yellow-50','px-2','rounded');
            editBtn.classList.add('hidden');
            saveBtn.classList.remove('hidden');
        });

        saveBtn.addEventListener('click', () => {
            nameEl.contentEditable = 'false';
            bioEl.contentEditable = 'false';
            nameEl.classList.remove('bg-yellow-50','px-2','rounded');
            bioEl.classList.remove('bg-yellow-50','px-2','rounded');
            saveBtn.classList.add('hidden');
            editBtn.classList.remove('hidden');
            
            // حفظ في localStorage
            localStorage.setItem('sharkhub_name', nameEl.textContent.trim());
            localStorage.setItem('sharkhub_bio', bioEl.textContent.trim());
            aboutBioEl.textContent = bioEl.textContent;
            showToast('تم حفظ التغييرات ✅');
        });

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-4 left-4 bg-gray-800 text-white px-4 py-2 rounded-lg text-sm z-50 animate-pulse';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }
    })();
</script>
