<div class="p-4 text-right" dir="rtl">
    <div class="bg-white rounded-2xl p-4 mb-6 shadow-sm">
        <div class="flex flex-col items-center">
            <div class="relative">
                <img id="profileAvatar" class="w-24 h-24 rounded-full border-4 border-sky-200 object-cover" src="" alt="صورة">
                <div id="avatarOverlay" class="absolute inset-0 bg-black/50 rounded-full flex items-center justify-center opacity-0 hover:opacity-100 transition cursor-pointer">
                    <i class="fa-solid fa-camera text-white text-xl"></i>
                </div>
                <input type="file" id="avatarFileInput" class="hidden" accept="image/*">
            </div>
            <h2 id="profileName" class="text-xl font-bold mt-3">...</h2>
            <p id="profileEmail" class="text-gray-500 text-sm">...</p>
            <p id="profileBio" class="text-gray-600 text-sm mt-2 text-center">🦈 عضو في Shark Up</p>
            <div id="profileActions" class="flex gap-2 mt-4 flex-wrap justify-center"></div>
        </div>
    </div>

    <div class="flex gap-2 mb-4 border-b border-gray-200">
        <button class="tab-btn flex-1 py-2 font-bold text-sm text-gray-500" data-tab="posts">📝 المنشورات</button>
        <button class="tab-btn flex-1 py-2 font-bold text-sm text-gray-500" data-tab="about">ℹ️ عني</button>
        <button id="friendsTabBtn" class="tab-btn flex-1 py-2 font-bold text-sm text-gray-500" data-tab="friends">👥 الأصدقاء</button>
    </div>

    <div id="tab-posts" class="tab-content">
        <div id="userPostsContainer"></div>
    </div>
    <div id="tab-about" class="tab-content hidden">
        <div class="bg-white rounded-2xl p-4">
            <h3 class="font-bold mb-2">نبذة عني</h3>
            <p id="aboutBio" class="text-gray-600">لا توجد معلومات</p>
        </div>
    </div>
    <div id="tab-friends" class="tab-content hidden">
        <div class="bg-white rounded-2xl p-4">
            <h2 class="text-lg font-bold mb-4">📨 طلبات الصداقة</h2>
            <div id="friendRequestsList" class="space-y-3 mb-6">
                <p class="text-gray-400 text-sm text-center">جاري التحميل...</p>
            </div>
            <h2 class="text-lg font-bold mb-4">👥 أصدقائي</h2>
            <div id="friendsList" class="space-y-3">
                <p class="text-gray-400 text-sm text-center">جاري التحميل...</p>
            </div>
        </div>
    </div>
</div>
