<!-- ========== غلاف محيطي ========== -->
<div class="relative h-60 sm:h-72 bg-gradient-to-b from-cyan-400 via-sky-500 to-blue-600 overflow-hidden">
    <div class="absolute inset-0 opacity-30">
        <div class="bubble w-4 h-4 bg-white rounded-full absolute top-8 left-10 animate-ping"></div>
        <div class="bubble w-6 h-6 bg-white rounded-full absolute top-16 right-16 animate-bounce"></div>
        <div class="bubble w-3 h-3 bg-white rounded-full absolute bottom-12 left-1/3 animate-pulse"></div>
        <div class="bubble w-5 h-5 bg-white rounded-full absolute top-24 left-1/2 animate-bounce delay-200"></div>
    </div>
    <div class="absolute bottom-0 left-0 w-full">
        <svg class="wave wave1" viewBox="0 0 1440 120" preserveAspectRatio="none">
            <path fill="rgba(255,255,255,0.4)" d="M0,60 C240,120 480,0 720,60 C960,120 1200,0 1440,60 L1440,120 L0,120 Z"></path>
        </svg>
        <svg class="wave wave2" viewBox="0 0 1440 120" preserveAspectRatio="none">
            <path fill="rgba(255,255,255,0.2)" d="M0,80 C240,40 480,120 720,80 C960,40 1200,120 1440,80 L1440,120 L0,120 Z"></path>
        </svg>
    </div>
    <div class="absolute inset-0 flex flex-col items-center justify-center text-white">
        <div class="text-7xl sm:text-8xl mb-2 drop-shadow-lg" style="animation: swim 3s ease-in-out infinite alternate;">🦈</div>
        <h1 class="text-3xl sm:text-4xl font-black tracking-widest" style="animation: glow 2s ease-in-out infinite alternate;">SHARK UP</h1>
    </div>
</div>

<style>
@keyframes swim { 0% { transform: translateX(-10px) rotate(-3deg); } 100% { transform: translateX(10px) rotate(3deg); } }
@keyframes glow { 0% { text-shadow: 0 0 5px rgba(255,255,255,0.6); } 100% { text-shadow: 0 0 20px rgba(255,255,255,0.9), 0 0 30px rgba(14,165,233,0.7); } }
.wave { animation: moveWave 8s linear infinite; }
.wave2 { animation: moveWave 12s linear infinite reverse; }
@keyframes moveWave { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
</style>

<!-- ========== معلومات البروفايل (RTL – مُحسّنة للجوال) ========== -->
<div dir="rtl" class="bg-white rounded-t-3xl shadow-xl -mt-8 sm:-mt-10 px-4 pb-6 pt-4 relative">
    <!-- صف الصورة والبيانات: عامودي على الجوال، أفقي على الكمبيوتر -->
    <div class="flex flex-col sm:flex-row items-center sm:items-start gap-4">
        <!-- الصورة (في الوسط على الجوال، على اليمين على سطح المكتب) -->
        <div class="w-28 h-28 sm:w-32 sm:h-32 rounded-2xl border-4 border-white shadow-lg overflow-hidden bg-white group flex-shrink-0 relative -mt-16 sm:-mt-20 mx-auto sm:mx-0">
            <img id="profileAvatar" class="w-full h-full object-cover" src="" alt="صورتي">
            <div id="avatarOverlay" class="absolute inset-0 bg-black/30 hidden group-hover:flex items-center justify-center text-white cursor-pointer text-2xl">
                <i class="fa-solid fa-camera"></i>
            </div>
            <input type="file" id="avatarFileInput" accept="image/*" class="hidden">
        </div>

        <!-- البيانات (تحت الصورة على الجوال، يمين على سطح المكتب) -->
        <div class="flex-1 text-center sm:text-right mt-2 sm:mt-0">
            <div class="flex items-center justify-center sm:justify-start gap-2">
                <h1 id="profileName" class="text-2xl sm:text-3xl font-black text-gray-800" contenteditable="false">جار التحميل...</h1>
                <span class="bg-sky-500 text-white text-xs px-2 py-0.5 rounded-full flex items-center gap-1 font-bold">
                    <i class="fa-solid fa-shield-check"></i> موثّق
                </span>
            </div>
            <p id="profileEmail" class="text-sm text-gray-500"></p>
            <p id="profileBio" class="text-sm text-gray-600 mt-1 max-w-md" contenteditable="false"></p>

            <!-- أزرار التحكم -->
            <div class="flex justify-center sm:justify-start gap-2 mt-3">
                <button id="editProfileBtn" class="bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-2 px-5 rounded-lg text-sm transition flex items-center gap-1">
                    <i class="fa-solid fa-pen-to-square"></i> تعديل
                </button>
                <button id="saveProfileBtn" class="bg-sky-500 hover:bg-sky-600 text-white font-bold py-2 px-5 rounded-lg text-sm transition hidden flex items-center gap-1">
                    <i class="fa-solid fa-check"></i> حفظ
                </button>
                <button onclick="engine.logout()" class="bg-white border border-red-200 text-red-500 hover:bg-red-50 font-bold py-2 px-5 rounded-lg text-sm transition flex items-center gap-1 shadow-sm">
                    <i class="fa-solid fa-right-from-bracket"></i> خروج
                </button>
            </div>
        </div>
    </div>

    <!-- تبويبات -->
    <div class="flex gap-1 mt-6 border-b pb-2 overflow-x-auto justify-start">
        <button class="tab-btn active font-bold text-sm px-4 py-2 rounded-lg bg-gray-100" data-tab="posts">📄 المنشورات</button>
        <button class="tab-btn font-bold text-sm px-4 py-2 rounded-lg text-gray-500 hover:bg-gray-100" data-tab="about">ℹ️ عني</button>
    </div>

    <!-- محتوى التبويبات -->
    <div class="mt-4">
        <div id="tab-posts">
            <div id="userPostsContainer" class="space-y-3">
                <div class="text-center py-10 text-gray-400">
                    <div class="w-8 h-8 border-4 border-sky-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                    <p class="mt-2 text-sm">جاري تحميل المنشورات...</p>
                </div>
            </div>
        </div>
        <div id="tab-about" class="hidden">
            <div class="bg-gray-50 rounded-xl p-4">
                <p class="font-bold mb-2">نبذة عني</p>
                <p id="aboutBio" class="text-sm text-gray-600"></p>
            </div>
        </div>
    </div>
</div>

<script>
(() => {
    // التبويبات
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active','bg-gray-100'); b.classList.add('text-gray-500'); });
            btn.classList.add('active','bg-gray-100');
            btn.classList.remove('text-gray-500');
            const target = btn.dataset.tab;
            document.getElementById('tab-posts').classList.toggle('hidden', target !== 'posts');
            document.getElementById('tab-about').classList.toggle('hidden', target !== 'about');
        });
    });

    const avatarImg = document.getElementById('profileAvatar');
    const nameEl = document.getElementById('profileName');
    const emailEl = document.getElementById('profileEmail');
    const bioEl = document.getElementById('profileBio');
    const aboutEl = document.getElementById('aboutBio');
    const editBtn = document.getElementById('editProfileBtn');
    const saveBtn = document.getElementById('saveProfileBtn');
    const avatarInput = document.getElementById('avatarFileInput');
    const avatarOverlay = document.getElementById('avatarOverlay');

    async function loadProfile() {
        let profile = null;
        try { profile = await window.engine?.getOrCreateUserProfile(); } catch(e) {}
        const u = window.auth?.currentUser;
        const defName = u?.displayName || 'مستخدم';
        const defPhoto = u?.photoURL || '';
        const defEmail = u?.email || '';
        const locName = localStorage.getItem('sharkhub_name');
        const locBio = localStorage.getItem('sharkhub_bio');
        const locPhoto = localStorage.getItem('sharkhub_photo');

        avatarImg.src = profile?.photoURL || locPhoto || defPhoto;
        nameEl.textContent = profile?.displayName || locName || defName;
        const bio = profile?.bio || locBio || '🦈 مؤسس في Shark Hub';
        bioEl.textContent = bio;
        aboutEl.textContent = bio;
        emailEl.textContent = defEmail;

        localStorage.setItem('sharkhub_name', nameEl.textContent);
        localStorage.setItem('sharkhub_bio', bio);
        localStorage.setItem('sharkhub_photo', avatarImg.src);
    }
    loadProfile();

    // المنشورات
    if (window.engine?.listenToUserPosts) {
        window.engine.listenToUserPosts('userPostsContainer');
    } else {
        document.getElementById('userPostsContainer').innerHTML = '<p class="text-red-500 text-sm">تعذر تحميل المنشورات</p>';
    }

    // تغيير الصورة مباشرة
    avatarOverlay.addEventListener('click', () => avatarInput.click());
    avatarInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async () => {
            const dataUrl = reader.result;
            avatarImg.src = dataUrl;
            let ok = false;
            try { await window.engine.updateUserProfile({ photoURL: dataUrl }); ok = true; } catch(e) {}
            localStorage.setItem('sharkhub_photo', dataUrl);
            showToast(ok ? 'تم تغيير الصورة وحفظها ☁️' : 'تم تغيير الصورة (محلياً) ⚠️');
        };
        reader.readAsDataURL(file);
    });

    // تعديل الاسم والوصف
    editBtn.addEventListener('click', () => {
        nameEl.contentEditable = 'true';
        bioEl.contentEditable = 'true';
        nameEl.classList.add('bg-yellow-50','px-2','rounded','outline-none');
        bioEl.classList.add('bg-yellow-50','px-2','rounded','outline-none');
        editBtn.classList.add('hidden');
        saveBtn.classList.remove('hidden');
    });
    saveBtn.addEventListener('click', async () => {
        nameEl.contentEditable = 'false';
        bioEl.contentEditable = 'false';
        nameEl.classList.remove('bg-yellow-50','px-2','rounded','outline-none');
        bioEl.classList.remove('bg-yellow-50','px-2','rounded','outline-none');
        editBtn.classList.remove('hidden');
        saveBtn.classList.add('hidden');
        const n = nameEl.textContent.trim();
        const b = bioEl.textContent.trim();
        let ok = false;
        try { await window.engine.updateUserProfile({ displayName: n, bio: b }); ok = true; } catch(e) {}
        localStorage.setItem('sharkhub_name', n);
        localStorage.setItem('sharkhub_bio', b);
        aboutEl.textContent = b;
        showToast(ok ? 'تم حفظ البيانات ☁️' : 'تم حفظ البيانات محلياً ⚠️');
    });

    function showToast(m){
        const t = document.createElement('div');
        t.className = 'fixed bottom-4 right-4 bg-gray-800 text-white px-4 py-2 rounded-lg text-sm z-50 shadow-lg animate-pulse';
        t.textContent = m;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2500);
    }
})();
</script>
