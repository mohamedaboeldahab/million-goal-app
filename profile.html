<div dir="rtl" class="bg-white rounded-t-3xl shadow-xl -mt-8 px-4 pb-6 pt-4">
    <div class="flex flex-col items-start">
        <div class="w-28 h-28 rounded-2xl border-4 border-white shadow-lg overflow-hidden bg-white group relative -mt-16">
            <img id="profileAvatar" class="w-full h-full object-cover" src="" alt="صورتي">
            <div id="avatarOverlay" class="absolute inset-0 bg-black/30 hidden group-hover:flex items-center justify-center text-white cursor-pointer text-2xl"><i class="fa-solid fa-camera"></i></div>
            <input type="file" id="avatarFileInput" accept="image/*" class="hidden">
        </div>
        <div class="mt-2 flex items-center gap-2">
            <h1 id="profileName" class="text-2xl font-black text-gray-800">جار التحميل...</h1>
            <span class="text-2xl">🦈</span>
            <span class="bg-sky-500 text-white text-xs px-2 py-0.5 rounded-full font-bold"><i class="fa-solid fa-shield-check"></i> موثّق</span>
        </div>
    </div>
    <div class="mt-3 text-right">
        <p id="profileEmail" class="text-sm text-gray-500"></p>
        <p id="profileBio" class="text-sm text-gray-600 mt-1"></p>
        <div class="flex justify-start gap-2 mt-3">
            <button id="editProfileBtn" class="bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-2 px-5 rounded-lg text-sm"><i class="fa-solid fa-pen-to-square"></i> تعديل</button>
            <button id="saveProfileBtn" class="bg-sky-500 hover:bg-sky-600 text-white font-bold py-2 px-5 rounded-lg text-sm hidden"><i class="fa-solid fa-check"></i> حفظ</button>
            <button onclick="engine.logout()" class="bg-white border border-red-200 text-red-500 hover:bg-red-50 font-bold py-2 px-5 rounded-lg text-sm"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
        </div>
    </div>
    <div class="mt-4">
        <div id="userPostsContainer"></div>
    </div>
</div>
