<div class="text-center mb-8">
    <h2 class="text-2xl font-black text-slate-800">طريق القرش للمليون</h2>
    <p class="text-gray-500 text-sm">كل خطوة تقربك من هدفك المالي</p>
</div>

<div class="relative">
    <div class="absolute right-1/2 top-0 bottom-0 w-1 bg-gray-200 -mr-0.5 rounded-full"></div>
    <div id="roadmapSteps" class="space-y-12 relative">
        </div>
</div>

<script>
    // كود بسيط لتوليد الخريطة
    (function renderRoadmap() {
        const steps = [
            {t: "البداية", v: 0},
            {t: "أول 10 آلاف", v: 10000},
            {t: "نصف المائة", v: 50000},
            {t: "أول 100 ألف", v: 100000},
            {t: "ربع مليون", v: 250000},
            {t: "نصف مليون", v: 500000},
            {t: "نادي المليونير", v: 1000000}
        ];
        const container = document.getElementById('roadmapSteps');
        if(!container) return;
        container.innerHTML = steps.map((s, i) => `
            <div class="flex items-center gap-4 ${i % 2 === 0 ? 'flex-row-reverse text-left' : 'text-right'}">
                <div class="flex-1">
                    <h4 class="font-black text-slate-800">${s.t}</h4>
                    <p class="text-xs text-gray-400">${s.v.toLocaleString()} ج.م</p>
                </div>
                <div class="w-10 h-10 rounded-full bg-white border-4 border-gray-100 z-10 flex items-center justify-center text-gray-300">
                    <i class="fa-solid fa-lock text-xs"></i>
                </div>
                <div class="flex-1"></div>
            </div>
        `).join('');
    })();
</script>
