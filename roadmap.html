<div class="roadmap-container">
    <!-- ===== الهيدر ===== -->
    <div class="header">
        <h2>⛰️ رحلة المليونير</h2>
        <p>كل خطوة تقربك من القمة</p>
        <div class="badges">
            <span id="streakBadge">🔥 <span id="streakDays">0</span> يوم متواصل</span>
            <span>🦈 في الطريق</span>
        </div>
        <div id="sharkTip" class="tip">
            🦈 <span id="tipText">حمل بياناتك من المحفظة وشوف تقدمك!</span>
        </div>
    </div>

    <!-- ===== الأزرار ===== -->
    <div class="actions">
        <button onclick="openAIAdvisor()">🧠 قيّم</button>
        <button onclick="openFutureSim()">🔮 مستقبلك</button>
        <button onclick="toggleLeaderboard()">🏆 صدارة</button>
    </div>

    <!-- ===== لوحة الصدارة ===== -->
    <div id="leaderboardPanel" class="panel hidden"></div>

    <!-- ===== الإعدادات ===== -->
    <div class="panel settings">
        <div class="row">
            <select id="goalSelect" onchange="handleGoalChange()">
                <option value="10000">10,000 ج.م</option>
                <option value="100000">100,000 ج.م</option>
                <option value="500000">500,000 ج.م</option>
                <option value="1000000" selected>1,000,000 ج.م</option>
                <option value="5000000">5,000,000 ج.م</option>
            </select>
            <input id="currentInput" value="0" readonly placeholder="ثروتي">
        </div>
        <div id="nextMilestoneInfo" class="next-info">
            🎯 المعسكر القادم: <span id="nextAmount">0</span> ج.م | ⏳ المتبقي: <span id="remainingAmount">0</span> ج.م
        </div>
        <button onclick="loadEngineData()">📊 تحميل من المحفظة</button>
    </div>

    <!-- ===== الجبل ===== -->
    <div class="mountain">
        <div class="peak">🏁 القمة</div>
        <div id="path"></div>
    </div>

    <!-- ===== tooltip ===== -->
    <div id="stageTooltip" class="panel hidden"></div>
</div>

<script>
    // ========== متغيرات ==========
    let currentGoal = 1000000;
    let currentWealth = 0;
    const TOTAL_STAGES = 100;

    const tips = [
        "كل قرش تستثمره يرفعك درجة 🚀",
        "لا تنظر للقمة كحلم، بل كمحطة 🌟",
        "التوفير المنتظم هو وقود الصعود 💪",
        "كلما علوت، اشتدت الرياح… اثبت! 💨",
        "القروش العظيمة تبدأ بزعانف صغيرة 🦈",
        "العادات اليومية تصنع مليونير الغد 📈",
    ];

    // ========== Streak ==========
    function updateStreak() {
        const today = new Date().toLocaleDateString('en-CA');
        let last = localStorage.getItem('lastLoginDate');
        let s = parseInt(localStorage.getItem('loginStreak') || '0');
        if (last !== today) {
            const yesterday = new Date(Date.now() - 86400000).toLocaleDateString('en-CA');
            s = (last === yesterday) ? s + 1 : 1;
            localStorage.setItem('lastLoginDate', today);
            localStorage.setItem('loginStreak', s);
        }
        document.getElementById('streakDays').innerText = s;
        if (s >= 7) document.getElementById('streakBadge').innerHTML = `🔥🔥 ${s} يوم ملتهب!`;
    }
    updateStreak();

    // نصائح متحركة
    setInterval(() => {
        document.getElementById('tipText').innerText = tips[Math.floor(Math.random() * tips.length)];
    }, 6000);

    // ========== لوحة الصدارة ==========
    function toggleLeaderboard() {
        const p = document.getElementById('leaderboardPanel');
        p.classList.toggle('hidden');
        if (!p.classList.contains('hidden')) {
            const names = ["مستثمر ذكي", "قرش العقار", "ملك الأسهم", "صائد الفرص", "محفظة حديد"];
            let html = '<h3>🏆 لوحة الصدارة</h3>';
            for (let i = 0; i < 5; i++) {
                const name = names[Math.floor(Math.random() * names.length)];
                const amount = Math.floor(Math.random() * 900000 + 100000);
                html += `<div class="leader-item">${i+1}. ${name} – <b>${amount.toLocaleString()} ج.م</b></div>`;
            }
            p.innerHTML = html;
        }
    }

    // ========== AI & Simulation (بسيطة) ==========
    function openAIAdvisor() {
        const advice = ["🦈 استثمر بذكاء.. القرش ما ينامش!", "🧠 الأرقام واضحة: زود مدخراتك 20%", "🔥 المخاطرة المحسوبة مفتاح الثراء"];
        alert(advice[Math.floor(Math.random() * advice.length)]);
    }
    function openFutureSim() {
        const saving = prompt("كم تدخر شهرياً؟");
        if (!saving || isNaN(saving)) return;
        const months = Math.ceil((currentGoal - currentWealth) / saving);
        if (months <= 0) alert("🎉 أنت بالفعل مليونير!");
        else {
            const y = Math.floor(months / 12), m = months % 12;
            alert(`💪 ستصل إلى القمة خلال ${y} سنة و ${m} شهر`);
        }
    }

    // ========== توليد 100 مرحلة (نمو أسي) ==========
    function generateMilestones(goal) {
        const stages = TOTAL_STAGES;
        const milestones = [0];
        for (let i = 1; i < stages; i++) {
            const ratio = Math.pow(i / stages, 2.5);
            const amount = Math.round(ratio * goal);
            if (amount > milestones[milestones.length - 1]) milestones.push(amount);
        }
        if (milestones[milestones.length - 1] !== goal) milestones.push(goal);
        while (milestones.length < stages) {
            const last = milestones[milestones.length - 1];
            const prev = milestones[milestones.length - 2] || 0;
            milestones.splice(milestones.length - 1, 0, Math.round((last + prev) / 2));
        }
        return milestones.slice(0, stages);
    }

    // ========== جلب بيانات الأصول من Firestore ==========
    async function loadEngineData() {
        try {
            const { collection, query, where, getDocs } = window.__firestore_helpers || {};
            if (getDocs && window.auth?.currentUser) {
                const q = query(collection(window.db, "assets"), where("userId", "==", window.auth.currentUser.uid));
                const snapshot = await getDocs(q);
                let total = 0;
                snapshot.forEach(doc => { total += Number(doc.data().value) || 0; });
                currentWealth = Math.floor(total);
                document.getElementById('currentInput').value = currentWealth;
                document.getElementById('tipText').innerText = tips[Math.floor(Math.random() * tips.length)];
            }
        } catch (e) {}
        drawMountain();
    }

    // ========== رسم الجبل ==========
    function drawMountain() {
        const milestones = generateMilestones(currentGoal);
        const container = document.getElementById('path');
        let currentIndex = 0;
        for (let i = 0; i < milestones.length; i++) {
            if (currentWealth >= milestones[i]) currentIndex = i;
        }

        const nextAmount = currentIndex < milestones.length - 1 ? milestones[currentIndex + 1] : null;
        if (nextAmount) {
            document.getElementById('nextAmount').innerText = nextAmount.toLocaleString();
            document.getElementById('remainingAmount').innerText = (nextAmount - currentWealth).toLocaleString();
            document.getElementById('nextMilestoneInfo').style.display = 'block';
        } else {
            document.getElementById('nextMilestoneInfo').style.display = 'none';
        }

        container.innerHTML = '';
        // نعرض المراحل من القمة إلى الأسفل (لأعلى الجبل)
        const reversed = [...milestones].reverse();
        reversed.forEach((amount, idx) => {
            const realIndex = milestones.length - 1 - idx;
            const completed = currentWealth >= amount;
            const isCurrent = realIndex === currentIndex;
            const isNext = realIndex === currentIndex + 1;

            const div = document.createElement('div');
            div.className = 'step';
            if (completed) div.classList.add('completed');
            if (isCurrent) div.classList.add('current');
            if (isNext) div.classList.add('next');

            div.innerHTML = `
                ${isCurrent ? '<span class="shark">🦈</span>' : ''}
                <span class="step-num">${realIndex + 1}</span>
                <span class="step-amount">${amount >= 1000 ? (amount/1000).toFixed(1) + 'k' : amount}</span>
            `;
            div.onclick = () => {
                const tip = document.getElementById('stageTooltip');
                tip.classList.remove('hidden');
                const rem = currentGoal - amount;
                tip.innerHTML = `
                    <b>🏁 مرحلة ${realIndex+1}</b><br>
                    المبلغ: ${amount.toLocaleString()} ج.م<br>
                    ${completed ? '✅ مكتملة 🦈' : `⏳ المتبقي للقمة: ${rem.toLocaleString()} ج.م`}
                `;
                tip.scrollIntoView({ behavior: 'smooth' });
            };
            container.appendChild(div);
        });
    }

    function handleGoalChange() {
        currentGoal = parseInt(document.getElementById('goalSelect').value);
        drawMountain();
    }

    // بدء أولي
    if (window.__firestore_helpers && window.auth?.currentUser) {
        loadEngineData();
    } else {
        drawMountain();
    }
</script>

<style>
    body { background: #0f172a; color: white; font-family: 'Tajawal', sans-serif; }
    .roadmap-container { padding: 10px; max-width: 500px; margin: auto; }

    .header { background: #0284c7; padding: 15px; border-radius: 20px; margin-bottom: 10px; }
    .header h2 { margin: 0; font-size: 22px; }
    .header p { margin: 4px 0; font-size: 13px; opacity: 0.9; }
    .badges { display: flex; gap: 10px; font-size: 12px; margin-top: 8px; }
    .badges span { background: #ffffff20; padding: 2px 10px; border-radius: 20px; }
    .tip { background: #ffffff20; padding: 6px 10px; margin-top: 8px; border-radius: 12px; font-size: 13px; }

    .actions { display: flex; gap: 6px; margin-bottom: 10px; }
    .actions button { flex: 1; background: #1e293b; color: white; border: none; padding: 10px; border-radius: 12px; font-weight: bold; font-size: 12px; cursor: pointer; }

    .panel { background: white; color: #0f172a; padding: 12px; border-radius: 16px; margin: 10px 0; }
    .hidden { display: none; }

    .settings select, .settings input { width: 100%; padding: 10px; margin: 4px 0; border-radius: 12px; border: 1px solid #e2e8f0; background: #f8fafc; }
    .settings button { width: 100%; padding: 10px; background: #0ea5e9; color: white; border: none; border-radius: 12px; font-weight: bold; margin-top: 5px; cursor: pointer; }
    .next-info { background: #e0f2fe; padding: 8px; border-radius: 12px; font-size: 13px; margin: 8px 0; display: none; }

    .mountain { background: linear-gradient(#1e293b, #334155); padding: 16px; border-radius: 20px; }
    .peak { text-align: center; font-size: 22px; margin-bottom: 12px; }

    #path { display: flex; flex-direction: column; gap: 10px; }
    .step { width: 75%; padding: 12px; background: white; color: #0f172a; border-radius: 16px; cursor: pointer; position: relative; transition: 0.2s; }
    .step:nth-child(even) { align-self: flex-start; }
    .step:nth-child(odd) { align-self: flex-end; }

    .step.completed { background: #22c55e; color: white; }
    .step.current { border: 3px solid #fbbf24; transform: scale(1.03); box-shadow: 0 0 16px #fbbf2490; }
    .step.next { background: #bae6fd; }

    .step-num { font-weight: 800; font-size: 16px; display: block; }
    .step-amount { font-size: 12px; opacity: 0.8; }
    .shark { position: absolute; right: -15px; top: -15px; font-size: 28px; animation: bounce 0.6s infinite alternate; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-6px); } }

    .leader-item { font-size: 13px; padding: 4px 0; border-bottom: 1px solid #e2e8f0; }
</style>
