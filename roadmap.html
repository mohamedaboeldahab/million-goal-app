<div class="p-4">
    <!-- هيدر الصفحة -->
    <div class="bg-sky-500 rounded-[2rem] p-5 text-white mb-5 shadow-lg shadow-sky-200">
        <h2 class="text-xl font-black mb-1">🗺️ رحلة المليونير</h2>
        <p class="text-xs opacity-80 font-bold">كل خطوة تقربك من هدفك – القرش 🦈 بينط للمراحل اللي فاتت</p>
    </div>

    <!-- إعدادات الهدف -->
    <div class="bg-white rounded-2xl p-4 shadow mb-5 border border-gray-100">
        <div class="grid grid-cols-2 gap-3 mb-3">
            <div>
                <label class="text-xs font-bold text-gray-500 block mb-1">🎯 الهدف (ج.م)</label>
                <input type="number" id="goalInput" value="1000000" class="w-full bg-gray-50 border rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-sky-400">
            </div>
            <div>
                <label class="text-xs font-bold text-gray-500 block mb-1">💰 ثروتي الحالية</label>
                <input type="number" id="currentInput" value="0" class="w-full bg-gray-50 border rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-sky-400">
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="buildRoadmap()" class="flex-1 bg-sky-500 text-white font-bold py-2.5 rounded-xl shadow hover:bg-sky-600 active:scale-95 transition">
                🔁 بناء الخريطة
            </button>
            <button onclick="loadEngineData()" class="bg-gray-100 text-gray-700 font-bold py-2.5 px-4 rounded-xl shadow hover:bg-gray-200 active:scale-95 transition text-sm">
                📊 تحميل بياناتي
            </button>
        </div>
    </div>

    <!-- المسار الأفقي الملتف (Snake) -->
    <div class="bg-white rounded-2xl p-3 shadow-md border border-gray-100 overflow-x-auto">
        <div id="snakePath" class="snake-path"></div>
    </div>

    <!-- تفاصيل المرحلة عند النقر -->
    <div id="stageTooltip" class="bg-white border border-gray-200 rounded-xl p-3 shadow-lg mt-4 hidden text-sm"></div>
</div>

<script>
    // توليد قائمة المعالم المالية بطريقة ذكية
    function generateMilestones(goal) {
        const milestones = [0];
        let current = 0;
        const steps = [250, 500, 1000, 2000, 3000, 5000, 10000, 15000, 25000, 50000, 100000, 250000, 500000, 1000000, 2500000, 5000000, 10000000];
        for (let step of steps) {
            while (current + step <= goal) {
                current += step;
                milestones.push(current);
                if (current >= goal) break;
            }
            if (current >= goal) break;
        }
        if (milestones[milestones.length - 1] !== goal) {
            milestones.push(goal);
        }
        return milestones;
    }

    function buildRoadmap() {
        const goal = parseFloat(document.getElementById('goalInput').value);
        let currentWealth = parseFloat(document.getElementById('currentInput').value);
        if (isNaN(goal) || isNaN(currentWealth) || goal <= 0) {
            alert("من فضلك أدخل أرقام صحيحة");
            return;
        }

        const milestones = generateMilestones(goal);
        const container = document.getElementById('snakePath');
        let html = '';
        const colsPerRow = 5; // عدد الأعمدة في كل صف (مناسب للموبايل)

        const totalCols = colsPerRow;
        const totalRows = Math.ceil(milestones.length / totalCols);

        for (let row = 0; row < totalRows; row++) {
            html += '<div class="snake-row">';
            for (let col = 0; col < totalCols; col++) {
                const index = row % 2 === 0 ? row * totalCols + col : row * totalCols + (totalCols - 1 - col);
                if (index >= milestones.length) {
                    html += '<div class="snake-cell empty"></div>';
                    continue;
                }
                const amount = milestones[index];
                const completed = currentWealth >= amount;
                const isCurrent = (completed === true && (index === milestones.length - 1 || currentWealth < milestones[index + 1]));
                const isNext = (!completed && (index === 0 || currentWealth >= milestones[index - 1]));

                html += `
                    <div class="snake-cell ${completed ? 'completed' : ''} ${isCurrent ? 'current' : ''} ${isNext ? 'next' : ''}"
                         onclick="showStageInfo(${index+1}, ${amount}, ${completed})"
                         title="المرحلة ${index+1} – ${amount.toLocaleString()} ج.م">
                        <span class="stage-num">${index+1}</span>
                        <span class="stage-amount">${amount >= 1000 ? (amount/1000)+'k' : amount}</span>
                        ${isCurrent ? '<span class="shark-icon">🦈</span>' : ''}
                    </div>`;
            }
            html += '</div>';
        }
        container.innerHTML = html;
        hideStageInfo();
    }

    function showStageInfo(num, amount, completed) {
        const tip = document.getElementById('stageTooltip');
        tip.classList.remove('hidden');
        const goal = parseFloat(document.getElementById('goalInput').value);
        const remaining = goal - amount;
        tip.innerHTML = `
            <div class="flex items-center gap-2 mb-1">
                <span class="text-lg">🏁</span>
                <span class="font-extrabold text-gray-800">المرحلة ${num}</span>
                <span class="text-xs ${completed ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'} px-2 py-0.5 rounded-full">${completed ? '✅ مكتملة' : '⏳ قيد التقدم'}</span>
            </div>
            <p class="text-gray-600 text-xs">الهدف: <b>${amount.toLocaleString()} ج.م</b></p>
            ${!completed ? `<p class="text-gray-500 text-xs">المتبقي للوصول: <b>${remaining.toLocaleString()} ج.م</b></p>` : ''}
        `;
        tip.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function hideStageInfo() {
        document.getElementById('stageTooltip').classList.add('hidden');
    }

    function loadEngineData() {
        if (window.engine) {
            const assetsTotal = window.engine.assets ? window.engine.assets.reduce((s, a) => s + a.val, 0) : 0;
            const cash = window.engine.cash || 0;
            const total = cash + assetsTotal;
            document.getElementById('currentInput').value = Math.floor(total);
            if (window.engine.goal) {
                document.getElementById('goalInput').value = window.engine.goal;
            }
        }
        buildRoadmap();
    }

    window.addEventListener('load', loadEngineData);
    if (document.readyState === 'complete') loadEngineData();
</script>

<style>
    .snake-path {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 360px;
    }
    .snake-row {
        display: flex;
        gap: 6px;
        justify-content: center;
    }
    .snake-cell {
        width: 52px;
        height: 52px;
        background: #f1f5f9;
        border-radius: 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #94a3b8;
        font-weight: 700;
        position: relative;
        transition: all 0.3s;
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .snake-cell.empty { background: transparent; box-shadow: none; cursor: default; }
    .snake-cell.completed {
        background: linear-gradient(135deg, #0ea5e9, #0284c7);
        color: white;
        transform: scale(1.02);
        box-shadow: 0 0 12px rgba(14,165,233,0.4);
    }
    .snake-cell.current {
        animation: pulse 1.2s infinite;
        border: 2px solid #facc15;
        transform: scale(1.06);
    }
    .snake-cell.next {
        background: #e0f2fe;
        color: #0284c7;
        border: 1px dashed #0ea5e9;
    }
    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.1); }
        100% { transform: scale(1); }
    }
    .stage-num {
        font-size: 16px;
        font-weight: 800;
        line-height: 1;
    }
    .stage-amount {
        font-size: 9px;
        font-weight: 600;
        margin-top: 2px;
    }
    .shark-icon {
        position: absolute;
        bottom: -14px;
        font-size: 18px;
    }
    .snake-cell:not(.completed) .shark-icon { display: none; }
</style>
