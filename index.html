<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Shark UP | مجتمع القروش</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com/3.4.0"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #f0f2f5; margin: 0; }
        #splash { position: fixed; inset: 0; background: linear-gradient(135deg, #0f172a, #1e293b); z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .nav-link { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; color: #ffffffcc; transition: 0.2s; white-space: nowrap; }
        .nav-link.active { color: white; background: rgba(255,255,255,0.2); }
        .nav-link:hover { background: rgba(255,255,255,0.15); color: white; }
        .nav-links-container { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .nav-links-container::-webkit-scrollbar { display: none; }
        #storyPlayer { position: fixed; inset: 0; background: #000; z-index: 99999; display: none; flex-direction: column; align-items: center; justify-content: center; }
        #storyPlayer.active { display: flex !important; }
    </style>
</head>
<body>
    <div id="splash">
        <div class="w-24 h-24 bg-sky-500 rounded-[2rem] flex items-center justify-center mb-6 rotate-12 shadow-2xl animate-pulse">
            <i class="fa-solid fa-fish-fins text-5xl text-white"></i>
        </div>
        <h1 class="text-white text-3xl font-black tracking-widest mb-10">SHARK UP</h1>
        <div id="authActions"><div class="w-8 h-8 border-4 border-sky-500 border-t-transparent rounded-full animate-spin"></div></div>
    </div>

    <nav class="bg-sky-500 shadow-md fixed top-0 left-0 right-0 z-50">
        <div class="flex items-center justify-between px-3 sm:px-4 h-14 gap-2">
            <div class="flex items-center gap-2 flex-shrink-0">
                <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center"><i class="fa-solid fa-fish-fins text-xl text-white"></i></div>
                <span class="text-white font-black text-base sm:text-lg tracking-tight">SHARK UP</span>
            </div>
            <button onclick="openSearchOverlay()" class="flex items-center gap-2 bg-white/20 rounded-full px-3 sm:px-4 py-2 text-white/80 hover:bg-white/30 transition flex-1 max-w-[200px] mx-2">
                <i class="fa-solid fa-magnifying-glass text-xs"></i><span class="truncate text-xs">ابحث في Shark UP</span>
            </button>
            <button onclick="window.engine.loadPage('profile')" id="userBtn" class="w-9 h-9 rounded-full bg-white/20 overflow-hidden border-2 border-white flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-user text-white"></i></button>
        </div>
        <div class="nav-links-container flex gap-1 px-4 pb-3 pt-1">
            <button onclick="window.engine.loadPage('home')" class="nav-link active" data-page="home"><i class="fa-solid fa-house"></i> الرئيسية</button>
            <button onclick="window.engine.loadPage('assets')" class="nav-link" data-page="assets"><i class="fa-solid fa-wallet"></i> المحفظة</button>
            <button onclick="window.engine.loadPage('roadmap')" class="nav-link" data-page="roadmap"><i class="fa-solid fa-map"></i> الخريطة</button>
            <button onclick="window.engine.loadPage('courses')" class="nav-link" data-page="courses"><i class="fa-solid fa-graduation-cap"></i> الأكاديمية</button>
            <button onclick="window.engine.loadPage('ai-chat')" class="nav-link" data-page="ai-chat"><i class="fa-solid fa-robot"></i> المساعد</button>
        </div>
    </nav>

    <main id="app-content" class="max-w-2xl mx-auto px-4 pt-28 pb-10"></main>

    <div onclick="window.engine.loadPage('ai-chat')" class="fixed bottom-6 left-6 w-14 h-14 bg-sky-500 rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg cursor-pointer z-40 hover:scale-110 transition-transform"><i class="fa-solid fa-robot"></i></div>

    <div id="searchOverlay" class="fixed inset-0 z-[100] bg-white hidden flex-col">
        <div class="flex items-center gap-3 px-4 h-14 bg-sky-500 text-white">
            <button onclick="closeSearchOverlay()" class="text-white text-xl"><i class="fa-solid fa-arrow-right"></i></button>
            <h2 class="font-bold text-lg">بحث</h2>
        </div>
        <div id="searchOverlayContent" class="flex-1 overflow-y-auto p-4"></div>
    </div>

    <!-- مشغل القصص الثابت -->
    <div id="storyPlayer">
        <button id="closeStoryBtn" class="absolute top-5 right-5 text-white text-4xl z-50 bg-transparent border-0">&times;</button>
        <div id="storyContent" class="text-white text-center px-4 mt-16"></div>
        <div class="absolute inset-y-0 left-0 w-1/4 z-40" onclick="window.engine.prevStory()"></div>
        <div class="absolute inset-y-0 right-0 w-1/4 z-40" onclick="window.engine.nextStory()"></div>
    </div>

    <script>
        function setActiveNavLink(p) { document.querySelectorAll('.nav-link').forEach(l => l.classList.toggle('active', l.dataset.page === p)); }
        async function openSearchOverlay() {
            const ov = document.getElementById('searchOverlay'), cd = document.getElementById('searchOverlayContent');
            if (!ov || !cd) return;
            ov.classList.replace('hidden', 'flex');
            try { cd.innerHTML = await (await fetch('search.html')).text(); } catch(e) { cd.innerHTML = '<p class="p-4 text-center">خطأ</p>'; }
        }
        function closeSearchOverlay() { document.getElementById('searchOverlay').classList.replace('flex', 'hidden'); }

        // ربط مشغل القصص
        document.getElementById('closeStoryBtn').addEventListener('click', (e) => { e.stopPropagation(); window.engine.closeStory(); });
        // Event Delegation على مستوى document للقصص
        document.addEventListener('touchstart', (e) => {
            const el = e.target.closest('[data-story-index]');
            if (el) {
                e.preventDefault();
                const idx = parseInt(el.getAttribute('data-story-index'));
                if (!isNaN(idx) && window.engine) window.engine.openStoryPlayer(idx);
            }
        }, { passive: false });
        document.addEventListener('click', (e) => {
            const el = e.target.closest('[data-story-index]');
            if (el) {
                const idx = parseInt(el.getAttribute('data-story-index'));
                if (!isNaN(idx) && window.engine) window.engine.openStoryPlayer(idx);
            }
        });
    </script>
    <script type="module" src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
    </script>
</body>
</html>
