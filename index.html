<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مليونير المستقبل | Pro System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <h1>مليونير <span class="brand-text">المستقبل</span></h1>
        <div class="user-icon"><i class="fa-solid fa-user-tie"></i></div>
    </header>

    <nav class="top-nav">
        <div onclick="engine.nav('home')" id="tab-home" class="nav-tab active"><i class="fa-solid fa-house-chimney"></i></div>
        <div onclick="engine.nav('assets')" id="tab-assets" class="nav-tab"><i class="fa-solid fa-briefcase"></i></div>
        <div onclick="engine.nav('calc')" id="tab-calc" class="nav-tab"><i class="fa-solid fa-chart-pie"></i></div>
        <div onclick="engine.nav('roadmap')" id="tab-roadmap" class="nav-tab"><i class="fa-solid fa-flag-checkered"></i></div>
        <div onclick="engine.nav('chat')" id="tab-chat" class="nav-tab"><i class="fa-solid fa-robot"></i></div>
    </nav>

    <main class="content-container">
        
        <section id="page-home" class="page">
            <div class="balance-card">
                <p class="label">إجمالي صافي الثروة</p>
                <h2 id="totalWealth">0</h2>
                <p class="currency">جنيه مصري</p>
            </div>

            <div class="action-buttons">
                <button onclick="openModal('add')" class="btn-action add">
                    <i class="fa-solid fa-circle-plus"></i> إضافة أرباح
                </button>
                <button onclick="openModal('sub')" class="btn-action sub">
                    <i class="fa-solid fa-circle-minus"></i> سحب مصروف
                </button>
            </div>

            <div class="card advice-card">
                <p id="quickAdvice">المستشار يحلل بياناتك الآن...</p>
            </div>
        </section>

        <section id="page-assets" class="page hidden">
            <div class="section-header">
                <h3>المحفظة الاستثمارية</h3>
                <button onclick="toggleAssetInp()">+ أصل جديد</button>
            </div>

            <div id="assetInputArea" class="card input-card hidden">
                <input type="text" id="aName" placeholder="اسم الأصل (ذهب، أسهم..)">
                <div class="input-row">
                    <input type="number" id="aVal" placeholder="القيمة الحالية">
                    <input type="number" id="aRate" placeholder="العائد %">
                </div>
                <button onclick="engine.addAsset()" class="btn-save">حفظ في المحفظة</button>
            </div>

            <div id="assetsList"></div>
        </section>

        <section id="page-calc" class="page hidden">
            <div class="card calc-card">
                <i class="fa-solid fa-hourglass-half"></i>
                <h3>متى تصل للمليون؟</h3>
                <div class="input-group">
                    <label>إيداعك الشهري المتوقع</label>
                    <input type="number" id="monthlyInp" value="1000" oninput="engine.sync()">
                </div>
                <div class="result-box">
                    <p id="calcRes">--</p>
                </div>
            </div>
        </section>

        <section id="page-roadmap" class="page hidden">
            <div class="roadmap-wrapper">
                <div class="roadmap-line"></div>
                <div id="roadmapNodes" class="nodes-container"></div>
            </div>
        </section>

        <section id="page-chat" class="page hidden">
            <div id="chatBox" class="chat-display">
                <div class="msg ai">أهلاً يا هندسة! أنا مستشارك "فهمي أفندي". كيف نطور ثروتك اليوم؟</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="اسأل فهمي أفندي...">
                <button onclick="engine.chat.ask()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </section>

    </main>

    <div id="opModal" class="modal-overlay hidden">
        <div class="modal-box">
            <h3 id="modalTitle">إضافة أرباح</h3>
            <input type="number" id="modalAmount" placeholder="0.00">
            <div class="modal-btns">
                <button id="modalConfirm" class="confirm-btn">تأكيد</button>
                <button onclick="closeModal()" class="cancel-btn">إلغاء</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
