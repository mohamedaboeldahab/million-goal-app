<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مليونير المستقبل | FB Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <h1 style="font-weight:900; font-size:18px">مليونير <span style="color:#0ea5e9">المستقبل</span></h1>
        <i class="fa-solid fa-circle-user" style="font-size:24px; color:#65676b"></i>
    </header>

    <nav class="top-nav">
        <button onclick="engine.nav('home')" id="tab-home" class="nav-tab active"><i class="fa-solid fa-house"></i></button>
        <button onclick="engine.nav('assets')" id="tab-assets" class="nav-tab"><i class="fa-solid fa-briefcase"></i></button>
        <button onclick="engine.nav('calc')" id="tab-calc" class="nav-tab"><i class="fa-solid fa-chart-line"></i></button>
        <button onclick="engine.nav('roadmap')" id="tab-roadmap" class="nav-tab"><i class="fa-solid fa-flag-checkered"></i></button>
        <button onclick="engine.nav('chat')" id="tab-chat" class="nav-tab"><i class="fa-solid fa-robot"></i></button>
    </nav>

    <main>
        <div id="page-home" class="page">
            <div class="balance-box">
                <small>إجمالي الثروة</small>
                <h2 id="totalVal" style="font-size:40px; margin:5px 0">0</h2>
                <small>جنيه مصري</small>
            </div>
            <button class="btn-primary" onclick="engine.nav('assets')">تحديث الأصول</button>
        </div>

        <div id="page-assets" class="page hidden">
            <h3 style="font-weight:900; margin-bottom:15px">محفظة الأصول</h3>
            <div id="assetsList"></div>
            <div class="card" style="margin-top:20px">
                <input type="text" id="aName" placeholder="اسم الأصل" style="width:100%; margin-bottom:10px; padding:8px">
                <input type="number" id="aVal" placeholder="القيمة" style="width:100%; margin-bottom:10px; padding:8px">
                <button class="btn-primary" onclick="engine.addAsset(document.getElementById('aName').value, document.getElementById('aVal').value, 20)">إضافة (عائد 20%)</button>
            </div>
        </div>

        <div id="page-roadmap" class="page hidden">
            <div id="roadmapList"></div>
        </div>

        <div id="page-calc" class="page hidden text-center">
            <div class="card">
                <p>الإيداع الشهري</p>
                <input type="number" value="1000" oninput="appData.monthly = parseFloat(this.value); engine.sync()" style="font-size:20px; text-align:center; width:100%">
                <h4 id="calcRes" class="text-brand" style="margin-top:20px">--</h4>
            </div>
        </div>

        <div id="page-chat" class="page hidden">
            <div id="chatBox" class="card">
                <div class="msg ai">أهلاً يا هندسة! أنا مستشارك المالي. كيف نطور استثماراتك اليوم؟</div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
