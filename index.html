<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shark Hub | مجتمع القروش</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f0f2f5;
        }
        #splash {
            position: fixed; inset: 0; background: linear-gradient(135deg, #0f172a, #1e293b);
            z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .post-action-btn {
            flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
            padding: 8px; border-radius: 8px; font-weight: 600; font-size: 14px; color: #65676b;
            transition: background 0.2s;
        }
        .post-action-btn:hover { background-color: #f0f2f5; }

        .nav-link {
            display: flex; align-items: center; gap: 6px;
            white-space: nowrap;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #ffffffcc;
            transition: all 0.2s;
        }
        .nav-link.active {
            color: white;
            background-color: rgba(255,255,255,0.2);
        }
        .nav-link:hover {
            background-color: rgba(255,255,255,0.15);
            color: white;
        }
        @media (max-width: 768px) {
            .nav-links-container {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
                -ms-overflow-style: none;
            }
            .nav-links-container::-webkit-scrollbar { display: none; }
            .nav-link { padding: 6px 12px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <!-- شاشة البداية -->
    <div id="splash">
        <div class="w-24 h-24 bg-sky-500 rounded-[2rem] flex items-center justify-center mb-6 rotate-12 shadow-2xl animate-pulse">
            <i class="fa-solid fa-fish-fins text-5xl text-white"></i>
        </div>
        <h1 class="text-white text-3xl font-black tracking-widest mb-10">SHARK HUB</h1>
        <div id="authActions">
            <div class="w-8 h-8 border-4 border-sky-500 border-t-transparent rounded-full animate-spin"></div>
        </div>
    </div>
<!-- شريط التنقل العلوي (أزرق فاتح) -->
<nav class="bg-sky-500 shadow-md fixed top-0 left-0 right-0 z-50">
    <!-- الصف الأول: الشعار + البحث + الأفاتار -->
    <div class="flex items-center justify-between px-4 h-14 gap-2">
        <!-- الشعار مع النص -->
        <div class="flex items-center gap-2">
            <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-fish-fins text-xl text-white"></i>
            </div>
            <span class="text-white font-black text-lg tracking-tight">SHARK HUB</span>
        </div>

        <!-- 🌟 مربع البحث الجديد (يحاكي حقل النص) -->
        <button onclick="engine.loadPage('search')" 
             class="hidden sm:flex items-center gap-2 bg-white/20 rounded-full px-4 py-2 text-sm text-white/80 hover:bg-white/30 transition flex-1 max-w-xs mx-2">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>ابحث في Shark Hub</span>
        </button>

        <!-- أيقونة البحث للجوال (تظهر فقط على الشاشات الصغيرة) -->
        <button onclick="engine.loadPage('search')" class="sm:hidden text-white text-xl">
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>

        <!-- صورة المستخدم + القائمة المنسدلة -->
        <div class="relative">
            <button onclick="document.getElementById('profileMenu').classList.toggle('show')" id="userBtn"
                class="w-9 h-9 rounded-full bg-white/20 overflow-hidden border-2 border-white flex items-center justify-center">
                <i class="fa-solid fa-user text-white"></i>
            </button>
            <div id="profileMenu" class="absolute top-12 left-0 w-56 bg-white rounded-xl shadow-2xl border border-gray-100 py-2 z-[60] hidden text-gray-800">
                <div id="userEmail" class="px-4 py-2 text-xs text-gray-500 border-b mb-1 truncate"></div>
                <button onclick="engine.logout()" class="w-full text-right px-4 py-3 text-red-500 font-bold text-sm hover:bg-red-50 flex items-center gap-2 transition-colors">
                    <i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج
                </button>
            </div>
        </div>
    </div>

    <!-- الصف الثاني: روابط التنقل -->
    <div class="nav-links-container flex gap-1 px-4 pb-3 pt-1">
        <button onclick="engine.loadPage('home')" class="nav-link active" data-page="home">
            <i class="fa-solid fa-house"></i> الرئيسية
        </button>
        <button onclick="engine.loadPage('assets')" class="nav-link" data-page="assets">
            <i class="fa-solid fa-wallet"></i> المحفظة
        </button>
        <button onclick="engine.loadPage('roadmap')" class="nav-link" data-page="roadmap">
            <i class="fa-solid fa-map"></i> الخريطة
        </button>
        <button onclick="engine.loadPage('courses')" class="nav-link" data-page="courses">
            <i class="fa-solid fa-graduation-cap"></i> الأكاديمية
        </button>
        <button onclick="engine.loadPage('ai-chat')" class="nav-link" data-page="ai-chat">
            <i class="fa-solid fa-robot"></i> المساعد
        </button>
    </div>
</nav>

    <!-- منطقة المحتوى الرئيسية -->
    <main id="app-content" class="max-w-2xl mx-auto px-4 pt-28 pb-10">
        <!-- يتم حقن الصفحات هنا -->
    </main>

    <!-- زر المساعد الذكي العائم -->
    <div onclick="engine.loadPage('ai-chat')" class="fixed bottom-6 left-6 w-14 h-14 bg-sky-500 rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg cursor-pointer z-40 hover:scale-110 transition-transform">
        <i class="fa-solid fa-robot"></i>
    </div>

    <script>
        // تحديث الروابط النشطة بعد تحميل الصفحة
        function setActiveNavLink(pageName) {
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.toggle('active', link.dataset.page === pageName);
            });
        }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
