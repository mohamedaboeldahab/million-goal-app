<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sharkup - تطبيق شارك آب للذكاء الاصطناعي</title>
<meta name="description" content="Sharkup (Shark up) هو تطبيق ذكي يقدم استشارات مالية وتقنية مدعومة بالذكاء الاصطناعي. ابدأ محادثتك الآن مع Shark AI.">
<meta name="keywords" content="Sharkup, Shark up, تطبيق شارك اب, Shark AI, استشارات مالية">

<!-- تحسين الظهور في فيسبوك ولينكد إن (Open Graph) -->
<meta property="og:title" content="Sharkup | Shark up App">
<meta property="og:description" content="تطبيقك الذكي لإدارة الدروس والاستشارات المالية.">
<meta property="og:url" content="https://sharkup.vercel.app/">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com/3.4.0"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Tajawal', sans-serif; background: #f0f2f5; margin: 0; }
        #splash { position: fixed; inset: 0; background: linear-gradient(135deg, #0f172a, #1e293b); z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .nav-link { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; color: #ffffffcc; transition: 0.2s; white-space: nowrap; }
        .nav-link.active { color: white; background: rgba(255,255,255,0.2); }
        .nav-links-container { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .nav-links-container::-webkit-scrollbar { display: none; }
        #storyPlayer { position: fixed; inset: 0; background: radial-gradient(circle at center, #1e293b, #0f172a); z-index: 99999; display: none; flex-direction: column; align-items: center; justify-content: center; }
        #storyPlayer.active { display: flex !important; }
        .story-item { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
        
        /* زر التحديث يختفي افتراضياً ويظهر فقط عند الحاجة */
        .refresh-btn { display: none; }
        .refresh-btn.visible { display: flex; }
    </style>
</head>
<body>
    <!-- شاشة البداية -->
    <div id="splash">
        <div class="w-24 h-24 bg-sky-500 rounded-[2rem] flex items-center justify-center mb-6 rotate-12 shadow-2xl animate-pulse"><i class="fa-solid fa-fish-fins text-5xl text-white"></i></div>
        <h1 class="text-white text-3xl font-black tracking-widest mb-10">SHARK UP</h1>
        <div id="authActions"><div class="w-8 h-8 border-4 border-sky-500 border-t-transparent rounded-full animate-spin"></div></div>
    </div>

    <!-- شريط التنقل العلوي -->
    <nav class="bg-sky-500 shadow-md fixed top-0 left-0 right-0 z-50">
        <div class="flex items-center justify-between px-3 sm:px-4 h-14 gap-2">
            <div class="flex items-center gap-2 flex-shrink-0"><div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center"><i class="fa-solid fa-fish-fins text-xl text-white"></i></div><span class="text-white font-black text-base sm:text-lg tracking-tight">SHARK UP</span></div>
            <button onclick="openSearchOverlay()" class="flex items-center gap-2 bg-white/20 rounded-full px-3 sm:px-4 py-2 text-white/80 hover:bg-white/30 transition flex-1 max-w-[200px] mx-2"><i class="fa-solid fa-magnifying-glass text-xs"></i><span class="truncate text-xs">ابحث في Shark UP</span></button>
   <button id="userBtn" onclick="window.engine.loadPage('profile')" class="w-9 h-9 ...">
   <i class="fa-solid fa-user text-white"></i>
</button>
        
        </div>
        <div class="nav-links-container flex gap-1 px-4 pb-3 pt-1">
            <button onclick="window.engine.loadPage('home')" class="nav-link active" data-page="home"><i class="fa-solid fa-house"></i> الرئيسية</button>
            <button onclick="window.engine.loadPage('assets')" class="nav-link" data-page="assets"><i class="fa-solid fa-wallet"></i> المحفظة</button>
            <button onclick="window.engine.loadPage('roadmap')" class="nav-link" data-page="roadmap"><i class="fa-solid fa-map"></i> الخريطة</button>
            <button onclick="window.engine.loadPage('courses')" class="nav-link" data-page="courses"><i class="fa-solid fa-graduation-cap"></i> الأكاديمية</button>
            <button onclick="window.engine.loadPage('ai-chat')" class="nav-link" data-page="ai-chat"><i class="fa-solid fa-robot"></i> المساعد</button>
        </div>
    </nav>

    <!-- منطقة المحتوى الرئيسية -->
    <main id="app-content" class="max-w-2xl mx-auto px-4 pt-28 pb-10"></main>

    <!-- زر تحديث التطبيق – يظهر فقط في الصفحة الرئيسية -->
    <div id="refreshButton" onclick="clearAllCache()" class="refresh-btn fixed bottom-6 left-6 w-14 h-14 bg-sky-500 rounded-2xl items-center justify-center text-white text-2xl shadow-lg cursor-pointer z-40 hover:scale-110 transition-transform" title="تحديث التطبيق">
        <i class="fa-solid fa-rotate"></i>
    </div>

    <!-- طبقة البحث -->
    <div id="searchOverlay" class="fixed inset-0 z-[100] bg-white hidden flex-col">
        <div class="flex items-center gap-3 px-4 h-14 bg-sky-500 text-white"><button onclick="closeSearchOverlay()" class="text-white text-xl"><i class="fa-solid fa-arrow-right"></i></button><h2 class="font-bold text-lg">بحث</h2></div>
        <div id="searchOverlayContent" class="flex-1 overflow-y-auto p-4"></div>
    </div>

    <!-- مشغل القصص الجديد (بطاقة أنيقة) -->
    <div id="storyPlayer">
        <button id="closeStoryBtn" class="absolute top-5 right-5 text-white/80 text-4xl z-50 bg-transparent border-0 p-4 hover:text-white transition">&times;</button>
        <div class="bg-white rounded-3xl p-6 mx-4 max-w-sm w-full relative shadow-2xl transform transition-all">
            <div class="flex flex-col items-center">
                <img id="storyImage" class="w-24 h-24 rounded-full border-4 border-sky-200 object-cover mb-4 shadow-lg" src="" alt="صورة الناشر">
                <h3 id="storyAuthor" class="text-xl font-extrabold text-gray-800 mb-3"></h3>
                <p id="storyText" class="text-gray-600 text-sm leading-relaxed text-center max-w-xs mb-6"></p>
                <div class="flex items-center gap-6 text-gray-500 text-sm mb-4">
                    <span id="viewsCount"><i class="fa-regular fa-eye"></i> 0</span>
                    <button id="likeStoryBtn" class="focus:outline-none transition transform hover:scale-110 active:scale-90">
                        <i class="fa-regular fa-heart text-2xl"></i>
                    </button>
                </div>
            </div>
            <button onclick="window.engine.prevStory()" class="absolute left-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-3xl"><i class="fa-solid fa-chevron-left"></i></button>
            <button onclick="window.engine.nextStory()" class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-3xl"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <div class="absolute inset-y-0 left-0 w-1/4 z-40" onclick="window.engine.prevStory()"></div>
        <div class="absolute inset-y-0 right-0 w-1/4 z-40" onclick="window.engine.nextStory()"></div>
    </div>

    <script>
        // ========== وظائف العرض الأساسية ==========
        function setActiveNavLink(p) { 
            document.querySelectorAll('.nav-link').forEach(l => l.classList.toggle('active', l.dataset.page === p)); 
        }
        
        // التحكم في ظهور زر التحديث حسب الصفحة
        function showRefreshButtonOnlyOnHome(page) {
            const btn = document.getElementById('refreshButton');
            if (!btn) return;
            if (page === 'home') {
                btn.classList.add('visible');
            } else {
                btn.classList.remove('visible');
            }
        }

        async function openSearchOverlay() {
            const ov = document.getElementById('searchOverlay'), cd = document.getElementById('searchOverlayContent');
            if (!ov || !cd) return;
            ov.classList.replace('hidden', 'flex');
            try { cd.innerHTML = await (await fetch('search.html')).text(); } catch(e) { cd.innerHTML = '<p class="p-4 text-center">خطأ</p>'; }
        }
        function closeSearchOverlay() { document.getElementById('searchOverlay').classList.replace('flex', 'hidden'); }
        
        async function clearAllCache() {
            if (confirm('سيتم مسح جميع البيانات المحلية وإعادة تشغيل التطبيق. موافق؟')) {
                if ('serviceWorker' in navigator) { const regs = await navigator.serviceWorker.getRegistrations(); for (let r of regs) await r.unregister(); }
                localStorage.clear(); sessionStorage.clear();
                if ('caches' in window) { const keys = await caches.keys(); await Promise.all(keys.map(k => caches.delete(k))); }
                location.reload(true);
            }
        }
        
        document.getElementById('closeStoryBtn')?.addEventListener('click', () => window.engine?.closeStory?.());
        
        // ========== تجهيز الـ engine للتحكم بالصفحات ==========
        window.addEventListener('DOMContentLoaded', () => {
            // إذا كان هناك engine خارجي سيتم ربطه، وإلا نصنع واحداً مؤقتاً
            if (!window.engine) {
                window.engine = {};
            }
            
            // حفظ الدالة الأصلية loadPage إن وجدت وتغليفها
            const originalLoadPage = window.engine.loadPage;
            window.engine.loadPage = function(page) {
                if (originalLoadPage) {
                    originalLoadPage.call(window.engine, page);
                } else {
                    console.log('تحميل الصفحة:', page);
                }
                setActiveNavLink(page);
                showRefreshButtonOnlyOnHome(page);
            };
            
            // تطبيق أول مرة
            showRefreshButtonOnlyOnHome('home');
        });
    </script>
    <script type="module" src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
    </script>
</body>
</html>
