<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مليونير المستقبل | Ultimate Edition</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        
        /* تعريف ألوان اللوجو الرسمية */
        :root {
            --logo-blue-light: #0ea5e9;
            --logo-blue-dark: #2563eb;
        }

        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; color: #1e293b; }

        /* خانة الرصيد - نفس تدرج اللوجو */
        .balance-card {
            background: linear-gradient(135deg, var(--logo-blue-light) 0%, var(--logo-blue-dark) 100%);
            box-shadow: 0 20px 40px -15px rgba(37, 99, 235, 0.4);
        }

        /* لون البراند الموحد للنصوص والأيقونات */
        .text-brand { color: var(--logo-blue-light); }
        .bg-brand { background-color: var(--logo-blue-light); }
        
        /* تحسين شكل المدخلات */
        input[type="number"] { caret-color: white; }
        
        /* حركة بسيطة للأزرار */
        .nav-btn.active { color: var(--logo-blue-light); transform: translateY(-3px); }
        .nav-btn.active i { filter: drop-shadow(0 4px 6px rgba(14, 165, 233, 0.3)); }
        
        .page { animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="pb-28">

    <header class="p-6 flex justify-between items-center bg-white border-b border-slate-100 sticky top-0 z-50">
        <div>
            <h1 class="text-xl font-black text-slate-800 tracking-tight">مليونير <span class="text-brand">المستقبل</span></h1>
            <div class="flex items-center gap-1 mt-1">
                <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                <p id="progressPercent" class="text-[9px] text-slate-400 font-bold uppercase tracking-widest">تحديث اللحظة</p>
            </div>
        </div>
        <div class="w-10 h-10 balance-card rounded-xl flex items-center justify-center shadow-lg">
            <i class="fa-solid fa-crown text-white text-sm"></i>
        </div>
    </header>

    <main class="max-w-md mx-auto p-6">
        
        <div id="page-home" class="page">
            <div class="balance-card p-10 rounded-[3rem] text-white mb-8 relative overflow-hidden">
                <div class="absolute -right-10 -top-10 w-40 h-40 bg-white/10 rounded-full blur-3xl"></div>
                <div class="absolute -left-10 -bottom-10 w-40 h-40 bg-black/10 rounded-full blur-3xl"></div>
                
                <p class="text-white/80 text-[10px] font-black uppercase mb-3 tracking-[0.2em] text-center">صافي الأصول الحالية</p>
                <div class="flex items-center justify-center gap-2">
                    <input type="number" id="balance" value="7613" oninput="engine.sync()" 
                           class="bg-transparent text-6xl font-black w-full text-center outline-none border-none">
                    <span class="text-xl font-bold opacity-70">ج.م</span>
                </div>
            </div>

            <div class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm mb-6">
                <div class="flex items-center gap-3 mb-4">
                    <i class="fa-solid fa-wand-magic-sparkles text-brand"></i>
                    <h3 class="text-xs font-black text-slate-700 uppercase tracking-wider">توصية المستشار</h3>
                </div>
                <p id="aiAdvice" class="text-sm text-slate-500 leading-relaxed font-medium italic mb-4">"تحليل البيانات يشير إلى أنك في مرحلة نمو ممتازة."</p>
                <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                    <div id="challengeProgress" class="bg-brand h-full transition-all duration-1000" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <div id="page-roadmap" class="page hidden">
            <div id="roadmapNodes" class="space-y-6"></div>
        </div>

        <div id="page-chat" class="page hidden flex flex-col">
            <div id="chatContainer" class="h-[50vh] overflow-y-auto mb-4 p-2 space-y-4"></div>
            <div class="flex gap-2 bg-white p-2 rounded-2xl border border-slate-100 shadow-lg">
                <input type="text" id="chatInput" placeholder="اسأل مستشارك المالي..." class="flex-1 p-3 outline-none text-sm font-bold">
                <button onclick="engine.chat.ask()" class="balance-card w-12 h-12 text-white rounded-xl flex items-center justify-center">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 h-20 bg-white/80 backdrop-blur-xl border-t border-slate-100 flex justify-around items-center px-6 z-50">
        <button onclick="engine.nav('home')" id="btn-home" class="nav-btn flex flex-col items-center gap-1 active">
            <i class="fa-solid fa-wallet text-xl"></i>
            <span class="text-[9px] font-black uppercase">الرصيد</span>
        </button>
        <button onclick="engine.nav('chat')" id="btn-chat" class="nav-btn flex flex-col items-center gap-1 text-slate-300">
            <i class="fa-solid fa-comment-dots text-xl"></i>
            <span class="text-[9px] font-black uppercase">المستشار</span>
        </button>
        <button onclick="engine.nav('roadmap')" id="btn-roadmap" class="nav-btn flex flex-col items-center gap-1 text-slate-300">
            <i class="fa-solid fa-map-marked-alt text-xl"></i>
            <span class="text-[9px] font-black uppercase">الخريطة</span>
        </button>
    </nav>

    <script>
        // المحرك البرمجي (نفس منطقك القوي مع تعديلات الـ UI)
        const engine = {
            sync() {
                const val = parseFloat(document.getElementById('balance').value) || 0;
                localStorage.setItem('future_millionaire_data', val);
                const progress = Math.min((val / 1000000) * 100, 100);
                document.getElementById('challengeProgress').style.width = progress + "%";
                document.getElementById('progressPercent').innerText = `أنجزت ${Math.floor(progress)}% من الهدف`;
            },
            chat: {
                ask() {
                    const input = document.getElementById('chatInput');
                    if(!input.value) return;
                    const container = document.getElementById('chatContainer');
                    container.innerHTML += `<div class="text-left"><span class="inline-block bg-brand text-white p-3 rounded-2xl text-xs font-bold">${input.value}</span></div>`;
                    input.value = '';
                    setTimeout(() => {
                        container.innerHTML += `<div class="text-right"><span class="inline-block bg-slate-100 text-slate-700 p-3 rounded-2xl text-xs font-bold">بناءً على رصيدك الحالي، أنت تقترب من المرحلة التالية بخطى ثابتة!</span></div>`;
                        container.scrollTop = container.scrollHeight;
                    }, 500);
                }
            },
            nav(p) {
                document.querySelectorAll('.page').forEach(pg => pg.classList.add('hidden'));
                document.getElementById('page-' + p).classList.remove('hidden');
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active', 'text-brand'));
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.add('text-slate-300'));
                document.getElementById('btn-' + p).classList.add('active', 'text-brand');
            }
        };
        window.onload = () => {
            const saved = localStorage.getItem('future_millionaire_data');
            if (saved) document.getElementById('balance').value = saved;
            engine.sync();
        };
    </script>
</body>
</html>
