<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مليونير المستقبل | Light Edition</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0ea5e9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2150/2150150.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .gradient-card { background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%); }
        .glass-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border-top: 1px solid #e2e8f0; }
        .roadmap-step.active .icon-box { background: #0ea5e9; color: white; transform: scale(1.1); box-shadow: 0 10px 15px -3px rgba(14, 165, 233, 0.4); }
        .page { transition: all 0.4s ease; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; }
    </style>
</head>
<body class="pb-24">

    <header class="p-6 flex justify-between items-center bg-white border-b border-slate-100">
        <div>
            <h1 class="text-xl font-black text-slate-800">مليونير <span class="text-sky-500">المستقبل</span></h1>
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Wealth Path v3.0</p>
        </div>
        <div class="w-10 h-10 bg-slate-50 rounded-full flex items-center justify-center border border-slate-200">
            <i class="fa-solid fa-robot text-sky-500"></i>
        </div>
    </header>

    <main id="main-content" class="max-w-md mx-auto p-6">
        
        <div id="page-home" class="page">
            <div class="gradient-card p-8 rounded-[2.5rem] text-white shadow-xl shadow-blue-200 mb-8 relative overflow-hidden">
                <div class="absolute -right-10 -top-10 w-32 h-32 bg-white/10 rounded-full blur-2xl"></div>
                <p class="text-white/70 text-xs font-bold mb-2">رصيدك المتاح للنمو</p>
                <div class="flex items-baseline gap-2">
                    <input type="number" id="balance" value="7613" oninput="engine.sync()" class="bg-transparent text-5xl font-black w-full outline-none caret-white">
                    <span class="text-lg font-bold">ج.م</span>
                </div>
            </div>

            <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm mb-6">
                <div class="flex items-center gap-3 mb-3 text-sky-600">
                    <i class="fa-solid fa-bolt-lightning animate-bounce"></i>
                    <h3 class="text-xs font-black uppercase">تحدي الذكاء الاصطناعي</h3>
                </div>
                <p id="aiAdvice" class="text-sm text-slate-600 leading-relaxed mb-4">نصيحة ذكية تظهر هنا...</p>
                <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                    <div id="challengeProgress" class="bg-sky-500 h-full transition-all duration-1000" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <div id="page-roadmap" class="page hidden">
            <h2 class="text-lg font-black text-slate-800 mb-8 text-center italic">خارطة الوصول للمليون</h2>
            <div id="roadmapNodes" class="space-y-8 relative">
                </div>
        </div>

        <div id="page-calc" class="page hidden">
            <div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm">
                <h3 class="font-black text-slate-800 mb-6 flex items-center gap-2 italic">
                    <i class="fa-solid fa-chart-line text-green-500"></i> محاكي الأرباح
                </h3>
                <div class="space-y-6">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase mr-2">الإيداع الشهري</label>
                        <input type="number" id="monthly" value="1000" class="w-full bg-slate-50 p-4 rounded-2xl outline-none border border-slate-100 focus:border-sky-500 font-bold" oninput="engine.calculate()">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase mr-2">العائد السنوي (%)</label>
                        <input type="number" id="rate" value="18" class="w-full bg-slate-50 p-4 rounded-2xl outline-none border border-slate-100 focus:border-sky-500 font-bold" oninput="engine.calculate()">
                    </div>
                    <div class="p-6 bg-sky-50 rounded-2xl border border-sky-100 text-center">
                        <p id="calcResult" class="text-sky-700 font-black text-lg">--</p>
                    </div>
                </div>
            </div>
        </div>
  <div id="page-chat" class="page hidden flex flex-col h-[70vh]">
    <div id="chatContainer" class="flex-1 overflow-y-auto p-4 bg-white rounded-3xl mb-4 border border-slate-100 shadow-inner">
        </div>
    <div class="flex gap-2">
        <input type="text" id="chatInput" placeholder="اسأل المستشار الذكي..." class="flex-1 p-4 rounded-2xl bg-slate-50 outline-none border border-slate-100 focus:border-sky-500">
        <button onclick="engine.chat.ask(document.getElementById('chatInput').value)" class="p-4 bg-sky-500 text-white rounded-2xl w-14">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </div>
</div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 h-20 glass-nav flex justify-around items-center px-6 z-50">
        <button onclick="engine.nav('home')" id="btn-home" class="flex flex-col items-center gap-1 text-sky-500 font-black">
            <i class="fa-solid fa-house-chimney text-xl"></i>
            <span class="text-[9px]">الرئيسية</span>
        </button>
        <button onclick="engine.nav('roadmap')" id="btn-roadmap" class="flex flex-col items-center gap-1 text-slate-400 font-black">
            <i class="fa-solid fa-map-location-dot text-xl"></i>
            <span class="text-[9px]">الخريطة</span>
        </button>
        <button onclick="engine.nav('calc')" id="btn-calc" class="flex flex-col items-center gap-1 text-slate-400 font-black">
            <i class="fa-solid fa-calculator text-xl"></i>
            <span class="text-[9px]">الحاسبة</span>
        </button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
