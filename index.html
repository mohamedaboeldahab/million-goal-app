<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مليونير المستقبل | FB Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <h1 style="font-weight:900; font-size:18px">مليونير <span style="color:#0ea5e9">المستقبل</span></h1>
        <div style="display:flex; gap:15px">
            <i class="fa-solid fa-magnifying-glass" style="color:#65676b"></i>
            <i class="fa-solid fa-circle-user" style="font-size:24px; color:#65676b"></i>
        </div>
    </header>

    <nav class="top-nav">
        <button onclick="engine.nav('home')" id="tab-home" class="nav-tab active"><i class="fa-solid fa-house"></i></button>
        <button onclick="engine.nav('assets')" id="tab-assets" class="nav-tab"><i class="fa-solid fa-briefcase"></i></button>
        <button onclick="engine.nav('calc')" id="tab-calc" class="nav-tab"><i class="fa-solid fa-chart-line"></i></button>
        <button onclick="engine.nav('roadmap')" id="tab-roadmap" class="nav-tab"><i class="fa-solid fa-flag-checkered"></i></button>
        <button onclick="engine.nav('chat')" id="tab-chat" class="nav-tab"><i class="fa-solid fa-robot"></i></button>
    </nav>

    <main>
        <!-- الصفحة الرئيسية: من غير إجمالي الثروة -->
        <div id="page-home" class="page">
            <div class="card post-creator">
                <div class="creator-top">
                    <i class="fa-solid fa-circle-user" style="font-size:36px; color:#0ea5e9"></i>
                    <input type="text" id="postInput" placeholder="اكتب تحديث أعمال أو فرصة جديدة..." 
                           style="flex:1; border:none; background:#f0f2f5; border-radius:20px; padding:8px 15px;">
                </div>
                <button class="btn-primary" onclick="engine.addPost()" style="margin-top:10px">
                    <i class="fa-solid fa-paper-plane"></i> نشر التحديث
                </button>
            </div>
            <div id="feedList"></div>
        </div>

        <!-- صفحة الأصول: إجمالي الثروة + رصيد النقد -->
        <div id="page-assets" class="page hidden">
            <div class="balance-box" style="margin-bottom:15px">
                <small>إجمالي ثروتك</small>
                <h2 id="totalValAssets" style="font-size:30px; margin:5px 0">0</h2>
                <small>جنيه مصري</small>
            </div>

            <!-- بطاقة تعديل الرصيد النقدي -->
            <div class="card">
                <b>الرصيد النقدي</b>
                <div style="display:flex; align-items:center; gap:10px; margin-top:10px">
                    <span id="cashDisplay" style="font-size:18px; flex:1">0 ج.م</span>
                    <input type="number" id="cashAdjustInput" placeholder="المبلغ (+ / -)" 
                           style="width:100px; padding:8px; border:1px solid #ddd; border-radius:6px; text-align:center">
                    <button class="btn-primary" onclick="engine.adjustCash()" style="width:auto; padding:8px 15px; margin-top:0">تحديث</button>
                </div>
            </div>

            <h3 style="font-weight:900; margin-bottom:15px">محفظة الأصول</h3>
            <div id="assetsList"></div>
            <div class="card" style="margin-top:20px">
                <input type="text" id="aName" placeholder="اسم الأصل" style="width:100%; margin-bottom:10px; padding:8px">
                <input type="number" id="aVal" placeholder="القيمة" style="width:100%; margin-bottom:10px; padding:8px">
                <button class="btn-primary" onclick="engine.addAsset(document.getElementById('aName').value, document.getElementById('aVal').value, 20)">إضافة (عائد 20%)</button>
            </div>
        </div>

        <!-- الخريطة (100 مرحلة) -->
        <div id="page-roadmap" class="page hidden">
            <div id="roadmapList"></div>
        </div>

        <!-- الحاسبة -->
        <div id="page-calc" class="page hidden text-center">
            <div class="card">
                <p>الإيداع الشهري</p>
                <input type="number" value="1000" oninput="appData.monthly = parseFloat(this.value); engine.sync()" 
                       style="font-size:20px; text-align:center; width:100%">
                <h4 id="calcRes" class="text-brand" style="margin-top:20px">--</h4>
            </div>
        </div>

        <!-- المستشار الذكي -->
        <div id="page-chat" class="page hidden">
            <div id="chatBox" class="card">
                <div class="msg ai">أهلاً يا هندسة! أنا مستشارك المالي الذكي. اسألني عن أي حاجة تخص أموالك وأهدافك.</div>
            </div>
            <div class="chat-input-area" style="display:flex; gap:10px; margin-top:10px">
                <input type="text" id="chatInput" placeholder="اسأل عن استثماراتك..." 
                       style="flex:1; padding:10px; border:1px solid #ddd; border-radius:20px; font-family:Tajawal;">
                <button onclick="engine.sendMessage()" class="btn-primary" 
                        style="width:45px; height:45px; border-radius:50%; display:flex; align-items:center; justify-content:center;">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
