<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجتمع مليونير المستقبل</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
        .page { display: none; }
        .page.active { display: block; }
        .bottom-sheet { transform: translateY(100%); transition: transform 0.3s ease-out; }
        .bottom-sheet.open { transform: translateY(0); }
    </style>
</head>
<body class="bg-gray-50 pb-20">

    <div id="authModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl mx-4">
            <div class="w-20 h-20 bg-sky-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fa-solid fa-rocket text-3xl text-[#0ea5e9]"></i>
            </div>
            <h2 class="text-2xl font-black mb-2">مرحباً بك!</h2>
            <p class="text-gray-500 text-sm mb-8">سجل دخولك لتنضم لمجتمع المستثمرين وتتابع رحلتك للمليون</p>
            <button onclick="engine.login()" class="w-full bg-white border-2 border-gray-100 py-4 rounded-2xl flex items-center justify-center gap-3 font-bold hover:bg-gray-50 shadow-sm transition-transform active:scale-95">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
                الدخول بواسطة جوجل
            </button>
        </div>
    </div>

    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-40 px-4 py-4 flex justify-between items-center border-b border-gray-100">
        <h1 class="text-xl font-black text-gray-800">مليونير <span class="text-[#0ea5e9]">Future</span></h1>
        <div id="userInfo" class="flex items-center gap-2"></div>
    </header>

    <main class="max-w-xl mx-auto p-4">
        
        <div id="page-home" class="page active">
            <div class="bg-white rounded-2xl shadow-sm p-4 mb-6 border border-gray-100">
                <div class="flex items-center gap-3">
                    <img id="userAvatar" src="" class="w-10 h-10 rounded-full bg-gray-100">
                    <input type="text" id="postInput" placeholder="ما هي آخر أخبار استثماراتك؟" class="flex-1 bg-gray-50 rounded-xl px-4 py-3 border-none focus:ring-2 focus:ring-sky-500 outline-none">
                </div>
                <button onclick="engine.addPost()" class="mt-3 w-full bg-[#0ea5e9] text-white font-bold py-3 rounded-xl shadow-lg shadow-sky-100 hover:bg-sky-600">نشر في المجتمع</button>
            </div>
            <div id="feedList" class="space-y-4"></div>
        </div>

        <div id="page-assets" class="page">
            <div class="bg-gradient-to-br from-sky-500 to-blue-600 text-white rounded-3xl p-8 mb-6 shadow-xl relative overflow-hidden">
                <div class="relative z-10">
                    <p class="opacity-80 text-sm">إجمالي القيمة الحالية</p>
                    <h2 id="totalValAssets" class="text-4xl font-black my-2">0</h2>
                    <p class="text-xs">جنيه مصري</p>
                </div>
                <i class="fa-solid fa-wallet absolute -bottom-4 -left-4 text-9xl opacity-10"></i>
            </div>
            <div id="assetsList" class="space-y-3"></div>
            <div class="mt-6 bg-white p-4 rounded-2xl border border-dashed border-gray-300">
                <h3 class="font-bold mb-3 text-gray-700">إضافة أصل جديد</h3>
                <input type="text" id="aName" placeholder="مثلاً: ذهب، أسهم، عقار" class="w-full mb-2 p-3 bg-gray-50 rounded-xl outline-none">
                <input type="number" id="aVal" placeholder="القيمة" class="w-full mb-3 p-3 bg-gray-50 rounded-xl outline-none">
                <button onclick="engine.addAsset()" class="w-full bg-gray-800 text-white py-3 rounded-xl font-bold">حفظ الأصل</button>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-lg border-t border-gray-100 px-6 py-3 flex justify-around items-center z-50">
        <button onclick="engine.nav('home')" class="nav-btn text-[#0ea5e9]" data-page="home">
            <i class="fa-solid fa-users text-xl"></i>
        </button>
        <button onclick="engine.nav('assets')" class="nav-btn text-gray-400" data-page="assets">
            <i class="fa-solid fa-chart-pie text-xl"></i>
        </button>
        <button onclick="engine.nav('roadmap')" class="nav-btn text-gray-400" data-page="roadmap">
            <i class="fa-solid fa-map-location-dot text-xl"></i>
        </button>
    </nav>

    <div id="commentSheetOverlay" class="fixed inset-0 bg-black/40 z-[60] hidden" onclick="engine.closeComments()"></div>
    <div id="commentSheet" class="fixed bottom-0 left-0 right-0 bg-white z-[70] rounded-t-[32px] max-h-[80vh] flex flex-col bottom-sheet">
        <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto my-4"></div>
        <div id="commentsContainer" class="flex-1 overflow-y-auto px-6 pb-20"></div>
        <div class="p-4 border-t bg-white absolute bottom-0 left-0 right-0 flex gap-2">
            <input type="text" id="commentInput" placeholder="اكتب تعليقك..." class="flex-1 bg-gray-100 rounded-full px-4 py-2 outline-none">
            <button id="sendCommentBtn" class="bg-sky-500 text-white w-10 h-10 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
