<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shark Hub</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #f0f2f5; overflow-x: hidden; }
        
        /* Splash Screen Style */
        #splash {
            position: fixed; inset: 0; background: #0f172a; 
            z-index: 200; display: flex; flex-direction: column;
            align-items: center; justify-content: center; transition: 0.5s;
        }
        .loader { width: 48px; height: 48px; border: 5px solid #FFF; border-bottom-color: #0ea5e9; border-radius: 50%; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg) } 100% { transform: rotate(360deg) } }
    </style>
</head>
<body>

    <div id="splash">
        <div class="w-24 h-24 bg-sky-500 rounded-3xl flex items-center justify-center mb-6 shadow-2xl shadow-sky-500/20 rotate-12">
            <i class="fa-solid fa-fish-fins text-4xl text-white"></i>
        </div>
        <h1 class="text-white text-3xl font-black tracking-widest">SHARK HUB</h1>
        <div class="loader mt-8"></div>
    </div>

    <nav id="main-nav" class="bg-white shadow-sm sticky top-0 z-50 px-4 py-2 hidden">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-slate-900 rounded-lg flex items-center justify-center text-white text-xs">
                    <i class="fa-solid fa-fish-fins"></i>
                </div>
                <span class="font-black text-slate-800">SHARK HUB</span>
            </div>
            <div class="flex gap-4">
                <button onclick="engine.loadPage('home')" class="p-2 text-sky-600"><i class="fa-solid fa-house"></i></button>
                <button onclick="engine.loadPage('roadmap')" class="p-2 text-gray-400"><i class="fa-solid fa-map"></i></button>
                <button id="userBtn" class="w-8 h-8 rounded-full border overflow-hidden bg-gray-100"></button>
            </div>
        </div>
    </nav>

    <main id="app-content" class="max-w-2xl mx-auto p-4 pt-6"></main>

    <script type="module" src="app.js"></script>
</body>
</html>
