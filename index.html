<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shark Hub | مجتمع القروش</title>
    <link rel="manifest" href="manifest.json">
    <!-- Tailwind + Font Awesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- خط تجوال -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f0f2f5; /* لون خلفية فيسبوك */
        }

        /* شاشة البداية */
        #splash {
            position: fixed; inset: 0; background: linear-gradient(135deg, #0f172a, #1e293b);
            z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* القائمة الجانبية (ديسكتوب) */
        .sidebar-link {
            display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px;
            font-weight: 600; font-size: 15px; color: #1c1e21; transition: background 0.2s;
        }
        .sidebar-link:hover { background-color: #e4e6eb; }
        .sidebar-link.active { color: #1877F2; background-color: #e7f3ff; }

        /* أزرار التفاعل أسفل المنشور */
        .post-action-btn {
            flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
            padding: 8px; border-radius: 8px; font-weight: 600; font-size: 14px; color: #65676b;
            transition: background 0.2s;
        }
        .post-action-btn:hover { background-color: #f0f2f5; }

        /* شريط سفلي للجوال */
        @media (max-width: 768px) {
            .mobile-bottom-nav { display: flex !important; }
            .desktop-sidebar, .desktop-rightbar { display: none !important; }
        }
        @media (min-width: 769px) {
            .mobile-bottom-nav { display: none !important; }
            .desktop-sidebar, .desktop-rightbar { display: block !important; }
        }
    </style>
</head>
<body class="pb-16 lg:pb-0">

    <!-- ================= شاشة البداية ================= -->
    <div id="splash">
        <div class="w-24 h-24 bg-sky-500 rounded-[2rem] flex items-center justify-center mb-6 rotate-12 shadow-2xl animate-pulse">
            <i class="fa-solid fa-fish-fins text-5xl text-white"></i>
        </div>
        <h1 class="text-white text-3xl font-black tracking-widest mb-10">SHARK HUB</h1>
        <div id="authActions">
            <div class="w-8 h-8 border-4 border-sky-500 border-t-transparent rounded-full animate-spin"></div>
        </div>
    </div>

    <!-- ================= شريط علوي (فيسبوك ستايل) ================= -->
    <nav class="bg-white shadow-sm fixed top-0 left-0 right-0 z-50 h-14 flex items-center justify-between px-4 border-b border-gray-200">
        <!-- الشعار والبحث -->
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-[#1877F2] rounded-full flex items-center justify-center text-white font-black text-lg">S</div>
            <div class="hidden sm:flex items-center bg-gray-100 rounded-full px-4 py-2 gap-2">
                <i class="fa-solid fa-magnifying-glass text-gray-500 text-sm"></i>
                <input type="text" placeholder="ابحث في Shark Hub" class="bg-transparent outline-none text-sm w-40">
            </div>
        </div>

        <!-- أيقونات المستخدم -->
        <div class="flex items-center gap-3">
            <div class="relative">
                <button onclick="document.getElementById('profileMenu').classList.toggle('show')" id="userBtn"
                    class="w-9 h-9 rounded-full bg-gray-200 overflow-hidden border border-gray-300">
                    <i class="fa-solid fa-user text-gray-500"></i>
                </button>
                <!-- قائمة منسدلة -->
                <div id="profileMenu" class="absolute top-12 right-0 w-56 bg-white rounded-xl shadow-2xl border border-gray-100 py-2 z-[60] hidden">
                    <div id="userEmail" class="px-4 py-2 text-xs text-gray-500 border-b mb-1 truncate"></div>
                    <button onclick="engine.logout()" class="w-full text-right px-4 py-3 text-red-500 font-bold text-sm hover:bg-red-50 flex items-center gap-2 transition-colors">
                        <i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- ================= هيكل الصفحة الرئيسي (ثلاث أعمدة) ================= -->
    <div class="flex justify-center mt-14 min-h-screen">
        <!-- العمود الأيسر (قائمة جانبية) -->
        <div class="desktop-sidebar hidden w-[280px] p-4 fixed right-0 top-14 h-full overflow-y-auto bg-white border-l border-gray-200">
            <div class="space-y-1">
                <button onclick="engine.loadPage('home')" class="sidebar-link active" data-page="home">
                    <i class="fa-solid fa-house w-6 text-center"></i> الرئيسية
                </button>
                <button onclick="engine.loadPage('assets')" class="sidebar-link" data-page="assets">
                    <i class="fa-solid fa-wallet w-6 text-center"></i> المحفظة
                </button>
                <button onclick="engine.loadPage('roadmap')" class="sidebar-link" data-page="roadmap">
                    <i class="fa-solid fa-map w-6 text-center"></i> الخريطة
                </button>
                <button onclick="engine.loadPage('courses')" class="sidebar-link" data-page="courses">
                    <i class="fa-solid fa-graduation-cap w-6 text-center"></i> الأكاديمية
                </button>
                <button onclick="engine.loadPage('ai-chat')" class="sidebar-link" data-page="ai-chat">
                    <i class="fa-solid fa-robot w-6 text-center"></i> المساعد الذكي
                </button>
            </div>
        </div>

        <!-- منطقة المحتوى الرئيسي (الوسط) -->
        <main id="app-content" class="flex-1 max-w-[680px] w-full mx-auto px-4 pt-4 lg:mr-[280px] lg:ml-[280px]">
            <!-- يتم حقن الصفحات هنا ديناميكياً -->
        </main>

        <!-- العمود الأيمن (اقتراحات / نشاط) -->
        <div class="desktop-rightbar hidden w-[280px] p-4 fixed left-0 top-14 h-full overflow-y-auto bg-white border-r border-gray-200">
            <h3 class="text-gray-500 font-bold text-sm mb-4">اقتراحات للقروش</h3>
            <div class="space-y-3">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-gray-300"></div>
                    <div>
                        <p class="font-bold text-sm">مستخدم جديد</p>
                        <p class="text-xs text-gray-500">متابَع من 5 أشخاص</p>
                    </div>
                </div>
                <!-- تكرار العناصر -->
            </div>
        </div>
    </div>

    <!-- ================= شريط سفلي للجوال ================= -->
    <div class="mobile-bottom-nav fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 h-14 flex items-center justify-around z-50">
        <button onclick="engine.loadPage('home')" class="flex flex-col items-center text-[#1877F2] text-xs font-bold" data-page="home">
            <i class="fa-solid fa-house text-xl"></i> الرئيسية
        </button>
        <button onclick="engine.loadPage('assets')" class="flex flex-col items-center text-gray-500 text-xs font-bold" data-page="assets">
            <i class="fa-solid fa-wallet text-xl"></i> المحفظة
        </button>
        <button onclick="engine.loadPage('roadmap')" class="flex flex-col items-center text-gray-500 text-xs font-bold" data-page="roadmap">
            <i class="fa-solid fa-map text-xl"></i> الخريطة
        </button>
        <button onclick="engine.loadPage('courses')" class="flex flex-col items-center text-gray-500 text-xs font-bold" data-page="courses">
            <i class="fa-solid fa-graduation-cap text-xl"></i> الأكاديمية
        </button>
        <button onclick="engine.loadPage('ai-chat')" class="flex flex-col items-center text-gray-500 text-xs font-bold" data-page="ai-chat">
            <i class="fa-solid fa-robot text-xl"></i> الذكاء
        </button>
    </div>

    <!-- زر الذكاء العائم (ماسنجر ستايل) -->
    <div onclick="engine.loadPage('ai-chat')" class="fixed bottom-20 left-5 lg:bottom-8 lg:left-8 w-14 h-14 bg-gradient-to-br from-[#1877F2] to-[#0b5ec7] rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg cursor-pointer z-40 hover:scale-110 transition-transform">
        <i class="fa-solid fa-robot"></i>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
