<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shark Up | مجتمع القروش</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f0f2f5;
        }
        #splash {
            position: fixed; inset: 0; background: linear-gradient(135deg, #0f172a, #1e293b);
            z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .post-action-btn {
            flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
            padding: 8px; border-radius: 8px; font-weight: 600; font-size: 14px; color: #65676b;
            transition: background 0.2s;
        }
        .post-action-btn:hover { background-color: #f0f2f5; }
        .nav-link {
            display: flex; align-items: center; gap: 6px;
            white-space: nowrap;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #ffffffcc;
            transition: all 0.2s;
        }
        .nav-link.active {
            color: white;
            background-color: rgba(255,255,255,0.2);
        }
        .nav-link:hover {
            background-color: rgba(255,255,255,0.15);
            color: white;
        }
        @media (max-width: 768px) {
            .nav-links-container {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
                -ms-overflow-style: none;
            }
            .nav-links-container::-webkit-scrollbar { display: none; }
            .nav-link { padding: 6px 12px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <!-- شاشة البداية -->
    <div id="splash">
        <div class="w-24 h-24 bg-sky-500 rounded-[2rem] flex items-center justify-center mb-6 rotate-12 shadow-2xl animate-pulse">
            <i class="fa-solid fa-fish-fins text-5xl text-white"></i>
        </div>
        <h1 class="text-white text-3xl font-black tracking-widest mb-10">SHARK Up</h1>
        <div id="authActions">
            <div class="w-8 h-8 border-4 border-sky-500 border-t-transparent rounded-full animate-spin"></div>
        </div>
    </div>

    <!-- شريط التنقل العلوي -->
    <nav class="bg-sky-500 shadow-md fixed top-0 left-0 right-0 z-50">
        <div class="flex items-center justify-between px-3 sm:px-4 h-14 gap-2">
            <div class="flex items-center gap-2 flex-shrink-0">
                <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-fish-fins text-xl text-white"></i>
                </div>
                <span class="text-white font-black text-base sm:text-lg tracking-tight">SHARK Up</span>
            </div>

            <!-- زر البحث الجديد -->
            <button onclick="openSearchOverlay()" 
                 class="flex items-center gap-2 bg-white/20 rounded-full px-3 sm:px-4 py-2 text-sm text-white/80 hover:bg-white/30 transition flex-1 max-w-[200px] sm:max-w-xs mx-2">
                <i class="fa-solid fa-magnifying-glass text-xs sm:text-sm"></i>
                <span class="truncate text-xs sm:text-sm">ابحث في Shark Up</span>
            </button>

  <!-- صورة المستخدم (تفتح صفحة البروفايل) -->
<button onclick="engine.loadPage('profile')" id="userBtn"
    class="w-9 h-9 rounded-full bg-white/20 overflow-hidden border-2 border-white flex items-center justify-center flex-shrink-0">
    <i class="fa-solid fa-user text-white"></i>
</button>
            
        </div>
        <div class="nav-links-container flex gap-1 px-4 pb-3 pt-1">
            <button onclick="engine.loadPage('home')" class="nav-link active" data-page="home">
                <i class="fa-solid fa-house"></i> الرئيسية
            </button>
            <button onclick="engine.loadPage('assets')" class="nav-link" data-page="assets">
                <i class="fa-solid fa-wallet"></i> المحفظة
            </button>
            <button onclick="engine.loadPage('roadmap')" class="nav-link" data-page="roadmap">
                <i class="fa-solid fa-map"></i> الخريطة
            </button>
            <button onclick="engine.loadPage('courses')" class="nav-link" data-page="courses">
                <i class="fa-solid fa-graduation-cap"></i> الأكاديمية
            </button>
            <button onclick="engine.loadPage('ai-chat')" class="nav-link" data-page="ai-chat">
                <i class="fa-solid fa-robot"></i> المساعد
            </button>
        </div>
    </nav>

    <!-- منطقة المحتوى الرئيسية -->
    <main id="app-content" class="max-w-2xl mx-auto px-4 pt-28 pb-10"></main>

    <!-- زر المساعد الذكي العائم -->
    <div onclick="engine.loadPage('ai-chat')" class="fixed bottom-6 left-6 w-14 h-14 bg-sky-500 rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg cursor-pointer z-40 hover:scale-110 transition-transform">
        <i class="fa-solid fa-robot"></i>
    </div>

    <!-- طبقة البحث الكاملة -->
    <div id="searchOverlay" class="fixed inset-0 z-[100] bg-white hidden flex-col">
        <div class="flex items-center gap-3 px-4 h-14 bg-sky-500 text-white">
            <button onclick="closeSearchOverlay()" class="text-white text-xl">
                <i class="fa-solid fa-arrow-right"></i>
            </button>
            <h2 class="font-bold text-lg">بحث</h2>
        </div>
        <div id="searchOverlayContent" class="flex-1 overflow-y-auto p-4"></div>
    </div>

    <!-- السكريبتات -->
    <script>
        // تحديث الروابط النشطة
        function setActiveNavLink(pageName) {
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.toggle('active', link.dataset.page === pageName);
            });
        }

        // فتح صفحة البحث كـ overlay
        async function openSearchOverlay() {
            const overlay = document.getElementById('searchOverlay');
            const contentDiv = document.getElementById('searchOverlayContent');
            if (!overlay || !contentDiv) return;
            try {
                const response = await fetch('search.html');
                const html = await response.text();
                contentDiv.innerHTML = html;
            } catch (e) {
                contentDiv.innerHTML = '<p class="text-gray-500 p-4">تعذر تحميل البحث</p>';
            }
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
        }

        // إغلاق طبقة البحث
        function closeSearchOverlay() {
            const overlay = document.getElementById('searchOverlay');
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
        }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
