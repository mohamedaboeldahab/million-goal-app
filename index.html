<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مليونير المستقبل | Pure Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        
        :root { --brand-color: #0ea5e9; }
        body { font-family: 'Tajawal', sans-serif; background-color: #fcfdfe; color: #1e293b; }

        /* توحيد اللون المعتمد */
        .bg-brand { background-color: var(--brand-color); }
        .text-brand { color: var(--brand-color); }
        .border-brand { border-color: var(--brand-color); }
        .ring-brand { --tw-ring-color: var(--brand-color); }

        /* خانة الرصيد - لون صافي */
        .balance-card {
            background-color: var(--brand-color);
            box-shadow: 0 15px 30px -10px rgba(14, 165, 233, 0.3);
        }

        /* تحسين شكل الخريطة */
        .roadmap-line { position: absolute; right: 24px; top: 0; bottom: 0; width: 2px; background: #f1f5f9; z-index: 0; }
        .step-node { position: relative; z-index: 1; }
        .step-dot { width: 12px; height: 12px; background: white; border: 2px solid #e2e8f0; border-radius: 50%; }
        .active .step-dot { background: var(--brand-color); border-color: #bae6fd; transform: scale(1.2); }

        /* صفحات التطبيق */
        .page { animation: fadeIn 0.3s ease-out; min-height: 70vh; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* منطقة الشات */
        #chatContainer { height: calc(100vh - 280px); scroll-behavior: smooth; }
        .nav-btn { transition: all 0.2s ease; }
        .nav-btn.active { color: var(--brand-color); }
    </style>
</head>
<body class="pb-24">

    <header class="p-5 flex justify-between items-center bg-white border-b border-slate-50 sticky top-0 z-50">
        <div>
            <h1 class="text-xl font-black text-slate-800 tracking-tight">مليونير <span class="text-brand">المستقبل</span></h1>
            <p id="progressPercent" class="text-[10px] text-slate-400 font-bold uppercase tracking-tighter mt-0.5">جاري المتابعة...</p>
        </div>
        <div class="w-10 h-10 bg-brand rounded-xl flex items-center justify-center shadow-md">
            <i class="fa-solid fa-user-tie text-white text-sm"></i>
        </div>
    </header>

    <main class="max-w-md mx-auto p-6">
        
        <div id="page-home" class="page">
            <div class="balance-card p-10 rounded-[2.5rem] text-white mb-8 relative overflow-hidden shadow-lg">
                <p class="text-white/80 text-[10px] font-black uppercase mb-3 tracking-widest text-center">رصيدك الحالي</p>
                <div class="flex items-center justify-center gap-2">
                    <input type="number" id="balance" value="7613" oninput="engine.sync()" class="bg-transparent text-5xl font-black w-full text-center outline-none">
                    <span class="text-lg font-bold opacity-80">ج.م</span>
                </div>
            </div>

            <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm mb-6">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-8 h-8 bg-sky-50 rounded-lg flex items-center justify-center text-brand">
                        <i class="fa-solid fa-comment-dots text-xs"></i>
                    </div>
                    <h3 class="text-[11px] font-black text-slate-500 uppercase tracking-widest">توصية المستشار</h3>
                </div>
                <p id="aiAdvice" class="text-sm text-slate-700 leading-relaxed font-bold mb-4">"جاري تحليل نموك المالي..."</p>
                <div class="w-full bg-slate-50 h-1.5 rounded-full overflow-hidden">
                    <div id="challengeProgress" class="bg-brand h-full transition-all duration-700" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <div id="page-roadmap" class="page hidden">
            <h2 class="text-center font-black text-slate-400 text-[10px] mb-8 uppercase tracking-[0.2em]">مسار الـ 100 محطة</h2>
            <div class="relative px-2">
                <div class="roadmap-line"></div>
                <div id="roadmapNodes" class="space-y-8"></div>
            </div>
        </div>

        <div id="page-chat" class="page hidden flex flex-col">
            <div id="chatContainer" class="overflow-y-auto p-2 space-y-4 mb-4">
                <div class="flex justify-start items-end gap-2">
                    <div class="w-7 h-7 bg-brand rounded-full flex items-center justify-center text-white text-[10px]">
                        <i class="fa-solid fa-user-tie"></i>
                    </div>
                    <div class="bg-white border border-slate-100 p-4 rounded-2xl rounded-bl-none shadow-sm text-[11px] font-bold text-slate-600 max-w-[80%]">
                        أهلاً بك! أنا مستشارك المالي المعتمد. كيف يمكنني مساعدتك اليوم؟
                    </div>
                </div>
            </div>
            <div class="flex gap-2 p-2 bg-white rounded-2xl border border-slate-100 shadow-md">
                <input type="text" id="chatInput" placeholder="اسأل المستشار..." class="flex-1 bg-transparent p-2 outline-none text-xs font-bold">
                <button onclick="engine.chat.ask()" class="w-11 h-11 bg-brand text-white rounded-xl shadow-sm flex items-center justify-center active:scale-90 transition-transform">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>

        <div id="page-calc" class="page hidden">
            <div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm space-y-6">
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase block mb-2 mr-1">الإيداع الشهري</label>
                    <input type="number" id="monthly" value="1000" class="w-full bg-slate-50 p-4 rounded-2xl outline-none border border-slate-50 focus:border-brand font-black" oninput="engine.calculate()">
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase block mb-2 mr-1">نسبة العائد %</label>
                    <input type="number" id="rate" value="18" class="w-full bg-slate-50 p-4 rounded-2xl outline-none border border-slate-50 focus:border-brand font-black" oninput="engine.calculate()">
                </div>
                <div class="p-6 bg-sky-50 rounded-2xl border border-sky-100 text-center">
                    <p id="calcResult" class="text-brand font-black text-sm">--</p>
                </div>
            </div>
        </div>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 h-20 bg-white border-t border-slate-50 flex justify-around items-center px-4 z-50">
        <button onclick="engine.nav('home')" id="btn-home" class="nav-btn flex flex-col items-center gap-1 text-brand">
            <i class="fa-solid fa-wallet text-xl"></i>
            <span class="text-[9px] font-black uppercase">الرئيسية</span>
        </button>
        <button onclick="engine.nav('roadmap')" id="btn-roadmap" class="nav-btn flex flex-col items-center gap-1 text-slate-300">
            <i class="fa-solid fa-map-location-dot text-xl"></i>
            <span class="text-[9px] font-black uppercase">الخريطة</span>
        </button>
        <button onclick="engine.nav('chat')" id="btn-chat" class="nav-btn flex flex-col items-center gap-1 text-slate-300">
            <i class="fa-solid fa-user-tie text-xl"></i>
            <span class="text-[9px] font-black uppercase">المستشار</span>
        </button>
        <button onclick="engine.nav('calc')" id="btn-calc" class="nav-btn flex flex-col items-center gap-1 text-slate-300">
            <i class="fa-solid fa-chart-line text-xl"></i>
            <span class="text-[9px] font-black uppercase">الحاسبة</span>
        </button>
    </nav>

    <script>
        const engine = {
            generateLevels(target = 1000000) {
                const steps = [];
                for (let i = 1; i <= 100; i++) {
                    steps.push({ t: (target / 100) * i, n: `المحطة ${i}` });
                }
                return steps;
            },

            sync() {
                const val = parseFloat(document.getElementById('balance').value) || 0;
                localStorage.setItem('future_millionaire_data', val);
                
                const progress = Math.min((val / 1000000) * 100, 100);
                document.getElementById('challengeProgress').style.width = progress + "%";
                document.getElementById('progressPercent').innerText = `إنجاز ${Math.floor(progress)}% من الهدف`;
                
                const levels = this.generateLevels();
                const currentLvl = levels.find(l => val < l.t) || levels[99];
                document.getElementById('aiAdvice').innerText = `أنت في طريقك نحو ${currentLvl.n}. استمر في الادخار!`;

                this.renderRoadmap(val);
                this.calculate();
            },

            renderRoadmap(val) {
                const levels = this.generateLevels();
                const container = document.getElementById('roadmapNodes');
                const idx = levels.findIndex(l => val < l.t);
                const visible = levels.slice(Math.max(0, idx - 1), idx + 10);

                container.innerHTML = visible.map(l => {
                    const active = val >= l.t;
                    return `
                        <div class="step-node flex items-center gap-6 ${active ? 'active' : ''}">
                            <div class="step-dot"></div>
                            <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex-1">
                                <h4 class="text-[11px] font-black text-slate-700">${l.n}</h4>
                                <p class="text-[10px] text-brand font-bold">${l.t.toLocaleString()} ج.م</p>
                            </div>
                        </div>
                    `;
                }).join('');
            },

            chat: {
                ask() {
                    const input = document.getElementById('chatInput');
                    if (!input.value) return;
                    const container = document.getElementById('chatContainer');
                    
                    container.innerHTML += `<div class="flex justify-end mb-4"><div class="bg-brand text-white p-3 rounded-2xl rounded-br-none text-[11px] font-bold max-w-[80%] shadow-sm">${input.value}</div></div>`;
                    
                    const text = input.value;
                    input.value = '';
                    
                    setTimeout(() => {
                        const balance = document.getElementById('balance').value;
                        let reply = `بناءً على رصيدك الحالي (${balance} ج.م)، خطتك المالية تبدو واعدة. استمر!`;
                        if(text.includes("نصيحة")) reply = "أفضل نصيحة لك هي تنويع مدخراتك لتقليل المخاطر وزيادة الأرباح.";
                        
                        container.innerHTML += `
                            <div class="flex justify-start items-end gap-2 mb-4">
                                <div class="w-7 h-7 bg-brand rounded-full flex items-center justify-center text-white text-[10px]">
                                    <i class="fa-solid fa-user-tie"></i>
                                </div>
                                <div class="bg-white border border-slate-100 p-4 rounded-2xl rounded-bl-none shadow-sm text-[11px] font-bold text-slate-600 max-w-[80%]">
                                    ${reply}
                                </div>
                            </div>`;
                        container.scrollTop = container.scrollHeight;
                    }, 600);
                }
            },

            calculate() {
                const current = parseFloat(document.getElementById('balance').value) || 0;
                const monthly = parseFloat(document.getElementById('monthly').value) || 0;
                const rate = (parseFloat(document.getElementById('rate').value) / 100) / 12;
                if (monthly <= 0) return;

                let temp = current; let months = 0;
                while (temp < 1000000 && months < 600) {
                    temp = (temp + monthly) * (1 + rate);
                    months++;
                }
                const y = Math.floor(months / 12); const m = months % 12;
                document.getElementById('calcResult').innerHTML = `الوقت المتوقع لتحقيق المليون:<br><span class="text-xl font-black">${y} سنة و ${m} شهر</span>`;
            },

            nav(id) {
                document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
                document.getElementById('page-' + id).classList.remove('hidden');
                document.querySelectorAll('.nav-btn').forEach(b => {
                    b.classList.remove('text-brand');
                    b.classList.add('text-slate-300');
                });
                document.getElementById('btn-' + id).classList.add('text-brand');
                document.getElementById('btn-' + id).classList.remove('text-slate-300');
            }
        };

        window.onload = () => {
            const saved = localStorage.getItem('future_millionaire_data');
            if (saved) document.getElementById('balance').value = saved;
            engine.sync();
        };
    </script>
</body>
</html>
